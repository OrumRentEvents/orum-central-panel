<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ORUM Preparación</title>
<link rel="manifest" href="/movil.webmanifest?v=2">
<meta name="theme-color" content="#1a1a18">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-orum.png?v=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f7f6f2; color: #1a1a18; min-height: 100vh; }
#pin-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
.pin-box { background: #fff; border: 0.5px solid #e2e2de; border-radius: 16px; padding: 2rem 1.5rem; width: 100%; max-width: 320px; text-align: center; }
.pin-logo { font-size: 13px; font-weight: 600; letter-spacing: 2px; color: #1a1a18; margin-bottom: 6px; }
.pin-subtitle { font-size: 12px; color: #9a988f; margin-bottom: 1.5rem; }
.pin-dots { display: flex; justify-content: center; gap: 12px; margin-bottom: 1.5rem; }
.pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #ccc; background: #fff; transition: all 0.1s; }
.pin-dot.filled { background: #1a1a18; border-color: #1a1a18; }
.pin-dot.error { background: #A32D2D; border-color: #A32D2D; }
.pin-error { font-size: 12px; color: #A32D2D; height: 16px; margin-bottom: 1rem; }
.pin-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pin-key { background: #f7f6f2; border: 0.5px solid #e2e2de; border-radius: 10px; padding: 16px 8px; font-size: 20px; color: #1a1a18; cursor: pointer; user-select: none; }
.pin-key:active { background: #e2e2de; }
.pin-key.delete { font-size: 16px; color: #6b6a64; }
.pin-key.empty { background: transparent; border-color: transparent; cursor: default; }
.app-header { background: #1a1a18; color: #fff; padding: 14px 16px 10px; position: sticky; top: 0; z-index: 100; }
.app-header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.app-header h1 { font-size: 15px; font-weight: 500; }
.ultima-actualizacion { font-size: 11px; color: rgba(255,255,255,0.5); margin-bottom: 10px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab-btn { flex-shrink: 0; padding: 6px 14px; font-size: 13px; background: transparent; color: rgba(255,255,255,0.6); border: none; border-radius: 6px; cursor: pointer; }
.tab-btn.active { background: rgba(255,255,255,0.15); color: #fff; font-weight: 500; }
.btn-recargar { background: transparent; border: 0.5px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.8); font-size: 12px; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
.buscador-wrap { padding: 12px 16px 4px; max-width: 680px; margin: 0 auto; }
.buscador-wrap input { width: 100%; padding: 9px 12px; font-size: 14px; border: 0.5px solid #e2e2de; border-radius: 8px; background: #fff; color: #1a1a18; }
.buscador-wrap input:focus { outline: none; border-color: #1a1a18; }
#app-body { padding: 12px 16px 16px; max-width: 680px; margin: 0 auto; }
.loading { text-align: center; padding: 3rem 1rem; color: #6b6a64; font-size: 14px; }
.subtabs { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; }
.subtabs::-webkit-scrollbar { display: none; }
.subtab-btn { flex-shrink: 0; padding: 6px 14px; border-radius: 6px; font-size: 13px; white-space: nowrap; cursor: pointer; border: 0.5px solid #e2e2de; background: #fff; color: #1a1a18; }
.subtab-btn.active { background: #1a1a18; color: #fff; border-color: #1a1a18; }
.periodo-header { font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: #6b6a64; margin: 20px 0 8px; }
.periodo-header:first-child { margin-top: 0; }
.periodo-progress { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.progress-bar-bg { flex: 1; height: 4px; background: #e2e2de; border-radius: 2px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: #1D9E75; border-radius: 2px; }
.progress-text { font-size: 11px; color: #6b6a64; white-space: nowrap; }
.proyecto-card { background: #fff; border: 0.5px solid #e2e2de; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
.proyecto-card:active { background: #f7f6f2; }
.proyecto-card.listo { border-color: #9FE1CB; background: #f4fcf9; }
.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.card-numero-wrap { display: flex; align-items: center; gap: 6px; }
.card-numero { font-size: 11px; color: #6b6a64; font-weight: 500; }
.copy-btn { font-size: 10px; color: #9a988f; background: #f0f0ec; border: none; border-radius: 4px; padding: 1px 5px; cursor: pointer; }
.card-cliente { font-size: 15px; font-weight: 500; color: #1a1a18; flex: 1; }
.badge-estado { font-size: 11px; padding: 2px 8px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
.badge-listo { background: #E1F5EE; color: #0F6E56; }
.badge-confirmado { background: #E6F1FB; color: #185FA5; }
.badge-warning { background: #FAEEDA; color: #854F0B; }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: #6b6a64; }
.familia-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #fff; border: 0.5px solid #e2e2de; border-radius: 10px; margin-bottom: 4px; cursor: pointer; user-select: none; }
.familia-nombre { font-size: 13px; font-weight: 500; }
.familia-chevron { font-size: 12px; color: #6b6a64; transition: transform 0.2s; }
.familia-chevron.open { transform: rotate(180deg); }
.familia-body { display: none; margin-bottom: 8px; }
.familia-body.open { display: block; }
.articulo-row { padding: 8px 14px; background: #fff; border: 0.5px solid #e2e2de; border-top: none; font-size: 13px; }
.articulo-row:last-child { border-radius: 0 0 8px 8px; }
.articulo-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.articulo-nombre { color: #1a1a18; flex: 1; }
.articulo-total { font-weight: 500; font-size: 15px; color: #1a1a18; margin-left: 12px; }
.articulo-proy-item { display: flex; align-items: center; justify-content: space-between; padding: 3px 0; border-bottom: 0.5px solid #f0f0ec; font-size: 12px; }
.articulo-proy-item:last-child { border-bottom: none; }
.servicio-grupo { background: #fff; border: 0.5px solid #e2e2de; border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
.servicio-grupo-header { padding: 10px 14px; font-size: 13px; font-weight: 500; border-bottom: 0.5px solid #e2e2de; background: #f7f6f2; }
.servicio-item { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; font-size: 13px; border-bottom: 0.5px solid #f0f0ec; }
.servicio-item:last-child { border-bottom: none; }
.logistica-seccion { margin-bottom: 16px; }
.logistica-titulo { font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: #6b6a64; margin-bottom: 8px; }
#modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end; justify-content: center; }
#modal-overlay.open { display: flex; }
#modal-box { background: #fff; border-radius: 16px 16px 0 0; width: 100%; max-width: 680px; max-height: 80vh; overflow-y: auto; padding: 0 0 2rem; }
.modal-header { position: sticky; top: 0; background: #fff; padding: 16px 16px 12px; border-bottom: 0.5px solid #e2e2de; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.modal-titulo { font-size: 15px; font-weight: 500; flex: 1; }
.modal-numero { font-size: 11px; color: #6b6a64; margin-bottom: 2px; }
.modal-close { background: #f0f0ec; border: none; border-radius: 50%; width: 28px; height: 28px; font-size: 16px; cursor: pointer; flex-shrink: 0; }
.modal-body { padding: 12px 16px; }
.modal-seccion { font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: #6b6a64; margin: 12px 0 6px; }
.modal-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 0.5px solid #f0f0ec; font-size: 13px; }
.modal-item:last-child { border-bottom: none; }
/* Columnas Pendiente / Preparado (como en el panel de escritorio) */
.columnas { display: grid; grid-template-columns: 1fr; gap: 0 12px; }
.col-titulo { font-size: 12px; font-weight: 600; margin: 4px 0 6px; }
.col-titulo.pend { color: #854F0B; }
.col-titulo.prep { color: #0F6E56; }
.col-vacia { font-size: 12px; color: #9a988f; padding: 6px 0 12px; }
@media (min-width: 700px) {
  .columnas { grid-template-columns: 1fr 1fr; }
  #app-body, .buscador-wrap { max-width: 1100px; }
}
.zona-prog { font-size: 11px; color: #6b6a64; margin-left: auto; white-space: nowrap; }
.zona-prog.ok { color: #0F6E56; font-weight: 600; }
/* Check por artículo */
.chk { width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid #c9c6bb; background: #fff; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; margin-right: 10px; }
.chk svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.chk.on { background: #1D9E75; border-color: #1D9E75; }
.chk.on svg { opacity: 1; }
.chk.guardando { opacity: .5; }
.chk.solo-ver { cursor: default; }
.modal-item.on, .articulo-proy-item.on { color: #0F6E56; }
.quien { font-size: 10px; color: #9a988f; display: block; }
.aviso-cambio { font-size: 11px; color: #854F0B; background: #FAEEDA; border-radius: 4px; padding: 1px 6px; display: inline-block; margin-top: 2px; }
.articulo-proy-item .chk { width: 26px; height: 26px; margin-right: 8px; }
.zona-chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.zona-chip { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #f0efe9; color: #6b6a64; }
.zona-chip.parcial { background: #FAEEDA; color: #854F0B; }
.zona-chip.ok { background: #E1F5EE; color: #0F6E56; font-weight: 600; }
span.chk { margin-right: 10px; }
/* Notas por proyecto */
.notas-chip { font-size: 11px; color: #854F0B; background: #FAEEDA; border-radius: 10px; padding: 1px 8px; }
.notas-lista { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.nota { background: #fdf8ee; border: 0.5px solid #f0d9a8; border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.nota-cab { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #6b6a64; margin-bottom: 3px; }
.nota-cab b { color: #1a1a18; font-weight: 600; }
.nota-cab .zona { background: #fff; border: 0.5px solid #e2e2de; border-radius: 8px; padding: 0 6px; }
.nota-cab .acc { margin-left: auto; display: flex; gap: 2px; }
.nota-cab .acc button { background: none; border: none; color: #8a6d1e; font-size: 12px; cursor: pointer; padding: 2px 6px; }
.nota-texto { white-space: pre-wrap; word-break: break-word; }
.nota-nueva { display: flex; gap: 8px; align-items: flex-end; }
.nota-nueva textarea { flex: 1; min-height: 44px; max-height: 140px; padding: 9px 10px; font-size: 14px; font-family: inherit; border: 0.5px solid #d8d4c8; border-radius: 8px; resize: vertical; }
.nota-nueva textarea:focus { outline: none; border-color: #1a1a18; }
.nota-nueva button { background: #1a1a18; color: #fff; border: none; border-radius: 8px; padding: 11px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
.nota-nueva button:disabled { opacity: .5; }
/* Por día */
.dia-barra { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.dia-barra button { background: #fff; border: 0.5px solid #e2e2de; border-radius: 8px; width: 40px; height: 40px; font-size: 18px; cursor: pointer; }
.dia-barra input { flex: 1; padding: 9px 10px; font-size: 15px; border: 0.5px solid #e2e2de; border-radius: 8px; background: #fff; color: #1a1a18; }
.dia-rapidos { display: flex; gap: 6px; margin: -6px 0 14px; }
.dia-rapidos button { font-size: 12px; padding: 5px 10px; border-radius: 14px; border: 0.5px solid #e2e2de; background: #fff; cursor: pointer; }
.dia-rapidos button.active { background: #1a1a18; color: #fff; border-color: #1a1a18; }
.dia-titulo { font-size: 13px; color: #6b6a64; margin-bottom: 10px; }
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a1a18; color: #fff; font-size: 13px; padding: 8px 16px; border-radius: 20px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 300; }
#toast.show { opacity: 1; }
/* Quién ha preparado y contenedores (por zona) */
.prep-bloque { background: #f7f7f3; border-radius: 10px; padding: 10px 12px; margin: 10px 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.prep-bloque .fila { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.prep-bloque .zona-nom { font-weight: 600; }
.prep-bloque .falta { color: #854F0B; background: #FAEEDA; border-radius: 4px; padding: 1px 6px; font-size: 12px; }
.prep-bloque .nombres { color: #0F6E56; }
.btn-sec { background: #fff; border: 0.5px solid #d8d4c8; border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
.cont-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
.cont-item { display: flex; align-items: center; gap: 8px; background: #fff; border: 0.5px solid #e2e2de; border-radius: 8px; padding: 6px 8px; }
.cont-item span { flex: 1; min-width: 0; }
.cont-item button { width: 34px; height: 34px; border-radius: 8px; border: 0.5px solid #d8d4c8; background: #f0f0ec; font-size: 18px; cursor: pointer; flex-shrink: 0; }
.cont-item b { min-width: 24px; text-align: center; font-variant-numeric: tabular-nums; }
.card-quien { font-size: 11px; color: #0F6E56; margin-top: 4px; }
/* Material de la ficha: por zona y familia */
.mat-zona { font-size: 13px; font-weight: 700; margin: 16px 0 6px; padding-bottom: 4px; border-bottom: 1.5px solid #1a1a18; }
.fam-bloque { border: 0.5px solid #e2e2de; border-radius: 10px; padding: 4px 12px 2px; margin-bottom: 10px; background: #fff; }
.fam-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0 6px; border-bottom: 0.5px solid #f0f0ec; }
.fam-nom { font-size: 12px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: #4a4944; }
.fam-quien { font-size: 11px; color: #0F6E56; padding: 4px 0 2px; }
.art-nom { flex: 1; min-width: 0; word-break: break-word; }
.art-cant { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }
.persona-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: #E1F5EE; color: #0F6E56; border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-size: 14px; }
.persona-bar.falta { background: #FAEEDA; color: #854F0B; }
.persona-bar b { flex: 1; min-width: 0; }
#quien-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 250; align-items: center; justify-content: center; padding: 16px; }
#quien-overlay.open { display: flex; }
#quien-box { background: #fff; border-radius: 14px; width: 100%; max-width: 520px; max-height: 85vh; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
#quien-box h3 { margin: 0; font-size: 17px; }
#quien-box p { margin: 0; font-size: 13px; color: #6b6a64; }
.quien-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.quien-chip { border: 1px solid #d8d4c8; background: #fff; border-radius: 20px; padding: 9px 14px; font-size: 14px; cursor: pointer; font-family: inherit; }
.quien-chip.on { background: #1D9E75; border-color: #1D9E75; color: #fff; font-weight: 600; }
.quien-otro { display: flex; gap: 8px; }
.quien-otro input { flex: 1; padding: 9px 10px; font-size: 14px; border: 0.5px solid #d8d4c8; border-radius: 8px; font-family: inherit; }
.quien-acc { display: flex; justify-content: flex-end; gap: 8px; }
.quien-acc .ok { background: #1a1a18; color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
.quien-acc .ok:disabled { opacity: .5; }
.quien-overlay-gen { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 250; align-items: center; justify-content: center; padding: 16px; }
.quien-overlay-gen.open { display: flex; }
.quien-box-gen { background: #fff; border-radius: 14px; width: 100%; max-width: 560px; max-height: 85vh; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.quien-box-gen h3 { margin: 0; font-size: 17px; }
.quien-box-gen p { margin: 0; font-size: 13px; color: #6b6a64; }
.pers-zona { border: 0.5px solid #e2e2de; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.pers-zona h4 { margin: 0; font-size: 14px; }
.pers-lista { display: flex; flex-wrap: wrap; gap: 6px; }
.pers-chip { display: inline-flex; align-items: center; gap: 6px; background: #f0efe9; border-radius: 16px; padding: 5px 6px 5px 12px; font-size: 13px; }
.pers-chip button { border: none; background: #fff; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; color: #993C1D; font-size: 12px; }
.inc-btn { float: right; margin: 0 0 8px 8px; border: 0.5px solid #F0997B; background: #FAECE7; color: #993C1D; font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-family: inherit; }
</style>
</head>
<body>

<div id="pin-screen" style="display:none;">
  <div class="pin-box">
    <div class="pin-logo">ORUM</div>
    <div class="pin-subtitle">Introduce tu PIN de acceso</div>
    <div class="pin-dots">
      <div class="pin-dot" id="d0"></div>
      <div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div>
      <div class="pin-dot" id="d3"></div>
    </div>
    <div class="pin-error" id="pin-error"></div>
    <div class="pin-keypad" id="keypad"></div>
  </div>
</div>

<div id="app" style="display:none;">
  <div class="app-header">
    <div class="app-header-top">
      <button class="btn-recargar" id="btn-inicio" style="display:none;margin-right:10px;">&lsaquo; Inicio</button>
      <h1 id="app-titulo" style="flex:1;">ORUM</h1>
      <button class="btn-recargar" id="btn-salir" style="display:none;margin-right:8px;">Salir</button>
      <button class="btn-recargar" id="btn-recargar">Recargar</button>
    </div>
    <div class="ultima-actualizacion" id="ultima-act">Cargando...</div>
    <div class="tabs" id="tabs-container"></div>
  </div>
  <div class="buscador-wrap" id="buscador-wrap" style="display:none;">
    <input type="text" id="buscador" placeholder="Buscar cliente o nº de proyecto...">
  </div>
  <div id="app-body"><div class="loading">Cargando datos...</div></div>
</div>

<div id="modal-overlay">
  <div id="modal-box">
    <div class="modal-header">
      <div>
        <div class="modal-numero" id="modal-numero"></div>
        <div class="modal-titulo" id="modal-titulo"></div>
      </div>
      <button class="modal-close" id="modal-close-btn">X</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- Lista de personas de cada zona (Logística y Dirección) -->
<div id="personas-overlay" class="quien-overlay-gen">
  <div class="quien-box-gen">
    <h3>Personas que preparan</h3>
    <p>Salen en «¿Quién prepara?» de cada tablet. Nombre y apellido, con tilde.</p>
    <div id="personas-zonas"></div>
    <div class="quien-acc"><button class="ok" id="personas-cerrar">Cerrar</button></div>
  </div>
</div>

<!-- ¿Quién ha preparado? Sale solo al marcar el último artículo de la zona -->
<div id="quien-overlay">
  <div id="quien-box">
    <h3 id="quien-titulo">¿Quién ha preparado el proyecto?</h3>
    <p id="quien-sub">Toca los nombres de quienes lo han preparado.</p>
    <div class="quien-chips" id="quien-chips"></div>
    <div class="quien-otro">
      <input type="text" id="quien-otro-txt" placeholder="Otra persona: nombre y apellido">
      <button class="btn-sec" id="quien-otro-btn">Añadir</button>
    </div>
    <div class="quien-acc">
      <button class="btn-sec" id="quien-cancelar">Más tarde</button>
      <button class="ok" id="quien-guardar">Guardar</button>
    </div>
  </div>
</div>

<div id="toast">Copiado</div>

<script>
var PINES = {
  '1111': { token: 'ORUMx2026Lav', nombre: 'Lavandería', tabs: ['lavanderia'] },
  '2222': { token: 'ORUMx2026Off', nombre: 'Office', tabs: ['office'] },
  '3333': { token: 'ORUMx2026Alm', nombre: 'Almacén', tabs: ['almacen'] }
};
var TAB_NOMBRES = { lavanderia: 'Lavandería', office: 'Office', almacen: 'Almacén' };
// Nombre en pantalla de las subpestañas (la clave interna sigue sin tilde)
var SUBTAB_NOMBRES = { 'Por dia': 'Por día', 'Logistica': 'Logística' };
var TAB_SUBTABS = {
  lavanderia: ['Por proyecto', 'Por material', 'Por dia'],
  office: ['Por proyecto', 'Por material', 'Por dia'],
  almacen: ['Por proyecto', 'Por material', 'Por dia', 'Servicios', 'Logistica']
};
var CON_BUSCADOR = { 'Por proyecto': 'Buscar cliente o nº de proyecto...', 'Por material': 'Buscar material (p. ej. silla, mantel, copa)...', 'Por dia': 'Buscar material o cliente...' };
var ICONO_CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>';
var diaElegido = null; // 'YYYY-MM-DD'

// Desde la app móvil (/movil) se entra con la sesión de la persona, sin estos
// PIN: Dirección y Logística ven las tres zonas; las tablets de Lavandería y
// Office (roles del mismo nombre) solo la suya. Los PIN de arriba siguen
// valiendo mientras se pasa todo el mundo a la app.
var TABS_POR_ROL = { Lavanderia: ['lavanderia'], Office: ['office'] };
var ROLES_TABLET = ['Lavanderia', 'Office'];
var CLAVE_DISPOSITIVO = 'orum_movil_dispositivo';

var pinActual = '';
var perfilActivo = null;
var tabActiva = null;
var subtabActiva = 'Por proyecto';
var datosCache = {};
var equipmentCache = {};
var filtroTexto = '';
var CONTENEDORES = []; // [{id, nombre}] — los manda el servidor
var PERSONAL = { lavanderia: [], office: [] }; // plantilla de cada zona, para "¿Quién ha preparado?"

function initKeypad() {
  var kp = document.getElementById('keypad');
  var keys = ['1','2','3','4','5','6','7','8','9','','0','del'];
  keys.forEach(function(k) {
    var btn = document.createElement('button');
    if (k === '') {
      btn.className = 'pin-key empty';
    } else if (k === 'del') {
      btn.className = 'pin-key delete';
      btn.textContent = '<<';
      btn.addEventListener('click', function() { pinBorrar(); });
    } else {
      btn.className = 'pin-key';
      btn.textContent = k;
      (function(num) {
        btn.addEventListener('click', function() { pinKey(num); });
      })(k);
    }
    kp.appendChild(btn);
  });
}

function pinKey(n) {
  if (pinActual.length >= 4) return;
  pinActual += n;
  actualizarDots(false);
  if (pinActual.length === 4) validarPin();
}

function pinBorrar() {
  pinActual = pinActual.slice(0, -1);
  document.getElementById('pin-error').textContent = '';
  actualizarDots(false);
}

function actualizarDots(error) {
  for (var i = 0; i < 4; i++) {
    var d = document.getElementById('d' + i);
    d.className = 'pin-dot';
    if (error) d.classList.add('error');
    else if (i < pinActual.length) d.classList.add('filled');
  }
}

function validarPin() {
  var perfil = PINES[pinActual];
  if (!perfil) {
    document.getElementById('pin-error').textContent = 'PIN incorrecto';
    actualizarDots(true);
    setTimeout(function() {
      pinActual = '';
      actualizarDots(false);
      document.getElementById('pin-error').textContent = '';
    }, 800);
    return;
  }
  perfilActivo = perfil;
  tabActiva = perfil.tabs[0];
  document.getElementById('pin-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('app-titulo').textContent = 'ORUM - ' + perfil.nombre;
  construirTabs();
  cargarDatos(tabActiva);
}

function construirTabs() {
  var cont = document.getElementById('tabs-container');
  cont.innerHTML = '';
  perfilActivo.tabs.forEach(function(tab) {
    var btn = document.createElement('button');
    btn.className = 'tab-btn' + (tab === tabActiva ? ' active' : '');
    btn.textContent = TAB_NOMBRES[tab];
    (function(t) { btn.addEventListener('click', function() { cambiarTab(t); }); })(tab);
    cont.appendChild(btn);
  });
}

function cambiarTab(tab) {
  tabActiva = tab;
  subtabActiva = 'Por proyecto';
  filtroTexto = '';
  var b = document.getElementById('buscador');
  if (b) b.value = '';
  construirTabs();
  if (datosCache[tab]) { guardarDatos(tab, datosCache[tab]); renderizar(datosCache[tab]); }
  else cargarDatos(tab);
}

function cargarDatos(tab) {
  document.getElementById('app-body').innerHTML = '<div class="loading">Cargando...</div>';
  document.getElementById('buscador-wrap').style.display = 'none';
  var url = perfilActivo.sesion
    ? '/api/preparacion?vista=' + tab + '&t=' + Date.now()
    : '/api/preparacion-publica?token=' + perfilActivo.token + '&vista=' + tab + '&t=' + Date.now();
  fetch(url).then(function(r) {
    // Sesión caducada (p. ej. tras publicar una versión nueva): se vuelve a entrar con la llave del dispositivo
    if (r.status === 401 && perfilActivo.sesion) { location.reload(); return new Promise(function() {}); }
    return r.json();
  }).then(function(data) {
    if (data.error) { document.getElementById('app-body').innerHTML = '<div class="loading">Error: ' + data.error + '</div>'; return; }
    guardarDatos(tab, data);
    renderizar(data);
    document.getElementById('ultima-act').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-ES', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }).catch(function() {
    document.getElementById('app-body').innerHTML = '<div class="loading">Error de conexión</div>';
  });
}

function recargar() { datosCache = {}; cargarDatos(tabActiva); }

function renderizar(data) {
  var subtabs = TAB_SUBTABS[tabActiva];
  var html = '<div class="subtabs">';
  subtabs.forEach(function(st) {
    html += '<button class="subtab-btn' + (st === subtabActiva ? ' active' : '') + '" data-st="' + st + '">' + (SUBTAB_NOMBRES[st] || st) + '</button>';
  });
  html += '</div>';
  document.getElementById('buscador-wrap').style.display = CON_BUSCADOR[subtabActiva] ? 'block' : 'none';
  if (CON_BUSCADOR[subtabActiva]) document.getElementById('buscador').placeholder = CON_BUSCADOR[subtabActiva];
  if (subtabActiva === 'Por proyecto') html += renderPorProyecto(data);
  else if (subtabActiva === 'Por material') html += renderPorMaterial(data);
  else if (subtabActiva === 'Por dia') html += renderPorDia(data);
  else if (subtabActiva === 'Servicios') html += renderServicios(data);
  else if (subtabActiva === 'Logistica') html += renderLogistica(data);
  document.getElementById('app-body').innerHTML = html;
  document.querySelectorAll('.subtab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() { cambiarSubtab(btn.getAttribute('data-st')); });
  });
}

function cambiarSubtab(st) {
  subtabActiva = st;
  filtroTexto = '';
  var b = document.getElementById('buscador');
  if (b) b.value = '';
  if (datosCache[tabActiva]) renderizar(datosCache[tabActiva]);
}

function esListo(estado) {
  var e = (estado || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  return ['returned','cargado','marbella','on location','controlado','preparado','ejecucion realizada','redondeado'].some(function(x) { return e.indexOf(x) !== -1; });
}

function estadoBadge(estado) {
  var e = (estado || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  if (['returned','cargado','marbella','on location','controlado','preparado','ejecucion realizada','redondeado'].some(function(x) { return e.indexOf(x) !== -1; }))
    return '<span class="badge-estado badge-listo">' + estado + '</span>';
  if (['pending','concept','inquiry'].some(function(x) { return e.indexOf(x) !== -1; }))
    return '<span class="badge-estado badge-warning">' + estado + '</span>';
  return '<span class="badge-estado badge-confirmado">' + estado + '</span>';
}

function renderPorProyecto(data) {
  var resumen = {};
  (data.resumen_periodos || []).forEach(function(r) { resumen[r.periodo] = r; });
  var html = '';
  (data.orden_periodos || []).forEach(function(periodo) {
    var r = resumen[periodo] || { listos: 0, total: 0 };
    var pp = data.por_proyecto[periodo] || { confirmado: [], preparado: [] };
    pp.confirmado.forEach(function(p) { p._listo = false; });
    pp.preparado.forEach(function(p) { p._listo = true; });
    var todos = pp.confirmado.concat(pp.preparado);
    if (filtroTexto) {
      todos = todos.filter(function(p) {
        return (p.cliente || '').toLowerCase().indexOf(filtroTexto) !== -1 || String(p.numero || '').indexOf(filtroTexto) !== -1;
      });
    }
    if (!filtroTexto && r.total === 0) return;
    if (filtroTexto && !todos.length) return;
    var pct = r.total > 0 ? Math.round((r.listos / r.total) * 100) : 0;
    html += '<div class="periodo-header">' + periodo + '</div>';
    if (!filtroTexto) html += '<div class="periodo-progress"><div class="progress-bar-bg"><div class="progress-bar-fill" style="width:' + pct + '%"></div></div><span class="progress-text">' + r.listos + '/' + r.total + '</span></div>';
    var porFecha = function(a, b) { return fechaOrden(a) .localeCompare(fechaOrden(b)); };
    var pend = todos.filter(function(p) { return !p._listo; }).sort(porFecha);
    var prep = todos.filter(function(p) { return p._listo; }).sort(porFecha);
    html += '<div class="columnas"><div><div class="col-titulo pend">Pendiente de preparar (' + pend.length + ')</div>' + (pend.map(tarjetaProyecto).join('') || '<div class="col-vacia">Nada pendiente</div>') + '</div>';
    html += '<div><div class="col-titulo prep">Preparado (' + prep.length + ')</div>' + (prep.map(tarjetaProyecto).join('') || '<div class="col-vacia">Nada preparado todavía</div>') + '</div></div>';
  });
  if (!html) return '<div class="loading">No hay proyectos</div>';
  return html;
}

function fechaOrden(p) { return (p.fecha_entrega || '').split('/').reverse().join('-') + ' ' + (p.entrega_hora || ''); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function tarjetaProyecto(p) {
  var num = String(p.numero || '');
  var pid = JSON.stringify(p).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
  var h = '<div class="proyecto-card' + (p._listo ? ' listo' : '') + '" data-p="' + pid + '">';
  h += '<div class="card-top"><div style="flex:1">';
  h += '<div class="card-numero-wrap"><span class="card-numero">#' + num + '</span>';
  h += '<button class="copy-btn" data-num="' + num + '">copiar</button></div>';
  h += '<div class="card-cliente">' + esc(p.cliente || '-') + '</div>';
  h += '</div>' + (p.zona_preparada ? '<span class="badge-estado badge-listo">Preparado</span>' : estadoBadge(p.estado)) + '</div>';
  h += '<div class="card-meta">';
  if (p.fecha_entrega) h += '<span>Fecha: ' + p.fecha_entrega + (p.entrega_hora ? ' ' + p.entrega_hora : '') + '</span>';
  if (p.localizacion) h += '<span>Loc: ' + esc(p.localizacion) + '</span>';
  if (p.notas && p.notas.length) h += '<span class="notas-chip" title="Notas">💬 ' + p.notas.length + '</span>';
  if (zonaActual() && p.zona_total) h += '<span class="zona-prog' + (p.zona_preparada ? ' ok' : '') + '">' + p.zona_marcados + '/' + p.zona_total + ' marcados</span>';
  h += '</div>' + zonasTexto(p) + quienTexto(p) + '</div>';
  return h;
}

// "Preparado por ..." en la tarjeta (en Almacén, de cada zona)
function quienTexto(p) {
  var pz = p.prep_zona || {}, partes = [];
  (zonaActual() ? [zonaActual()] : ['lavanderia', 'office']).forEach(function(z) {
    var n = (pz[z] && pz[z].preparadores) || [];
    // Mientras no se ha cerrado la zona, se ve quién lo está preparando
    if (!n.length && pz[z] && pz[z].preparando) n = [pz[z].preparando + ' (preparando)'];
    if (n.length) partes.push((zonaActual() ? '' : TAB_NOMBRES[z] + ': ') + n.join(', '));
  });
  return partes.length ? '<div class="card-quien">' + esc(partes.join(' · ')) + '</div>' : '';
}

// En Almacén: cómo van Lavandería y Office con ese proyecto
function zonasTexto(p) {
  if (zonaActual() || !p.zonas) return '';
  var partes = [];
  ['lavanderia', 'office'].forEach(function(z) {
    var pr = p.zonas[z];
    if (!pr || !pr.total) return;
    var ok = pr.marcados === pr.total;
    partes.push('<span class="zona-chip' + (ok ? ' ok' : pr.marcados ? ' parcial' : '') + '">' + TAB_NOMBRES[z] + ' ' + (ok ? '✓ ' : '') + pr.marcados + '/' + pr.total + '</span>');
  });
  return partes.length ? '<div class="zona-chips">' + partes.join('') + '</div>' : '';
}

// ── Checks por artículo (Lavandería y Office) ──
function zonaActual() { return (tabActiva === 'lavanderia' || tabActiva === 'office') ? tabActiva : null; }
function puedeMarcar() {
  if (!zonaActual() || !perfilActivo || !perfilActivo.sesion) return false;
  var propia = TABS_POR_ROL[perfilActivo.rol];
  return propia ? propia[0] === tabActiva : ['Direccion', 'Logistica'].indexOf(perfilActivo.rol) !== -1;
}
function botonCheck(pid, articulo, check) {
  if (!check) return '';
  if (!zonaActual()) return '<span class="chk solo-ver' + (check.marcado ? ' on' : '') + '" title="' + (check.marcado ? 'Preparado en ' : 'Pendiente en ') + TAB_NOMBRES[check.zona] + '">' + ICONO_CHECK + '</span>';
  var on = check.marcado;
  var attrs = puedeMarcar() ? ' data-chk="1" data-pid="' + esc(pid) + '" data-art="' + esc(articulo) + '" data-on="' + (on ? 1 : 0) + '"' : '';
  return '<button class="chk' + (on ? ' on' : '') + (puedeMarcar() ? '' : ' solo-ver') + '"' + attrs + ' aria-label="' + (on ? 'Preparado' : 'Marcar como preparado') + '">' + ICONO_CHECK + '</button>';
}
function textoCheck(check) {
  if (!check) return '';
  if (check.marcado && check.usuario) {
    var h = check.marcado_en ? new Date(check.marcado_en).toLocaleString('es-ES', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
    return '<span class="quien">' + esc(check.usuario) + (h ? ' · ' + h : '') + '</span>';
  }
  if (check.cambio) return '<span class="aviso-cambio">Cantidad cambiada en Rentman: ' + check.cambio.antes + ' → ' + check.cambio.ahora + '. Vuelve a marcar</span>';
  return '';
}
var proyectoModal = null;
// La tablet entra con un usuario compartido. Cada proyecto guarda (en el servidor,
// sql/preparacion_zona.sql) quién lo está preparando en esa zona: se elige una vez
// y se queda, aunque se cierre la ficha o se abra en otra tablet, hasta que alguien
// pulse «No soy yo». Lo que se marque en ese proyecto va a su nombre.
function personaProyecto(p, zona) { return (p && datosZona(p, zona).preparando) || ''; }
function elegirPersona(p, zona, despues) {
  abrirQuien(p, zona, { uno: true, despues: function(n) {
    guardarZona(p.id, zona, { preparando: n }).then(function() {
      if (proyectoModal) abrirModal(proyectoModal); else if (datosCache[tabActiva]) renderizar(datosCache[tabActiva]);
      if (despues) despues();
    }).catch(function(err) { mostrarToast(err.message); });
  } });
}

function marcarArticulo(btn) {
  if (btn.classList.contains('guardando')) return;
  var marcado = btn.getAttribute('data-on') !== '1';
  var pid = btn.getAttribute('data-pid'), art = btn.getAttribute('data-art');
  var proyecto = proyectoModal && String(proyectoModal.id) === String(pid) ? proyectoModal : buscarProyecto(pid);
  var persona = personaProyecto(proyecto, tabActiva);
  // Proyecto sin persona todavía: primero se pregunta quién lo prepara y luego se marca
  if (marcado && !persona && proyecto) { elegirPersona(proyecto, tabActiva, function() { marcarArticulo(btn); }); return; }
  btn.classList.add('guardando');
  fetch('/api/preparacion/check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ proyecto_id: pid, area: tabActiva, articulo: art, marcado: marcado, persona: persona }) })
    .then(function(r) { return r.json().then(function(d) { d._ok = r.ok; return d; }); })
    .then(function(d) {
      btn.classList.remove('guardando');
      if (!d._ok || d.error) { mostrarToast(d.error || 'No se ha podido guardar'); return; }
      // Se aplica en lo que ya hay en pantalla y se recargan los datos en segundo plano
      aplicarCheckLocal(pid, art, d.check);
      if (proyectoModal) abrirModal(proyectoModal);
      else if (datosCache[tabActiva]) renderizar(datosCache[tabActiva]);
      mostrarToast(marcado ? 'Marcado como preparado' : 'Desmarcado');
      // Último artículo de la zona: se pregunta quién lo ha preparado (si nadie lo ha dicho aún)
      if (marcado && proyecto && zonaCompletaLocal(pid, tabActiva) && !preparadoresDe(proyecto, tabActiva).length) abrirQuien(proyecto, tabActiva);
      recargarSilencioso();
    })
    .catch(function() { btn.classList.remove('guardando'); mostrarToast('Sin conexión'); });
}
function aplicarCheckLocal(pid, art, check) {
  var d = datosCache[tabActiva];
  if (!d) return;
  (equipmentCache[String(pid)] || []).forEach(function(e) { if (e.articulo === art) e.check = check; });
  (d.lineas_dia || []).forEach(function(l) { if (String(l.proyecto_id) === String(pid) && l.articulo === art) l.check = check; });
  (d.por_material || []).forEach(function(f) { f.articulos.forEach(function(a) { if (a.articulo === art) a.detalle.forEach(function(x) { if (String(x.proyecto_id) === String(pid)) x.check = check; }); }); });
}
function recargarSilencioso() {
  var tab = tabActiva;
  var url = perfilActivo.sesion ? '/api/preparacion?vista=' + tab + '&t=' + Date.now() : '/api/preparacion-publica?token=' + perfilActivo.token + '&vista=' + tab + '&t=' + Date.now();
  fetch(url).then(function(r) { return r.ok ? r.json() : null; }).then(function(data) {
    if (!data || data.error || tab !== tabActiva) return;
    guardarDatos(tab, data);
    // No se repinta con el detalle de un proyecto abierto ni mientras se escribe en el buscador
    if (!proyectoModal && document.activeElement !== document.getElementById('buscador') && document.activeElement !== document.getElementById('dia-input')) renderizar(data);
    else if (proyectoModal && !document.activeElement.matches('#nota-txt, #nota-edit-txt') && notaEditando === null && !contPendiente) {
      var todos = [];
      (data.orden_periodos || []).forEach(function(per) { var pp = data.por_proyecto[per]; if (pp) todos = todos.concat(pp.confirmado, pp.preparado); });
      var nuevo = todos.filter(function(p) { return String(p.id) === String(proyectoModal.id); })[0];
      if (nuevo) { proyectoModal = nuevo; abrirModal(nuevo); }
    }
    document.getElementById('ultima-act').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-ES', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }).catch(function() {});
}
function guardarDatos(tab, data) {
  datosCache[tab] = data;
  if (data.contenedores_office) CONTENEDORES = data.contenedores_office;
  if (data.personal) PERSONAL = data.personal;
  equipmentCache = {};
  (data.equipment_detalle || []).forEach(function(e) {
    var pid = String(e.proyecto_id);
    if (!equipmentCache[pid]) equipmentCache[pid] = [];
    equipmentCache[pid].push(e);
  });
}

// ── Notas por proyecto (las ven todas las zonas) ──
var ZONA_NOTA = { almacen: 'Almacén', lavanderia: 'Lavandería', office: 'Office' };
var notaEditando = null;
function htmlNotas(p) {
  var notas = p.notas || [];
  var h = '<div class="modal-seccion">Notas' + (notas.length ? ' (' + notas.length + ')' : '') + '</div><div class="notas-lista">';
  notas.forEach(function(n) {
    var mia = perfilActivo && perfilActivo.sesion && n.usuario === perfilActivo.usuario;
    var puedeBorrar = mia || (perfilActivo && ['Direccion', 'Logistica'].indexOf(perfilActivo.rol) !== -1);
    var cuando = new Date(n.creado_en).toLocaleString('es-ES', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    h += '<div class="nota"><div class="nota-cab"><b>' + esc(n.autor) + '</b><span class="zona">' + (ZONA_NOTA[n.zona] || n.zona) + '</span><span>' + cuando + (n.editado_en ? ' · editada' : '') + '</span>' +
      '<span class="acc">' + (mia ? '<button data-nota-editar="' + n.id + '">Editar</button>' : '') + (puedeBorrar ? '<button data-nota-borrar="' + n.id + '">Borrar</button>' : '') + '</span></div>';
    h += notaEditando === n.id
      ? '<div class="nota-nueva"><textarea id="nota-edit-txt" maxlength="1000">' + esc(n.texto) + '</textarea><button data-nota-guardar="' + n.id + '">Guardar</button></div>'
      : '<div class="nota-texto">' + esc(n.texto) + '</div>';
    h += '</div>';
  });
  h += '</div>';
  if (perfilActivo && perfilActivo.sesion) h += '<div class="nota-nueva"><textarea id="nota-txt" maxlength="1000" placeholder="Escribe un aviso para los demás…"></textarea><button data-nota-nueva="' + p.id + '">Añadir</button></div>';
  return h;
}
function peticionNota(metodo, url, cuerpo) {
  return fetch(url, { method: metodo, headers: { 'Content-Type': 'application/json' }, body: cuerpo ? JSON.stringify(cuerpo) : undefined })
    .then(function(r) { return r.json().catch(function() { return {}; }).then(function(d) { if (!r.ok || d.error) throw new Error(d.error || 'Error ' + r.status); return d; }); });
}
function accionNota(el) {
  if (!proyectoModal) return;
  var p = proyectoModal;
  var listo = function(msg) { notaEditando = null; mostrarToast(msg); abrirModal(p); recargarSilencioso(); };
  var fallo = function(e) { el.disabled = false; mostrarToast(e.message); };
  if (el.hasAttribute('data-nota-nueva')) {
    var txt = document.getElementById('nota-txt').value.trim();
    if (!txt) return;
    el.disabled = true;
    peticionNota('POST', '/api/preparacion/notas', { proyecto_id: p.id, texto: txt, zona: tabActiva })
      .then(function(d) { p.notas = (p.notas || []).concat(d.nota); listo('Nota guardada'); }).catch(fallo);
  } else if (el.hasAttribute('data-nota-editar')) {
    notaEditando = Number(el.getAttribute('data-nota-editar')); abrirModal(p);
  } else if (el.hasAttribute('data-nota-guardar')) {
    var id = Number(el.getAttribute('data-nota-guardar')), nuevo = document.getElementById('nota-edit-txt').value.trim();
    if (!nuevo) return;
    el.disabled = true;
    peticionNota('PUT', '/api/preparacion/notas/' + id, { texto: nuevo })
      .then(function() { p.notas.forEach(function(n) { if (n.id === id) { n.texto = nuevo; n.editado_en = new Date().toISOString(); } }); listo('Nota guardada'); }).catch(fallo);
  } else if (el.hasAttribute('data-nota-borrar')) {
    var idb = Number(el.getAttribute('data-nota-borrar'));
    if (!confirm('¿Borrar esta nota?')) return;
    peticionNota('DELETE', '/api/preparacion/notas/' + idb)
      .then(function() { p.notas = p.notas.filter(function(n) { return n.id !== idb; }); listo('Nota borrada'); }).catch(fallo);
  }
}

// ── Por día: el material de un día concreto, agrupado por familia ──
function isoDia(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function sumarDias(iso, n) { var p = iso.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]); d.setDate(d.getDate() + n); return isoDia(d); }
function renderPorDia(data) {
  var hoy = isoDia(new Date());
  if (!diaElegido) diaElegido = sumarDias(hoy, 1);
  var min = sumarDias(hoy, -3), max = sumarDias(hoy, 30);
  var p = diaElegido.split('-');
  var nombre = new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  var html = '<div class="dia-barra"><button data-dia="-1" aria-label="Día anterior">‹</button><input type="date" id="dia-input" value="' + diaElegido + '" min="' + min + '" max="' + max + '"><button data-dia="1" aria-label="Día siguiente">›</button></div>';
  html += '<div class="dia-rapidos">' + [['Hoy', hoy], ['Mañana', sumarDias(hoy, 1)], ['Pasado mañana', sumarDias(hoy, 2)]].map(function(x) { return '<button data-ir="' + x[1] + '"' + (x[1] === diaElegido ? ' class="active"' : '') + '>' + x[0] + '</button>'; }).join('') + '</div>';
  html += '<div class="dia-titulo">' + nombre.charAt(0).toUpperCase() + nombre.slice(1) + '</div>';
  var lineas = (data.lineas_dia || []).filter(function(l) { return l.dia === diaElegido; });
  if (filtroTexto) lineas = lineas.filter(function(l) { return (l.articulo + ' ' + l.familia + ' ' + l.cliente + ' ' + l.numero).toLowerCase().indexOf(filtroTexto) !== -1; });
  if (!lineas.length) return html + '<div class="loading">' + (filtroTexto ? 'Nada coincide ese día' : 'No sale material ese día') + '</div>';
  // familia → artículo → { total, proyectos }
  var fams = {};
  lineas.forEach(function(l) {
    var f = fams[l.familia] = fams[l.familia] || {};
    var a = f[l.articulo] = f[l.articulo] || { total: 0, proyectos: {} };
    a.total += l.cantidad;
    var pr = a.proyectos[l.proyecto_id] = a.proyectos[l.proyecto_id] || { numero: l.numero, cliente: l.cliente, hora: l.hora, cantidad: 0, check: l.check, proyecto_id: l.proyecto_id };
    pr.cantidad += l.cantidad;
  });
  Object.keys(fams).sort().forEach(function(fam, fi) {
    var arts = fams[fam];
    // Desplegadas desde el principio: se ve de un vistazo todo lo que sale ese día
    html += '<div class="familia-header" data-fi="d' + fi + '"><span class="familia-nombre">' + esc(fam) + '</span><span class="familia-chevron open" id="chev-d' + fi + '">v</span></div>';
    html += '<div class="familia-body open" id="fam-d' + fi + '">';
    Object.keys(arts).sort().forEach(function(art) {
      var a = arts[art];
      html += '<div class="articulo-row"><div class="articulo-top"><span class="articulo-nombre">' + esc(art) + '</span><span class="articulo-total">' + Math.round(a.total * 100) / 100 + '</span></div><div style="margin-top:4px;">';
      Object.keys(a.proyectos).map(function(k) { return a.proyectos[k]; }).sort(function(x, y) { return (x.hora || '').localeCompare(y.hora || ''); }).forEach(function(d) {
        var on = d.check && d.check.marcado;
        html += '<div class="articulo-proy-item' + (on ? ' on' : '') + '">' + botonCheck(d.proyecto_id, art, d.check) + '<span style="flex:1;">#' + d.numero + ' ' + esc(d.cliente || '') + textoCheck(d.check) + '</span><span style="color:#9a988f;font-size:11px;margin:0 8px;">' + esc(d.hora || '') + '</span><span style="font-weight:500;">x' + Math.round(d.cantidad * 100) / 100 + '</span></div>';
      });
      html += '</div></div>';
    });
    html += '</div>';
  });
  return html;
}

function renderPorMaterial(data) {

// ── Quién ha preparado y contenedores (por zona, sql/preparacion_zona.sql) ──
function buscarProyecto(pid) {
  var d = datosCache[tabActiva], todos = [];
  if (!d) return null;
  (d.orden_periodos || []).forEach(function(per) { var pp = d.por_proyecto[per]; if (pp) todos = todos.concat(pp.confirmado, pp.preparado); });
  if (d.logistica) todos = todos.concat(d.logistica.lavanderia || [], d.logistica.office || []);
  return todos.filter(function(p) { return String(p.id) === String(pid); })[0] || null;
}
function datosZona(p, zona) { return (p.prep_zona && p.prep_zona[zona]) || { preparadores: [], contenedores: {} }; }
function preparadoresDe(p, zona) { return datosZona(p, zona).preparadores || []; }
// Con lo que hay en pantalla (incluido lo que se acaba de marcar): ¿está todo marcado en esa zona?
function zonaCompletaLocal(pid, zona) {
  var lineas = (equipmentCache[String(pid)] || []).filter(function(e) { return e.check && e.check.zona === zona; });
  return lineas.length > 0 && lineas.every(function(e) { return e.check.marcado; });
}
function progresoLocal(pid, zona) {
  var porArt = {};
  (equipmentCache[String(pid)] || []).forEach(function(e) { if (e.check && e.check.zona === zona) porArt[e.articulo] = e.check.marcado; });
  var arts = Object.keys(porArt);
  return { total: arts.length, marcados: arts.filter(function(a) { return porArt[a]; }).length };
}
function textoContenedores(cont) {
  return CONTENEDORES.filter(function(c) { return cont && cont[c.id]; }).map(function(c) { return cont[c.id] + ' ' + c.nombre; }).join(', ');
}
// En la ficha: en Lavandería/Office, su zona (editable si la tablet es de esa zona);
// en Almacén (responsable), un resumen de cada zona que lleva material.
function htmlPrepZona(p) {
  var zonas = zonaActual() ? [zonaActual()] : ['lavanderia', 'office'];
  var h = '';
  zonas.forEach(function(z) {
    var pr = progresoLocal(p.id, z);
    if (!pr.total) return;
    var completa = pr.marcados === pr.total, dz = datosZona(p, z), nombres = dz.preparadores || [];
    var editable = zonaActual() === z && puedeMarcar();
    h += '<div class="prep-bloque">';
    h += '<div class="fila"><span class="zona-nom">' + TAB_NOMBRES[z] + '</span>' + (completa ? '<span class="zona-chip ok">✓ Preparado</span>' : '<span class="zona-chip' + (pr.marcados ? ' parcial' : '') + '">' + pr.marcados + '/' + pr.total + ' marcados</span>') + '</div>';
    if (nombres.length) h += '<div class="fila">Preparado por <span class="nombres">' + esc(nombres.join(', ')) + '</span>' + (editable ? ' <button class="btn-sec" data-quien="' + z + '">Cambiar</button>' : '') + '</div>';
    else if (completa) h += '<div class="fila"><span class="falta">Falta indicar quién lo ha preparado</span>' + (editable ? ' <button class="btn-sec" data-quien="' + z + '">Indicar</button>' : '') + '</div>';
    if (z === 'office' && CONTENEDORES.length) {
      var cont = dz.contenedores || {};
      if (editable) {
        h += '<div class="fila" style="font-weight:600;">Contenedores</div><div class="cont-lista">';
        CONTENEDORES.forEach(function(c) {
          h += '<div class="cont-item"><span>' + esc(c.nombre) + '</span><button data-cont="' + c.id + '" data-delta="-1" aria-label="Quitar ' + esc(c.nombre) + '">−</button><b id="cont-' + c.id + '">' + (cont[c.id] || 0) + '</b><button data-cont="' + c.id + '" data-delta="1" aria-label="Añadir ' + esc(c.nombre) + '">+</button></div>';
        });
        h += '</div>';
      } else if (textoContenedores(cont)) {
        h += '<div class="fila">Contenedores: ' + esc(textoContenedores(cont)) + '</div>';
      }
    }
    h += '</div>';
  });
  return h;
}

function guardarZona(pid, zona, cambios) {
  var cuerpo = Object.assign({ proyecto_id: pid, area: zona }, cambios);
  return fetch('/api/preparacion/zona', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) })
    .then(function(r) { return r.json().then(function(d) { d._ok = r.ok; return d; }); })
    .then(function(d) {
      if (!d._ok || d.error) throw new Error(d.error || 'No se ha podido guardar');
      // Se apunta en todas las copias del proyecto que hay en pantalla
      [proyectoModal, buscarProyecto(pid)].forEach(function(p) {
        if (p && String(p.id) === String(pid)) { p.prep_zona = p.prep_zona || {}; p.prep_zona[zona] = d.zona; }
      });
      return d.zona;
    });
}

// Contenedores de Office: + / − y se guarda al poco de dejar de tocar
var contTimer = null, contPendiente = null;
function cambiarContenedor(btn) {
  var p = proyectoModal;
  if (!p) return;
  var id = btn.getAttribute('data-cont'), delta = +btn.getAttribute('data-delta');
  var dz = datosZona(p, 'office');
  var cont = Object.assign({}, dz.contenedores || {});
  cont[id] = Math.max(0, Math.min(999, (cont[id] || 0) + delta));
  p.prep_zona = p.prep_zona || {};
  p.prep_zona.office = Object.assign({}, dz, { contenedores: cont });
  var b = document.getElementById('cont-' + id);
  if (b) b.textContent = cont[id];
  contPendiente = { pid: p.id, cont: cont };
  clearTimeout(contTimer);
  contTimer = setTimeout(function() {
    var x = contPendiente; contPendiente = null;
    guardarZona(x.pid, 'office', { contenedores: x.cont }).then(function() { mostrarToast('Contenedores guardados'); }).catch(function(err) { mostrarToast(err.message); });
  }, 700);
}

// Ventana "¿Quién ha preparado?"
// opciones.uno: elegir solo un nombre ("¿Quién eres?") y llamar a opciones.despues(nombre)
var quienCtx = null;
function abrirQuien(p, zona, opciones) {
  opciones = opciones || {};
  var elegidos;
  if (opciones.uno) elegidos = personaProyecto(p, zona) ? [personaProyecto(p, zona)] : [];
  else {
    elegidos = preparadoresDe(p, zona).slice();
    // Si aún no se ha dicho, se proponen los que han ido marcando los artículos
    if (!elegidos.length) (equipmentCache[String(p.id)] || []).forEach(function(e) {
      if (e.check && e.check.zona === zona && e.check.marcado && e.check.persona && elegidos.indexOf(e.check.persona) === -1) elegidos.push(e.check.persona);
    });
  }
  var lista = (PERSONAL[zona] || []).slice();
  elegidos.forEach(function(n) { if (lista.indexOf(n) === -1) lista.push(n); });
  quienCtx = { pid: p ? p.id : null, zona: zona, lista: lista, elegidos: elegidos, uno: !!opciones.uno, despues: opciones.despues };
  document.getElementById('quien-titulo').textContent = opciones.uno ? '¿Quién prepara #' + p.numero + ' en ' + TAB_NOMBRES[zona] + '?' : '¿Quién ha preparado #' + p.numero + ' en ' + TAB_NOMBRES[zona] + '?';
  document.getElementById('quien-sub').textContent = opciones.uno ? 'Toca tu nombre. Se queda guardado en este proyecto hasta que alguien pulse «No soy yo».' : 'Toca los nombres de quienes lo han preparado.';
  document.getElementById('quien-guardar').textContent = opciones.uno ? 'Soy yo' : 'Guardar';
  document.getElementById('quien-otro-txt').value = '';
  pintarQuien();
  document.getElementById('quien-overlay').classList.add('open');
}
function pintarQuien() {
  var c = quienCtx;
  document.getElementById('quien-chips').innerHTML = c.lista.map(function(n, i) {
    return '<button class="quien-chip' + (c.elegidos.indexOf(n) !== -1 ? ' on' : '') + '" data-quien-i="' + i + '">' + esc(n) + '</button>';
  }).join('') || '<p>No hay nadie en la lista: escribe el nombre abajo.</p>';
  document.getElementById('quien-guardar').disabled = !c.elegidos.length;
}
function cerrarQuien() { quienCtx = null; document.getElementById('quien-overlay').classList.remove('open'); }
document.getElementById('quien-chips').addEventListener('click', function(e) {
  var b = e.target.closest('[data-quien-i]');
  if (!b || !quienCtx) return;
  var n = quienCtx.lista[+b.getAttribute('data-quien-i')], i = quienCtx.elegidos.indexOf(n);
  if (quienCtx.uno) quienCtx.elegidos = [n];
  else if (i === -1) quienCtx.elegidos.push(n); else quienCtx.elegidos.splice(i, 1);
  pintarQuien();
});
document.getElementById('quien-otro-btn').addEventListener('click', function() {
  var inp = document.getElementById('quien-otro-txt'), n = inp.value.trim().replace(/\s+/g, ' ');
  if (!n || !quienCtx) return;
  if (n.split(' ').length < 2) { mostrarToast('Escribe nombre y apellido'); return; }
  if (quienCtx.lista.indexOf(n) === -1) quienCtx.lista.push(n);
  if (quienCtx.uno) quienCtx.elegidos = [n];
  else if (quienCtx.elegidos.indexOf(n) === -1) quienCtx.elegidos.push(n);
  inp.value = '';
  pintarQuien();
});
document.getElementById('quien-cancelar').addEventListener('click', cerrarQuien);
document.getElementById('quien-guardar').addEventListener('click', function() {
  var c = quienCtx, btn = this;
  if (!c || !c.elegidos.length) return;
  if (c.uno) { cerrarQuien(); if (c.despues) c.despues(c.elegidos[0]); return; }
  btn.disabled = true;
  guardarZona(c.pid, c.zona, { preparadores: c.elegidos }).then(function() {
    btn.disabled = false;
    cerrarQuien();
    mostrarToast('Guardado quién lo ha preparado');
    if (proyectoModal) abrirModal(proyectoModal); else if (datosCache[tabActiva]) renderizar(datosCache[tabActiva]);
  }).catch(function(err) { btn.disabled = false; mostrarToast(err.message); });
});

// Material de la ficha: por zona (en Almacén: Office, Lavandería y el resto) y,
// dentro, por familia con su avance y quién la ha preparado.

      hechos.forEach(function(a) { if (a.check.usuario && nombres.indexOf(a.check.usuario) === -1) nombres.push(a.check.usuario); });
      h += '<div class="fam-bloque"><div class="fam-cab"><span class="fam-nom">' + esc(fam) + '</span>';
      if (conCheck.length) h += '<span class="zona-chip' + (hechos.length === conCheck.length ? ' ok' : hechos.length ? ' parcial' : '') + '">' + (hechos.length === conCheck.length ? '✓ ' : '') + hechos.length + '/' + conCheck.length + '</span>';
      h += '</div>';
      if (nombres.length) h += '<div class="fam-quien">Preparado por ' + esc(nombres.join(', ')) + '</div>';
      arts.forEach(function(e) {
        var on = e.check && e.check.marcado;
        h += '<div class="modal-item' + (on ? ' on' : '') + '">' + botonCheck(p.id, e.articulo, e.check) + '<span class="art-nom">' + esc(e.articulo || '') + textoCheck(e.check) + '</span><span class="art-cant">' + Math.round(e.cantidad * 100) / 100 + '</span></div>';
      });
      h += '</div>';
    });
  });
  return h;
}

// ── Lista de personas por zona (botón «Personas», Logística y Dirección) ──
function abrirPersonas() { pintarPersonas(); document.getElementById('personas-overlay').classList.add('open'); }
function pintarPersonas() {
  document.getElementById('personas-zonas').innerHTML = ['office', 'lavanderia'].map(function(z) {
    var lista = PERSONAL[z] || [];
    return '<div class="pers-zona"><h4>' + TAB_NOMBRES[z] + '</h4><div class="pers-lista">' +
      (lista.map(function(n) { return '<span class="pers-chip">' + esc(n) + '<button data-pers-quitar="' + z + '" data-nombre="' + esc(n) + '" aria-label="Quitar ' + esc(n) + '">✕</button></span>'; }).join('') || '<span style="font-size:13px;color:#9a988f;">Nadie todavía</span>') +
      '</div><div class="quien-otro"><input type="text" id="pers-nuevo-' + z + '" placeholder="Nombre y apellido"><button class="btn-sec" data-pers-anadir="' + z + '">Añadir</button></div></div>';
  }).join('');
}
function cambiarPersonas(metodo, area, nombre) {
  return fetch('/api/preparacion/personas', { method: metodo, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ area: area, nombre: nombre }) })
    .then(function(r) { return r.json().then(function(d) { d._ok = r.ok; return d; }); })
    .then(function(d) {
      if (!d._ok || d.error) { mostrarToast(d.error || 'No se ha podido guardar'); return; }
      PERSONAL = d.personal;
      Object.keys(datosCache).forEach(function(t) { datosCache[t].personal = d.personal; });
      pintarPersonas();
    })
    .catch(function() { mostrarToast('Sin conexión'); });
}
document.getElementById('personas-zonas').addEventListener('click', function(e) {
  var quitar = e.target.closest('[data-pers-quitar]');
  if (quitar) {
    var n = quitar.getAttribute('data-nombre');
    if (confirm('¿Quitar a ' + n + ' de la lista?')) cambiarPersonas('DELETE', quitar.getAttribute('data-pers-quitar'), n);
    return;
  }
  var anadir = e.target.closest('[data-pers-anadir]');
  if (anadir) {
    var z = anadir.getAttribute('data-pers-anadir'), inp = document.getElementById('pers-nuevo-' + z);
    var nombre = inp.value.trim().replace(/\s+/g, ' ');
    if (!nombre) return;
    if (nombre.split(' ').length < 2 && !confirm('Mejor con nombre y apellido. ¿Añadir «' + nombre + '» igualmente?')) return;
    cambiarPersonas('POST', z, nombre);
  }
});
document.getElementById('personas-cerrar').addEventListener('click', function() { document.getElementById('personas-overlay').classList.remove('open'); });

function abrirModal(p) {
  proyectoModal = p;
  if (window.registrarVista) registrarVista('ficha', 'proyecto en Preparación', 'proyecto ' + p.numero);
  document.getElementById('modal-numero').textContent = '#' + p.numero;
  document.getElementById('modal-titulo').textContent = p.cliente || '-';
  var body = document.getElementById('modal-body');
  var html = '';
  if (window.INCIDENCIAS_OK) html += '<button class="inc-btn" onclick="nuevaIncidencia({ proyecto: ' + (parseInt(p.numero) || 0) + ', origen: &quot;preparacion&quot; })">&#9888; Registrar incidencia</button>';
  if (p.fecha_entrega) html += '<div style="font-size:13px;color:#6b6a64;margin-bottom:8px;">Fecha: ' + p.fecha_entrega + (p.entrega_hora ? ' ' + p.entrega_hora : '') + (p.localizacion ? '  Loc: ' + p.localizacion : '') + '</div>';
  html += p.zona_preparada ? '<span class="badge-estado badge-listo">Preparado</span>' : estadoBadge(p.estado);
  if (zonaActual() && p.zona_total) html += ' <span class="zona-prog' + (p.zona_preparada ? ' ok' : '') + '" style="margin-left:6px;">' + p.zona_marcados + '/' + p.zona_total + ' marcados</span>';
  if (puedeMarcar()) {
    html += '<div style="font-size:12px;color:#6b6a64;margin-top:8px;">Marca cada artículo cuando esté preparado. Con todo marcado, el proyecto pasa a Preparado.</div>';
    var yo = personaProyecto(p, tabActiva);
    html += yo ? '<div class="persona-bar">Preparando este proyecto: <b>' + esc(yo) + '</b><button class="btn-sec" data-persona="1">No soy yo</button></div>'
      : '<div class="persona-bar falta"><b>¿Quién prepara este proyecto?</b><button class="btn-sec" data-persona="1">Elegir</button></div>';
  }
  html += htmlPrepZona(p);
  html += htmlNotas(p);
  var items = equipmentCache[String(p.id)] || [];
  html += '<div class="modal-seccion">Material</div>';
  html += items.length ? htmlMaterial(p, items) : '<div style="font-size:13px;color:#9a988f;padding:8px 0;">Sin artículos cargados</div>';
  body.innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function cerrarModal() {
  proyectoModal = null;
  notaEditando = null;
  if (datosCache[tabActiva]) renderizar(datosCache[tabActiva]);
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function mostrarToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 1500);
}

document.addEventListener('click', function(e) {
  var card = e.target.closest('.proyecto-card');
  var copyBtn = e.target.closest('.copy-btn');
  var famHeader = e.target.closest('.familia-header');
  var modalOverlay = e.target.closest('#modal-overlay');
  var modalBox = e.target.closest('#modal-box');
  var botonNota = e.target.closest('[data-nota-nueva],[data-nota-editar],[data-nota-guardar],[data-nota-borrar]');
  if (botonNota) { e.stopPropagation(); accionNota(botonNota); return; }
  var chk = e.target.closest('[data-chk]');
  if (chk) { e.stopPropagation(); marcarArticulo(chk); return; }
  var cont = e.target.closest('[data-cont]');
  if (cont) { e.stopPropagation(); cambiarContenedor(cont); return; }
  if (e.target.closest('[data-persona]') && proyectoModal) { e.stopPropagation(); elegirPersona(proyectoModal, tabActiva); return; }
  var quien = e.target.closest('[data-quien]');
  if (quien && proyectoModal) { e.stopPropagation(); abrirQuien(proyectoModal, quien.getAttribute('data-quien')); return; }
  var flecha = e.target.closest('[data-dia]');
  if (flecha) { diaElegido = sumarDias(diaElegido, +flecha.getAttribute('data-dia')); renderizar(datosCache[tabActiva]); return; }
  var rapido = e.target.closest('[data-ir]');
  if (rapido) { diaElegido = rapido.getAttribute('data-ir'); renderizar(datosCache[tabActiva]); return; }

  if (copyBtn) {
    e.stopPropagation();
    var num = copyBtn.getAttribute('data-num');
    if (navigator.clipboard) navigator.clipboard.writeText(num).catch(function(){});
    mostrarToast('Nº ' + num + ' copiado');
    return;
  }
  if (card) {
    var pData = card.getAttribute('data-p');
    if (pData) { try { abrirModal(JSON.parse(pData)); } catch(err) {} }
    return;
  }
  if (famHeader) {
    var fi = famHeader.getAttribute('data-fi');
    var fb = document.getElementById('fam-' + fi);
    var chev = document.getElementById('chev-' + fi);
    if (fb) fb.classList.toggle('open');
    if (chev) chev.classList.toggle('open');
    return;
  }
  if (modalOverlay && !modalBox) { cerrarModal(); }
});

document.getElementById('modal-close-btn').addEventListener('click', cerrarModal);
document.addEventListener('change', function(e) {
  if (e.target.id === 'dia-input' && e.target.value) { diaElegido = e.target.value; renderizar(datosCache[tabActiva]); }
});
// Se actualiza solo cada minuto (lo que marquen otros, cambios de Rentman) si la pantalla está a la vista
setInterval(function() { if (perfilActivo && !document.hidden && datosCache[tabActiva]) recargarSilencioso(); }, 60000);
document.getElementById('btn-recargar').addEventListener('click', recargar);
document.getElementById('buscador') && document.getElementById('buscador').addEventListener('input', function() {
  filtroTexto = this.value.toLowerCase();
  if (datosCache[tabActiva]) renderizar(datosCache[tabActiva]);
});

initKeypad();

// Dentro del panel de escritorio (Logística → Preparación) va en un iframe con ?embebido=1
var PARAMS = new URLSearchParams(location.search);
var EMBEBIDO = PARAMS.get('embebido') === '1';
function entrarConSesion(u) {
  var tabs = TABS_POR_ROL[u.rol] || ['almacen', 'lavanderia', 'office'];
  perfilActivo = { sesion: true, rol: u.rol, usuario: u.usuario, nombre: tabs.length === 1 ? TAB_NOMBRES[tabs[0]] : 'Preparación', tabs: tabs };
  tabActiva = tabs.indexOf(PARAMS.get('vista')) !== -1 ? PARAMS.get('vista') : tabs[0];
  document.getElementById('app').style.display = 'block';
  document.getElementById('app-titulo').textContent = perfilActivo.nombre;
  var tablet = ROLES_TABLET.indexOf(u.rol) !== -1;
  document.getElementById('btn-inicio').style.display = tablet || EMBEBIDO ? 'none' : '';
  document.getElementById('btn-salir').style.display = tablet && !EMBEBIDO ? '' : 'none';
  // Botón Chat (public/chat-boton.js): solo si el usuario tiene algún chat
  if (window.ponerBotonChat) ponerBotonChat(document.querySelector('.app-header-top'), { antesDe: document.getElementById('btn-salir'), enPanel: true });
  // Botón «?» de la Ayuda (en el panel ya está en el menú)
  if (!EMBEBIDO) {
    var ayuda = document.createElement('button');
    ayuda.className = 'btn-recargar'; ayuda.textContent = '?'; ayuda.title = 'Ayuda'; ayuda.style.marginRight = '8px';
    ayuda.onclick = function () { location.href = '/ayuda?pantalla=' + encodeURIComponent('Preparación ' + (TAB_NOMBRES[tabActiva] || '')) + '&volver=' + encodeURIComponent('/preparacion'); };
    document.querySelector('.app-header-top').insertBefore(ayuda, document.getElementById('btn-recargar'));
  }
  // Botón «Personas»: la lista de «¿Quién prepara?» la cambian Logística y Dirección
  if (['Direccion', 'Logistica'].indexOf(u.rol) !== -1 && !document.getElementById('btn-personas')) {
    var bp = document.createElement('button');
    bp.className = 'btn-recargar'; bp.id = 'btn-personas'; bp.textContent = 'Personas'; bp.style.marginRight = '8px';
    bp.onclick = abrirPersonas;
    document.querySelector('.app-header-top').insertBefore(bp, document.getElementById('btn-recargar'));
  }
  // Botón "⚠ Incidencia" en la ficha de cada proyecto (no para las tablets)
  if (window.prepararIncidencias) prepararIncidencias();
  // Avisos de cambios en proyectos con el botón «Visto» (public/avisos-banda.js)
  if (window.ponerBandaAvisos) ponerBandaAvisos(document.getElementById('buscador-wrap'));
  construirTabs();
  cargarDatos(tabActiva);
}
function sinSesion() { document.getElementById('pin-screen').style.display = 'flex'; }
document.getElementById('btn-inicio').addEventListener('click', function() { location.href = '/movil'; });
document.getElementById('btn-salir').addEventListener('click', function() {
  if (!confirm('¿Salir? Habrá que volver a teclear el PIN en esta tablet.')) return;
  var llave = ''; try { llave = localStorage.getItem(CLAVE_DISPOSITIVO) || ''; localStorage.removeItem(CLAVE_DISPOSITIVO); } catch (e) {}
  fetch('/api/movil/salir', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dispositivo: llave }) })
    .catch(function() {}).then(function() { location.href = '/movil'; });
});
// Arranque: sesión abierta, o dispositivo recordado por la app móvil; si no, el PIN de siempre.
fetch('/api/sesion').then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; }).then(function(d) {
  if (d && d.usuario && d.usuario.rol !== 'Comercial') return entrarConSesion(d.usuario);
  var llave = ''; try { llave = localStorage.getItem(CLAVE_DISPOSITIVO) || ''; } catch (e) {}
  if (!llave) return sinSesion();
  fetch('/api/movil/dispositivo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dispositivo: llave }) })
    .then(function(r) { return r.json(); })
    .then(function(r) { if (r.ok && r.usuario.rol !== 'Comercial') entrarConSesion(r.usuario); else sinSesion(); })
    .catch(sinSesion);
});
