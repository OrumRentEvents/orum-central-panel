<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruta de hoy</title>
<!-- App del conductor (una por vehiculo, ver lib/rutasConductor.js). Rutas relativas: cuelgan de /conductor/<codigo>/ -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a1a18">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/rutas-192.png?v=2">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-rutas.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#eeeee9;color:#1a1a18;min-height:100vh;-webkit-text-size-adjust:100%;}
.hdr{background:#1a1a18;color:#fff;padding:12px 16px 10px;position:sticky;top:0;z-index:10;}
.hdr h1{font-size:20px;font-weight:700;letter-spacing:.5px;}
.hdr-sub{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:rgba(255,255,255,.6);margin-top:3px;}
#body{padding:10px 10px 40px;max-width:640px;margin:0 auto;}
.msg{text-align:center;padding:3rem 1rem;color:#6b6a64;font-size:15px;line-height:1.5;}
.vuelta{font-size:14px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:14px 4px 8px;border-bottom:2px solid #1a1a18;margin-bottom:10px;}
.vuelta:first-child{padding-top:4px;}
.card{display:flex;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.1);margin-bottom:10px;}
.tipo{width:54px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px;background:#E6F1FB;color:#185FA5;}
.tipo b{font-size:28px;font-weight:800;line-height:1;}
.tipo span{font-size:15px;font-weight:700;color:inherit;opacity:.6;}
.t-ENTREGA{background:#D6F5E3;color:#0A6640;}
.t-RECOGIDA{background:#FDEBD0;color:#8B4A00;}
.t-COMPRA{background:#FFF3E0;color:#8B4513;}
.t-TALLER{background:#FCE4EC;color:#880E4F;}
.cont{flex:1;min-width:0;padding:10px 12px 12px;}
.tipo-txt{font-size:11px;font-weight:700;letter-spacing:.5px;color:#6b6a64;}
.tipo-txt .num{color:#9a988f;font-weight:600;margin-left:6px;}
.cli{font-size:17px;font-weight:700;margin-top:2px;word-wrap:break-word;}
.dir{font-size:14px;color:#4a4944;margin-top:6px;line-height:1.35;word-wrap:break-word;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chip{font-size:12px;font-weight:800;letter-spacing:.3px;padding:4px 9px;border-radius:7px;}
.chip-tp{background:#FFE36E;color:#5C4400;border:1px solid #E0B800;}
.chip-mt{background:#EEEDFE;color:#3C3489;}
.chip-sub{background:#FAEEDA;color:#854F0B;}
.chip-con{background:#f0f0ea;color:#4a4944;font-weight:600;}
.notas{margin-top:8px;font-size:14px;background:#fafaf6;border-left:3px solid #c9c7bd;padding:6px 9px;border-radius:0 6px 6px 0;white-space:pre-wrap;word-wrap:break-word;}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:9px 12px;border-radius:8px;text-decoration:none;border:none;cursor:pointer;font-family:inherit;}
.b-maps{background:#E6F1FB;color:#185FA5;}
.b-tel{background:#D6F5E3;color:#0A6640;}
.b-mat{background:#f0f0ea;color:#1a1a18;}
.sin-tel{font-size:13px;color:#9a988f;align-self:center;}
.mat{margin-top:10px;border-top:.5px solid #e2e2de;padding-top:6px;}
.mat-fam{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#6b6a64;margin:8px 0 2px;}
.mat-row{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;border-bottom:.5px solid #f0f0ea;}
.mat-row b{white-space:nowrap;}
</style>
</head>
<body>
<div class="hdr">
  <h1 id="veh">Ruta de hoy</h1>
  <div class="hdr-sub"><span id="fecha"></span><span id="act"></span></div>
</div>
<div id="body"><div class="msg">Cargando ruta...</div></div>
<script>
var codigo=location.pathname.split('/')[2]||'';
var ultimaFirma='', abiertos={}, materiales={};
var ORDINAL=['Primera','Segunda','Tercera','Cuarta','Quinta'];

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fechaLarga(iso){
  var d=new Date(iso+'T12:00:00');
  var t=d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  return t.charAt(0).toUpperCase()+t.slice(1);
}
function urlMaps(p){return p.maps||('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.direccion));}
function idParada(v,i){return v+'_'+i;}

function cargar(){
  fetch('/api/conductor/'+encodeURIComponent(codigo)+'/hoy?t='+Date.now()).then(function(r){return r.json();}).then(function(d){
    if(d.error){if(!ultimaFirma)document.getElementById('body').innerHTML='<div class="msg">'+esc(d.error)+'</div>';return;}
    var ahora=new Date();
    document.getElementById('act').textContent='Actualizado '+ahora.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
    var firma=JSON.stringify(d);
    if(firma===ultimaFirma)return; // nada nuevo: no se repinta (no se cierra el material abierto)
    ultimaFirma=firma;
    pintar(d);
  }).catch(function(){
    if(!ultimaFirma)document.getElementById('body').innerHTML='<div class="msg">Sin conexión. Se reintentará en un momento.</div>';
  });
}

function pintar(d){
  document.title='Ruta '+d.vehiculo;
  document.getElementById('veh').textContent=d.vehiculo;
  var n=d.vueltas.reduce(function(s,v){return s+v.paradas.length;},0);
  document.getElementById('fecha').textContent=fechaLarga(d.fecha)+' · '+n+(n===1?' parada':' paradas');
  if(!n){document.getElementById('body').innerHTML='<div class="msg">Hoy no hay paradas asignadas a <b>'+esc(d.vehiculo)+'</b>.</div>';return;}
  var html='';
  var varias=d.vueltas.length>1;
  d.vueltas.forEach(function(v){
    if(varias)html+='<div class="vuelta">'+(ORDINAL[v.vuelta-1]||(v.vuelta+'ª'))+' vuelta</div>';
    v.paradas.forEach(function(p,i){html+=tarjeta(p,i+1,idParada(v.vuelta,i));});
  });
  document.getElementById('body').innerHTML=html;
  Object.keys(abiertos).forEach(function(id){if(abiertos[id])pintarMaterial(id);});
}

function tarjeta(p,pos,id){
  var tipoTxt={ENTREGA:'ENTREGA',RECOGIDA:'RECOGIDA',COMPRA:'COMPRA',TALLER:'TALLER'}[p.tipo]||p.tipo||'OTRO';
  var h='<div class="card"><div class="tipo t-'+esc(p.tipo)+'"><b>'+esc(tipoTxt.charAt(0))+'</b><span>'+pos+'</span></div><div class="cont">';
  h+='<div class="tipo-txt">'+esc(tipoTxt)+(p.numero?'<span class="num">#'+esc(p.numero)+'</span>':'')+'</div>';
  h+='<div class="cli">'+esc(p.cliente||'—')+'</div>';
  if(p.direccion)h+='<div class="dir">'+esc(p.direccion)+'</div>';
  var chips='';
  if(p.subproyectos)chips+='<span class="chip chip-sub">Solo '+esc(p.subproyectos)+'</span>';
  if(p.traspa)chips+='<span class="chip chip-tp">TRASPA</span>';
  p.montaje.forEach(function(m){chips+='<span class="chip chip-mt">'+esc(m)+'</span>';});
  if(p.con.length)chips+='<span class="chip chip-con">Con '+esc(p.con.join(', '))+'</span>';
  if(chips)h+='<div class="chips">'+chips+'</div>';
  if(p.notas)h+='<div class="notas">'+esc(p.notas)+'</div>';
  h+='<div class="btns">';
  if(p.direccion||p.maps)h+='<a class="btn b-maps" href="'+esc(urlMaps(p))+'" target="_blank" rel="noopener">&#128205; Cómo llegar</a>';
  if(p.telefono)h+='<a class="btn b-tel" href="tel:'+esc(String(p.telefono).replace(/[^0-9+]/g,''))+'">&#128222; '+esc((p.contacto?p.contacto+' · ':'')+p.telefono)+'</a>';
  else if(p.proyecto_id)h+='<span class="sin-tel">Sin teléfono de contacto</span>';
  if(p.material)h+='<button class="btn b-mat" onclick="verMaterial(\''+id+'\',\''+esc(p.proyecto_id)+'\')" id="bm-'+id+'">&#128230; '+(abiertos[id]?'Ocultar material':'Ver material')+'</button>';
  h+='</div><div id="mat-'+id+'"></div></div></div>';
  return h;
}

function verMaterial(id,pid){
  var b=document.getElementById('bm-'+id);
  if(abiertos[id]){
    abiertos[id]=null;
    if(b)b.innerHTML='&#128230; Ver material';
    document.getElementById('mat-'+id).innerHTML='';
    return;
  }
  abiertos[id]=pid;
  if(b)b.innerHTML='&#128230; Ocultar material';
  if(materiales[pid]){pintarMaterial(id);return;}
  document.getElementById('mat-'+id).innerHTML='<div class="mat"><div class="mat-row">Cargando material...</div></div>';
  fetch('/api/conductor/'+encodeURIComponent(codigo)+'/material?proyecto_id='+encodeURIComponent(pid)+'&t='+Date.now()).then(function(r){return r.json();}).then(function(d){
    materiales[pid]=d.material||[];
    if(d.error)materiales[pid]={error:d.error};
    pintarMaterial(id);
  }).catch(function(){delete materiales[pid];document.getElementById('mat-'+id).innerHTML='<div class="mat"><div class="mat-row">Sin conexión</div></div>';});
}

function pintarMaterial(id){
  var cont=document.getElementById('mat-'+id), pid=abiertos[id];
  if(!cont||!pid)return;
  var m=materiales[pid];
  if(!m)return;
  if(m.error){cont.innerHTML='<div class="mat"><div class="mat-row">'+esc(m.error)+'</div></div>';return;}
  var h='<div class="mat">', fam=null;
  m.forEach(function(x){
    if(x.familia!==fam){fam=x.familia;h+='<div class="mat-fam">'+esc(fam||'Sin familia')+'</div>';}
    h+='<div class="mat-row"><span>'+esc(x.articulo)+'</span><b>'+esc(x.cantidad)+'</b></div>';
  });
  if(!m.length)h+='<div class="mat-row">Sin material</div>';
  cont.innerHTML=h+'</div>';
  var b=document.getElementById('bm-'+id);
  if(b)b.innerHTML='&#128230; Ocultar material';
}

cargar();
// La ruta cambia desde Rentman/Rutas: se consulta cada minuto y al volver a abrir la app
setInterval(cargar,60000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')cargar();});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
</body>
</html>
