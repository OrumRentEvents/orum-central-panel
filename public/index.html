<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORUM Central</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #1a1a1a;
    --gray-100: #f7f6f3;
    --gray-200: #eeecea;
    --gray-300: #dddbd7;
    --gray-400: #999794;
    --gray-500: #666462;
    --accent: #b8956a;
    --accent-dark: #8a6d1e;
    --accent-light: #e8d5b0;
    --green: #2e7d52;
    --red: #c0392b;
    --orange: #c0620a;
    --bg-main: #f2f0ec;
    --bg-sidebar: #ffffff;
    --border: #e0ddd9;
    --text-primary: #1a1a1a;
    --text-secondary: #555351;
    --text-muted: #888582;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #ffffff;
    color: var(--text-primary);
  }
  #login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: var(--bg-main);
    position: relative;
  }
  #login-screen::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 30% 50%, rgba(184,149,106,0.10) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 50%, rgba(184,149,106,0.06) 0%, transparent 60%);
  }
  .login-box {
    position: relative;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3rem 2.5rem;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .login-box .crown { display:block; margin:0 auto 10px; height:70px; width:auto; }
  .login-box h1 {
    font-family: 'Playfair Display', serif;
    font-size: 34px; font-weight: 900; letter-spacing: 7px;
    margin-bottom: 6px; text-align: center; text-transform: uppercase;
  }
  .login-box p.subtitle {
    font-size: 11px; color: var(--accent-dark); margin-bottom: 2.25rem; text-align: center;
    text-transform: uppercase; letter-spacing: 3px; font-weight: 600;
  }
  .login-box label {
    display: block; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--gray-500); margin-bottom: 6px; margin-top: 18px; font-weight: 500;
  }
  .login-box input {
    width: 100%; padding: 11px 14px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 2px; background: var(--gray-100); color: var(--text-primary);
    font-family: 'DM Sans', sans-serif;
  }
  .login-box input:focus { outline: none; border-color: var(--accent); background: #fff; }
  .login-box button {
    width: 100%; margin-top: 2rem; padding: 13px; font-size: 12px; font-weight: 600;
    letter-spacing: 2px; text-transform: uppercase;
    background: var(--black); color: #fff; border: none; border-radius: 2px; cursor: pointer;
    transition: background 0.2s;
  }
  .login-box button:hover { background: var(--accent); color: var(--black); }
  .login-error { color: var(--red); font-size: 13px; margin-top: 14px; display: none; text-align: center; }
  /* app-screen ocupa exactamente la ventana y no se desplaza — sidebar y
     main-content tienen cada uno su propio scroll interno, independiente
     uno del otro (antes todo era un único documento y al hacer scroll
     abajo en el contenido el menú se iba con él). */
  #app-screen { display: none; height: 100vh; overflow: hidden; }
  .app-layout { display: flex; height: 100%; }
  .sidebar { width: 230px; height: 100%; overflow-y: auto; background: var(--bg-sidebar); border-right: 1px solid var(--border); padding: 1.5rem 0; flex-shrink: 0; }
  .sidebar-header { padding: 0 1.5rem 1.25rem; border-bottom: 1px solid var(--border); margin-bottom: 0.5rem; }
  .sidebar-header .org-name {
    font-family: 'Playfair Display', serif; font-weight: 900; font-size: 20px; letter-spacing: 3px; text-transform: uppercase;
  }
  .sidebar-header .org-name .crown-mini { height: 22px; width: auto; vertical-align: middle; margin-right: 6px; }
  .sidebar-header .org-name { display: flex; align-items: center; }
  .sidebar-header .user-name { font-size: 11px; color: var(--text-muted); margin-top: 4px; letter-spacing: 0.5px; }
  .nav-group-title {
    padding: 1.1rem 1.5rem 0.4rem; font-size: 10px; color: var(--gray-400);
    text-transform: uppercase; letter-spacing: 2px; font-weight: 600;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 1.5rem; font-size: 13px;
    color: var(--text-secondary); cursor: pointer; border-left: 2px solid transparent;
    transition: all 0.15s;
  }
  .nav-item:hover { background: var(--gray-100); color: var(--text-primary); }
  .nav-item.active { background: var(--accent-light); border-left-color: var(--accent); color: var(--accent-dark); font-weight: 600; }
  .logout-button {
    margin: 1.75rem 1.5rem 0; padding: 9px 12px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    border: 1px solid var(--border); border-radius: 2px; background: #fff; color: var(--gray-500); cursor: pointer;
    width: calc(100% - 3rem); transition: all 0.2s;
  }
  .logout-button:hover { border-color: var(--red); color: var(--red); }
  .main-content { flex: 1; height: 100%; overflow-y: auto; padding: 2rem 2.25rem; min-width: 0; background: var(--bg-main); }
  .main-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
  .main-header h1 { font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 700; color: var(--text-primary); letter-spacing: 0.5px; }
  .last-update { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; letter-spacing: 0.5px; }
  .last-update .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .last-update.stale .dot { background: var(--orange); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
  th {
    text-align: left; padding: 10px 12px; color: var(--gray-500); font-weight: 600; font-size: 10px;
    text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); background: var(--gray-100);
    position: sticky; top: 0; z-index: 3; box-shadow: 0 1px 0 var(--border);
  }
  th[onclick]:hover { color: var(--accent-dark); background: var(--gray-200); }
  td { padding: 11px 12px; border-bottom: 1px solid var(--gray-200); }
  .badge { font-size: 11px; padding: 3px 10px; border-radius: 2px; display: inline-block; font-weight: 600; letter-spacing: 0.3px; }
  .badge-success { background: #EAF3DE; color: #27500A; }
  .badge-warning { background: #FAEEDA; color: #854F0B; }
  .badge-danger { background: #FCEBEB; color: #A32D2D; }
  .badge-neutral { background: var(--gray-200); color: var(--gray-500); }
  .badge-dark { background: #2a2a2a; color: #ffffff; }
  .celda-copiable { cursor: pointer; }
  .celda-copiable:hover { text-decoration: underline; }
  .search-box { position: relative; }
  .search-box input {
    width: 220px; padding: 7px 12px 7px 32px; font-size: 13px;
    border: 1px solid var(--border); border-radius: 2px; background: #fff; color: var(--text-primary);
  }
  .search-box::before {
    content: "🔍"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; opacity: 0.5;
  }
  .loading-text { color: var(--gray-400); font-size: 13px; padding: 2rem 0; }
  select { padding: 7px 10px; border: 1px solid var(--border); border-radius: 2px; font-size: 13px; background: #fff; color: var(--text-primary); }
  .pnc-filtro-btn { font-size:13px; padding:6px 14px; border-radius:2px; background:#fff; color:var(--text-secondary); border:1px solid var(--border); cursor:pointer; }
  .btn-material { background: var(--accent-light); color: var(--accent-dark); border: none; border-radius: 4px; padding: 1px 5px; cursor: pointer; font-size: 10px; margin-left: 4px; vertical-align: middle; }
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-box">
    <img class="crown" src="logo-orum-crown.png" alt="ORUM">
    <h1>Central</h1>
    <p class="subtitle">Rent &amp; Events</p>
    <form id="login-form">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <p class="login-error" id="login-error"></p>
      <button type="submit">Entrar</button>
    </form>
  </div>
</div>
<div id="app-screen">
  <div class="app-layout">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="org-name"><img class="crown-mini" src="logo-orum-crown.png" alt="ORUM"> Central</div>
        <div class="user-name" id="sidebar-user-name"></div>
      </div>
      <div id="nav-container"></div>
      <button class="logout-button" id="logout-btn">Cerrar sesión</button>
    </div>
    <div class="main-content">
      <div class="main-header">
        <h1 id="content-title">Proyectos</h1>
        <div class="last-update" id="last-update-indicator">
          <span class="dot"></span>
          <span id="last-update-text">Cargando...</span>
        </div>
      </div>
      <div id="content-body">
        <p class="loading-text">Cargando datos...</p>
      </div>
    </div>
  </div>
</div>

<!-- Modal material + servicios adicionales de un proyecto -->
<div id="modal-material" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; align-items:center; justify-content:center;">
  <div style="background:#fff; border-radius:6px; width:100%; max-width:480px; max-height:80vh; display:flex; flex-direction:column; margin:1rem;">
    <div style="display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--border);">
      <h2 style="font-size:15px; font-weight:600; margin:0;" id="modal-material-titulo">Material</h2>
      <span style="cursor:pointer; font-size:18px; color:var(--text-muted);" onclick="cerrarModalMaterialProyecto()">&times;</span>
    </div>
    <div style="padding:14px 16px; overflow-y:auto;" id="modal-material-body"></div>
  </div>
</div>

<!-- Modal historial de cambios de una factura de proveedor -->
<div id="modal-historial-factura" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; align-items:center; justify-content:center;">
  <div style="background:#fff; border-radius:6px; width:100%; max-width:480px; max-height:80vh; display:flex; flex-direction:column; margin:1rem;">
    <div style="display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--border);">
      <h2 style="font-size:15px; font-weight:600; margin:0;">🕓 Historial de cambios</h2>
      <span style="cursor:pointer; font-size:18px; color:var(--text-muted);" onclick="document.getElementById('modal-historial-factura').style.display='none'">&times;</span>
    </div>
    <div style="padding:14px 16px; overflow-y:auto;" id="modal-historial-factura-body"></div>
  </div>
</div>

<script>
let usuarioActual = null;
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const usuario = document.getElementById('usuario').value.trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('login-error');
  errorEl.style.display = 'none';
  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario, password })
    });
    const data = await resp.json();
    if (!resp.ok) {
      errorEl.textContent = data.error || 'Error al iniciar sesión';
      errorEl.style.display = 'block';
      return;
    }
    usuarioActual = data.usuario;
    mostrarApp();
  } catch (err) {
    errorEl.textContent = 'Error de conexión con el servidor';
    errorEl.style.display = 'block';
  }
});
document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  location.reload();
});
async function comprobarSesion() {
  try {
    const resp = await fetch('/api/sesion');
    if (resp.ok) {
      const data = await resp.json();
      usuarioActual = data.usuario;
      mostrarApp();
    }
  } catch (err) {}
}
function mostrarApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  document.getElementById('sidebar-user-name').textContent = usuarioActual.nombre;
  construirMenu();
  if (usuarioActual.rol === 'Comercial') cargarResumenComercial();
  else if (usuarioActual.rol === 'Logistica') cargarResumenLogistica();
  else cargarResumenGeneral();
}
function renderProximamente(nombre) {
  document.getElementById('content-title').textContent = nombre;
  document.getElementById('last-update-text').textContent = 'Sin datos';
  document.getElementById('last-update-indicator').classList.add('stale');
  document.getElementById('content-body').innerHTML = `
    <div style="background:#fff; border:1px solid var(--border); border-radius:4px; padding:3rem; text-align:center;">
      <div style="font-size:32px; margin-bottom:12px;">🚧</div>
      <p style="font-size:15px; color:#1a1a18; margin-bottom:6px; font-weight:500;">Todavía no conectado</p>
      <p style="font-size:13px; color:#9a988f;">Esta sección se irá activando en próximas fases, en cuanto tenga su fuente de datos.</p>
    </div>
  `;
}

// ================================================================
// RESUMEN GENERAL — pantalla de bienvenida (Dirección/admin)
// Junta lo más importante de cada departamento sin recalcular nada
// nuevo: reutiliza los mismos endpoints y funciones de gráfica que ya
// usan Comercial·Resumen y Financiero·Resumen.
// ================================================================
async function cargarResumenGeneral() {
  document.getElementById('content-title').textContent = 'Resumen';
  const body = document.getElementById('content-body');
  body.innerHTML = '<p class="loading-text">Cargando resumen...</p>';
  try {
    const [rProy, rPresu, rLeads, rFin, rSync] = await Promise.all([
      fetch('/api/proyectos').then(r => r.json()),
      fetch('/api/presupuestos').then(r => r.json()),
      fetch('/api/leads').then(r => r.json()),
      fetch('/api/financiero').then(r => r.json()).catch(() => null),
      fetch('/api/sync-status').then(r => r.json()).catch(() => null)
    ]);
    if (rProy.error) { body.innerHTML = '<p class="loading-text">Error: ' + rProy.error + '</p>'; return; }
    actualizarIndicadorFecha(rProy.ultima_actualizacion);
    pintarResumenGeneral(rProy.data || [], rPresu.data || [], rLeads.data || [], rFin, rSync);
  } catch (err) {
    console.error('Error en Resumen general:', err);
    body.innerHTML = '<p class="loading-text">Error de conexión: ' + (err && err.message ? err.message : err) + '</p>';
  }
}
function pintarResumenGeneral(proyectos, presupuestos, leads, fin, sync) {
  const body = document.getElementById('content-body');
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const en7 = new Date(hoy); en7.setDate(en7.getDate() + 7);
  const en30 = new Date(hoy); en30.setDate(en30.getDate() + 30);
  const inicioMes = new Date(hoy.getFullYear(), hoy.getMonth(), 1);

  const parseFechaLocal = raw => {
    if (!raw) return null;
    const fParte = raw.split(' ')[0];
    const partes = fParte.split('/');
    if (partes.length !== 3) return null;
    const d = new Date(partes[2], partes[1] - 1, partes[0]);
    return isNaN(d) ? null : d;
  };

  const activos = proyectos.filter(p => p.estado !== 'Canceled');
  const conFecha = activos.map(p => ({ ...p, _fecha: parseFechaLocal(p.evento_inicio) })).filter(p => p._fecha);
  const entregas7 = conFecha.filter(p => p._fecha >= hoy && p._fecha <= en7);
  const entregas30 = conFecha.filter(p => p._fecha >= hoy && p._fecha <= en30);
  const realizadosMes = conFecha.filter(p => p._fecha >= inicioMes && p._fecha < hoy);
  const proximas = conFecha.filter(p => p._fecha >= hoy).sort((a, b) => a._fecha - b._fecha).slice(0, 8);

  const alertasPresu = presupuestos.filter(p => ['rojo', 'amarillo', 'negro'].includes(p.semaforo));
  const importeEnJuego = presupuestos.filter(p => ['verde', 'amarillo', 'rojo', 'negro'].includes(p.semaforo))
    .reduce((s, p) => s + (parseFloat(p.importe_sin_iva) || 0), 0);

  const conteoEstados = {};
  activos.forEach(p => { const e = p.estado || 'Sin estado'; conteoEstados[e] = (conteoEstados[e] || 0) + 1; });
  const paletaEstados = ['#4c8c1f', '#C77D0B', '#2a2a2a', '#8a6d1e', '#A32D2D', '#6b6a64', '#9a988f'];
  const segmentosEstado = Object.entries(conteoEstados).sort((a, b) => b[1] - a[1]).slice(0, 7)
    .map(([etiqueta, valor], i) => ({ etiqueta, valor, color: paletaEstados[i % paletaEstados.length] }));

  let html = `
    <div style="font-weight:600; font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:0.6rem;">Proyectos</div>
    <div style="display:flex; gap:1rem; margin-bottom:1.5rem; flex-wrap:wrap;">
      ${kpiCard('Proyectos activos', activos.length)}
      ${kpiCard('Entregas próx. 7 días', entregas7.length)}
      ${kpiCard('Entregas próx. 30 días', entregas30.length)}
      ${kpiCard('Realizados este mes', realizadosMes.length)}
    </div>
  `;

  if (fin && !fin.error && fin.kpis) {
    const k = fin.kpis;
    html += `
      <div style="font-weight:600; font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:0.6rem;">Financiero</div>
      <div style="display:flex; gap:1rem; margin-bottom:1.5rem; flex-wrap:wrap;">
        ${kpiCard('Total facturado', euros(k.total_facturado))}
        ${kpiCard('Cobrado', euros(k.total_cobrado))}
        ${kpiCard('Pendiente de cobro', euros(k.total_pendiente))}
        ${kpiCard('Vencidas', euros(k.total_vencidas))}
      </div>
    `;
  }

  html += `
    <div style="font-weight:600; font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:0.6rem;">Comercial</div>
    <div style="display:flex; gap:1rem; margin-bottom:1.5rem; flex-wrap:wrap;">
      ${kpiCard('Presupuestos pendientes de seguimiento', alertasPresu.length)}
      ${kpiCard('Leads recibidos', leads.length)}
      ${kpiCard('Importe presupuestos en juego', formatearEuros(importeEnJuego))}
    </div>
  `;

  html += `
    <div style="display:flex; gap:1rem; margin-bottom:1.5rem; flex-wrap:wrap;">
      <div style="background:#fff; border:1px solid var(--border); border-radius:4px; padding:1rem; flex:1; min-width:280px; display:flex; gap:1.5rem; align-items:center; flex-wrap:wrap;">
        <div style="font-weight:600; width:100%;">Proyectos por estado</div>
        ${donutSVG(segmentosEstado)}
        <div style="flex:1; min-width:140px;">${leyendaDonut(segmentosEstado)}</div>
      </div>
      <div style="background:#fff; border:1px solid var(--border); border-radius:4px; padding:1rem; flex:2; min-width:340px;">
        <div style="font-weight:600; margin-bottom:8px;">Evolución de presupuestos (desde enero)</div>
        ${graficoBarrasMensuales(evolucionMensualPresupuestos(presupuestos))}
      </div>
    </div>
  `;

  html += `
    <div style="background:var(--accent-light); border:1px solid var(--accent); border-radius:4px; padding:0.85rem 1rem; margin-bottom:1rem; display:flex; align-items:center; justify-content:space-between; cursor:pointer;" onclick="marcarMenuActivo('menu-item-analisis-rutas'); cargarEstadisticasRutas();">
      <span style="font-weight:600; color:var(--accent-dark);">🚛 Rutas & Conductores</span>
      <span style="font-size:13px; color:var(--accent-dark);">Ver estadísticas →</span>
    </div>
    <div style="background:#fff; border:1px solid var(--border); border-radius:4px; padding:1rem; margin-bottom:1rem;">
      <div style="font-weight:600; margin-bottom:8px; cursor:pointer;" onclick="marcarMenuActivo('menu-item-proyectos'); cargarProyectos();">📦 Próximas entregas →</div>
      <div style="display:flex; flex-direction:column; gap:6px;">
        ${proximas.length === 0 ? '<div style="font-size:13px; color:var(--text-muted);">No hay entregas próximas.</div>' : proximas.map(p => `
          <div style="display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid var(--border);">
            <span>${p.numero || ''} — ${p.cliente || ''}</span>
            <span style="color:var(--text-muted);">${p._fecha.toLocaleDateString('es-ES')}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  if (sync && sync.ok && Array.isArray(sync.cron)) {
    const hayFallo = sync.cron.some(c => c.exito === false);
    html += `
      <div style="font-size:12px; color:var(--text-muted); display:flex; align-items:center; gap:6px; cursor:pointer; width:fit-content;" onclick="window.open('/sync-status','_blank')">
        <span style="width:8px; height:8px; border-radius:50%; background:${hayFallo ? '#A32D2D' : '#4c8c1f'}; display:inline-block;"></span>
        Sincronización: ${hayFallo ? 'hay algo que revisar' : 'todo correcto'} — ver detalle
      </div>
    `;
  }

  body.innerHTML = html;
}

// ================================================================
// RUTAS & CONDUCTORES · ESTADÍSTICAS
// (no confundir con el panel operativo del día a día, /rutas.html —
// esto es el informe de entregas/recogidas hechas por conductor y por
// vehículo, sacado de rutas_paradas en Supabase.)
// ================================================================
function lunesDeLaSemanaJS_(d) {
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  const dia = x.getDay() || 7;
  x.setDate(x.getDate() - dia + 1);
  return x;
}
function isoWeekNumberJS_(fecha) {
  const d = new Date(Date.UTC(fecha.getFullYear(), fecha.getMonth(), fecha.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}
function rangoSemanaISO_(anio, semana) {
  const jan4 = new Date(anio, 0, 4);
  const diaJan4 = jan4.getDay() || 7;
  const lunesSemana1 = new Date(jan4);
  lunesSemana1.setDate(jan4.getDate() - diaJan4 + 1);
  const lunes = new Date(lunesSemana1);
  lunes.setDate(lunesSemana1.getDate() + (semana - 1) * 7);
  const domingo = new Date(lunes);
  domingo.setDate(lunes.getDate() + 6);
  return { desde: lunes.toISOString().slice(0, 10), hasta: domingo.toISOString().slice(0, 10) };
}
// Un mes = todas las semanas ISO cuya MAYORÍA de días caen en ese mes -
// misma regla que el Informe Mensual, así "mes" significa lo mismo en
// todo el panel (una semana a caballo entre dos meses no se parte).
function rangoMesPorSemanasISO_(anio, mes) {
  const primerDia = new Date(anio, mes - 1, 1);
  const ultimoDia = new Date(anio, mes, 0);
  let cursor = lunesDeLaSemanaJS_(primerDia);
  cursor.setDate(cursor.getDate() - 7);
  const limite = new Date(ultimoDia); limite.setDate(limite.getDate() + 7);
  let primerLunes = null, ultimoDomingo = null;
  while (cursor <= limite) {
    const lunes = new Date(cursor);
    const domingo = new Date(cursor); domingo.setDate(domingo.getDate() + 6);
    const conteo = {};
    const d = new Date(lunes);
    for (let i = 0; i < 7; i++) { const key = d.getFullYear() + '-' + d.getMonth(); conteo[key] = (conteo[key] || 0) + 1; d.setDate(d.getDate() + 1); }
    let mejorKey = null, mejorCount = -1;
    Object.keys(conteo).forEach(k => { if (conteo[k] > mejorCount) { mejorCount = conteo[k]; mejorKey = k; } });
    const [anioM, mesIdx] = mejorKey.split('-').map(Number);
    if (anioM === anio && mesIdx === mes - 1) { if (!primerLunes) primerLunes = lunes; ultimoDomingo = domingo; }
    cursor = new Date(cursor); cursor.setDate(cursor.getDate() + 7);
  }
  return { desde: primerLunes.toISOString().slice(0, 10), hasta: ultimoDomingo.toISOString().slice(0, 10) };
}
async function cargarEstadisticasRutas(desde, hasta, periodo, filtroNave) {
  document.getElementById('content-title').textContent = 'Rutas & Conductores · Estadísticas';
  const body = document.getElementById('content-body');
  body.innerHTML = '<p class="loading-text">Cargando estadísticas...</p>';
  filtroNave = filtroNave || window.rutasFiltroNaveActual || 'todos';
  window.rutasFiltroNaveActual = filtroNave;
  if (!desde || !hasta) {
    const hoy = new Date();
    periodo = periodo || 'mes';
    if (periodo === 'semana') {
      desde = lunesDeLaSemanaJS_(hoy).toISOString().slice(0, 10);
      hasta = hoy.toISOString().slice(0, 10);
    } else {
      desde = new Date(hoy.getFullYear(), hoy.getMonth(), 1).toISOString().slice(0, 10);
      hasta = hoy.toISOString().slice(0, 10);
    }
  } else {
    periodo = periodo || 'custom';
  }
  try {
    const [resp, respEvo] = await Promise.all([
      fetch('/api/rutas/estadisticas?desde=' + desde + '&hasta=' + hasta + '&nave=' + filtroNave),
      fetch('/api/rutas/evolucion-mensual')
    ]);
    const data = await resp.json();
    const evolucion = await respEvo.json();
    if (data.error) { body.innerHTML = '<p class="loading-text">Error: ' + data.error + '</p>'; return; }
    document.getElementById('last-update-text').textContent = 'Actualizado ' + new Date().toLocaleString('es-ES');
    document.getElementById('last-update-indicator').classList.remove('stale');
    pintarEstadisticasRutas(data, desde, hasta, periodo, evolucion.meses || [], filtroNave);
  } catch (err) {
    console.error('Error en estadísticas de Rutas:', err);
    body.innerHTML = '<p class="loading-text">Error de conexión: ' + (err && err.message ? err.message : err) + '</p>';
  }
}
function graficoBarrasRutas_(meses) {
  const alturaMax = 130;
  const maxVal = Math.max(1, ...meses.flatMap(m => [m.entregas, m.recogidas]));
  return `
    <div style="display:flex; align-items:flex-end; gap:10px; height:${alturaMax + 26}px; overflow-x:auto;">
      ${meses.map(m => `
        <div style="display:flex; flex-direction:column; align-items:center; gap:4px; min-width:44px;">
          <div style="display:flex; align-items:flex-end; gap:3px; height:${alturaMax}px;" title="${m.label}: ${m.entregas} entregas, ${m.recogidas} recogidas">
            <div style="width:14px; background:#4c8c1f; height:${Math.max(2, Math.round(m.entregas / maxVal * alturaMax))}px; border-radius:2px 2px 0 0;"></div>
            <div style="width:14px; background:#C77D0B; height:${Math.max(2, Math.round(m.recogidas / maxVal * alturaMax))}px; border-radius:2px 2px 0 0;"></div>
          </div>
          <div style="font-size:11px; color:var(--text-muted);">${m.label}</div>
        </div>
      `).join('')}
    </div>
    <div style="display:flex; gap:16px; margin-top:10px; font-size:12px; justify-content:center;">
      <span><span style="display:inline-block;width:9px;height:9px;background:#4c8c1f;border-radius:2px;margin-right:5px;"></span>Entregas</span>
      <span><span style="display:inline-block;width:9px;height:9px;background:#C77D0B;border-radius:2px;margin-right:5px;"></span>Recogidas</span>
    </div>
  `;
}
function aplicarSelectorNave_(desde, hasta, periodo) {
  const marbella = document.getElementById('chk-nave-marbella').checked;
  const monda = document.getElementById('chk-nave-monda').checked;
  const seleccion = [];
  if (marbella) seleccion.push('marbella');
  if (monda) seleccion.push('monda');
  cargarEstadisticasRutas(desde, hasta, periodo, seleccion.length > 0 ? seleccion.join(',') : 'todos');
}
function irASemanaISO_() {
  const anio = parseInt(document.getElementById('est-rutas-semana-anio').value, 10);
  const semana = parseInt(document.getElementById('est-rutas-semana-sel').value, 10);
  if (!anio || !semana) return;
  const r = rangoSemanaISO_(anio, semana);
  cargarEstadisticasRutas(r.desde, r.hasta, 'custom');
}
function poblarSemanasISO_(anio) {
  const sel = document.getElementById('est-rutas-semana-sel');
  if (!sel) return;
  const fmtCorto = iso => { const [a, m, d] = iso.split('-'); return d + '/' + m; };
  let opts = '';
  for (let s = 1; s <= 53; s++) {
    const r = rangoSemanaISO_(anio, s);
    opts += `<option value="${s}">Semana ${s} (${fmtCorto(r.desde)} - ${fmtCorto(r.hasta)})</option>`;
  }
  sel.innerHTML = opts;
}
function irAMesISO_() {
  const anio = parseInt(document.getElementById('est-rutas-mes-anio').value, 10);
  const mes = parseInt(document.getElementById('est-rutas-mes-mes').value, 10);
  if (!anio || !mes) return;
  const r = rangoMesPorSemanasISO_(anio, mes);
  cargarEstadisticasRutas(r.desde, r.hasta, 'custom');
}

      </label>

    </div>
    <div style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:0.6rem; align-items:center;">
      ${btnPeriodo('semana', 'Esta semana', periodo === 'semana')}
      ${btnPeriodo('mes', 'Este mes', periodo === 'mes')}
      <span style="width:1px; height:20px; background:var(--border); margin:0 4px;"></span>
      <label style="font-size:13px; color:var(--text-secondary);">Desde
        <input type="date" id="est-rutas-desde" value="${desde}" style="padding:7px; border:1px solid var(--border); border-radius:4px;">
      </label>
      <label style="font-size:13px; color:var(--text-secondary);">hasta
        <input type="date" id="est-rutas-hasta" value="${hasta}" style="padding:7px; border:1px solid var(--border); border-radius:4px;">
      </label>

    </div>
    <div style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:1.25rem; align-items:center; font-size:13px; color:var(--text-secondary);">
      Semana ISO
      <select id="est-rutas-semana-sel" style="padding:7px; border:1px solid var(--border); border-radius:4px;"></select>
      de
      <input type="number" id="est-rutas-semana-anio" value="${anioActual}" onchange="poblarSemanasISO_(parseInt(this.value,10))" style="width:72px; padding:7px; border:1px solid var(--border); border-radius:4px;">
      <button onclick="irASemanaISO_()" style="padding:7px 12px; border-radius:4px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:13px;">Ir</button>

      Mes
      <select id="est-rutas-mes-mes" style="padding:7px; border:1px solid var(--border); border-radius:4px;">
        ${NOMBRES_MES_RUTAS.map((n, i) => `<option value="${i + 1}" ${i + 1 === hoy.getMonth() + 1 ? 'selected' : ''}>${n}</option>`).join('')}
      </select>
      <input type="number" id="est-rutas-mes-anio" value="${anioActual}" style="width:72px; padding:7px; border:1px solid var(--border); border-radius:4px;">
      <button onclick="irAMesISO_()" style="padding:7px 12px; border-radius:4px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:13px;">Ir</button>
    </div>
    <div style="display:flex; gap:1rem; margin-bottom:1.5rem; flex-wrap:wrap;">
      ${kpiCard('Total paradas', data.total_paradas)}
      ${kpiCard('Entregas', data.total_entregas)}

      <div style="background:#fff; border:1px solid var(--border); border-radius:4px; padding:1rem; flex:1; min-width:320px;">

        <table>
          <thead><tr><th>Vehículo</th><th style="text-align:right;">Entregas</th><th style="text-align:right;">Recogidas</th><th style="text-align:right;">Total</th></tr></thead>
          <tbody>${data.vehiculos.map(filaRanking).join('')}</tbody>

      </div>
    </div>
  `;
  body.innerHTML = html;
  poblarSemanasISO_(anioActual);
  document.getElementById('est-rutas-semana-sel').value = String(isoWeekNumberJS_(hoy));
}

async function cargarEstadisticasMaterial() {
  document.getElementById('content-title').textContent = 'Estadísticas de Material';
  const body = document.getElementById('content-body');
  body.innerHTML = '<p class="loading-text">Cargando estadísticas...</p>';
  try {
    const resp = await fetch('/api/material/estadisticas');
    const data = await resp.json();
    if (data.error) { body.innerHTML = '<p class="loading-text">Error: ' + data.error + '</p>'; return; }
    document.getElementById('last-update-text').textContent = 'Actualizado ' + new Date().toLocaleString('es-ES');
    document.getElementById('last-update-indicator').classList.remove('stale');
    window.materialEstadisticasData = data;
    pintarEstadisticasMaterial(data, '');
  } catch (err) {
    console.error('Error en estadísticas de Material:', err);
    body.innerHTML = '<p class="loading-text">Error de conexión: ' + (err && err.message ? err.message : err) + '</p>';
  }
}
function pintarEstadisticasMaterial(data, familiaFiltro) {
  const body = document.getElementById('content-body');
  const familias = [...new Set(data.articulos.map(a => a.familia).filter(Boolean))].sort();
  const articulosFiltrados = familiaFiltro ? data.articulos.filter(a => a.familia === familiaFiltro) : data.articulos;

  const totalIngresos = articulosFiltrados.reduce((s, a) => s + a.importe, 0);
  const masAlquilado = [...articulosFiltrados].sort((a, b) => b.veces - a.veces).slice(0, 15);
  const menosAlquilado = [...articulosFiltrados].filter(a => a.veces > 0).sort((a, b) => a.veces - b.veces).slice(0, 15);
  const masRentable = [...articulosFiltrados].sort((a, b) => b.importe - a.importe).slice(0, 15);

  const colsArticulo = '<th>Artículo</th><th>Familia</th><th style="text-align:right;">Veces</th><th style="text-align:right;">Unidades</th><th style="text-align:right;">Importe</th>';
  const filaArticulo = a => `
    <tr>
      <td>${a.articulo}</td>
      <td style="color:var(--text-muted); font-size:12px;">${a.familia || '—'}</td>
      <td style="text-align:right;">${a.veces}</td>
      <td style="text-align:right;">${a.unidades}</td>
      <td style="text-align:right; font-weight:600;">${formatearEuros(a.importe)}</td>
    </tr>`;
  const filaRotura = r => `
    <tr>
      <td>${r.articulo}</td>
      <td style="text-align:right;">${r.veces}</td>
      <td style="text-align:right;">${r.unidades}</td>
      <td style="text-align:right; font-weight:600; color:#A32D2D;">${formatearEuros(r.importe)}</td>
    </tr>`;
  const filaFamilia = f => `
    <tr>
      <td>${f.familia}</td>
      <td style="text-align:right;">${f.unidades}</td>
      <td style="text-align:right; font-weight:600;">${formatearEuros(f.importe)}</td>
    </tr>`;
  const tabla = (titulo, filasHtml, colsHtml, vacio) => `
    <div style="background:#fff; border:1px solid var(--border); border-radius:4px; padding:1rem; flex:1; min-width:340px;">
      <div style="font-weight:600; margin-bottom:8px;">${titulo}</div>
      ${!filasHtml ? `<p style="font-size:13px; color:var(--text-muted);">${vacio || 'Sin datos.'}</p>` : `
      <div style="overflow-x:auto;"><table>
        <thead><tr>${colsHtml}</tr></thead>
        <tbody>${filasHtml}</tbody>
      </table></div>`}
    </div>`;

  let html = `
    <div style="display:flex; flex-wrap:wrap; gap:0.75rem; margin-bottom:1.25rem; align-items:center;">
      <select id="filtro-familia-material" style="padding:8px; border:1px solid var(--border); border-radius:4px;" onchange="pintarEstadisticasMaterial(window.materialEstadisticasData, this.value)">
        <option value="">Familia: Todas</option>
        ${familias.map(f => `<option value="${f}" ${f === familiaFiltro ? 'selected' : ''}>${f}</option>`).join('')}
      </select>
    </div>
    <div style="display:flex; gap:1rem; margin-bottom:1.5rem; flex-wrap:wrap;">
      ${kpiCard('Artículos distintos', articulosFiltrados.length)}
      ${kpiCard('Ingresos por material', formatearEuros(totalIngresos))}
      ${kpiCard('Más alquilado', masAlquilado[0] ? masAlquilado[0].articulo : '—')}
      ${kpiCard('Más rentable', masRentable[0] ? masRentable[0].articulo : '—')}
    </div>
    <div style="display:flex; gap:1rem; margin-bottom:1rem; flex-wrap:wrap;">
      ${tabla('📈 Más alquilado', masAlquilado.map(filaArticulo).join(''), colsArticulo)}
      ${tabla('💰 Más rentable', masRentable.map(filaArticulo).join(''), colsArticulo)}
    </div>
    <div style="display:flex; gap:1rem; margin-bottom:1rem; flex-wrap:wrap;">
      ${tabla('📉 Menos alquilado', menosAlquilado.map(filaArticulo).join(''), colsArticulo)}
      ${tabla('⚠️ Roturas / no devueltos', data.roturas.slice(0, 15).map(filaRotura).join(''), '<th>Artículo</th><th style="text-align:right;">Veces</th><th style="text-align:right;">Unidades</th><th style="text-align:right;">Importe cobrado</th>', 'Sin roturas registradas.')}
    </div>
    <div style="background:#fff; border:1px solid var(--border); border-radius:4px; padding:1rem;">
      <div style="font-weight:600; margin-bottom:8px;">Ingresos por familia</div>
      <div style="overflow-x:auto;"><table>
        <thead><tr><th>Familia</th><th style="text-align:right;">Unidades</th><th style="text-align:right;">Importe</th></tr></thead>
        <tbody>${data.familias.map(filaFamilia).join('')}</tbody>
      </table></div>
    </div>
  `;
  body.innerHTML = html;
}

function construirMenu() {
  const nav = document.getElementById('nav-container');
  nav.innerHTML = '';

  // Buscador del menú lateral — filtra grupos/subitems por texto mientras se escribe.
  const searchWrap = document.createElement('div');
  searchWrap.style.cssText = 'padding: 0 1.5rem 0.75rem;';
  searchWrap.innerHTML = '<input type="text" id="menu-search-input" placeholder="🔍 Buscar en el menú..." style="width:100%; padding:7px 10px; font-size:12px; border:1px solid var(--border); border-radius:4px; background:#fff; color:var(--text-primary);">';
  nav.appendChild(searchWrap);

  const grupoTitle = document.createElement('div');
  grupoTitle.className = 'nav-group-title';
  grupoTitle.textContent = usuarioActual.rol;
  nav.appendChild(grupoTitle);
  // Rol Comercial: solo ve el apartado Comercial. Rol Logística: solo ve
  // el apartado Logística (incluye Servicios Isabella). Nada más del menú
  // en ninguno de los dos casos.
  const menuVisible = usuarioActual.rol === 'Comercial' ? MENU.filter(item => item.id === 'comercial')
    : usuarioActual.rol === 'Logistica' ? MENU.filter(item => item.id === 'log')
    : MENU;
  menuVisible.forEach(item => {
    const itemEl = document.createElement('div');
    itemEl.className = 'nav-item';
    itemEl.id = 'menu-item-' + item.id;
    itemEl.dataset.label = item.label.toLowerCase();
    itemEl.style.fontWeight = '500';
    itemEl.style.cursor = 'pointer';
    if (item.submenu && !item.especial) {
      itemEl.style.justifyContent = 'space-between';
      itemEl.innerHTML = '<span>' + item.icon + ' ' + item.label + '</span><span class="nav-chevron" style="font-size:10px; color:var(--gray-400); transition:transform .15s;">▸</span>';
    } else {
      itemEl.textContent = item.icon + ' ' + item.label;
    }
    if (item.especial) {
      itemEl.onclick = item.onClick;
    } else if (item.submenu) {
      // Contraído por defecto: pinchar en el grupo solo despliega/repliega sus
      // submenús (no navega), así el menú no queda tan extenso de entrada.
      itemEl.onclick = () => toggleGrupoMenu(item.id);
    } else {
      itemEl.onclick = () => { marcarMenuActivo('menu-item-' + item.id); item.onClick(); };
    }
    nav.appendChild(itemEl);
    if (item.submenu) {
      const submenuEl = document.createElement('div');
      submenuEl.id = 'submenu-' + item.id;
      submenuEl.style.cssText = 'padding-left:1.25rem; display:none;';
      item.submenu.forEach(sub => {
        const subEl = document.createElement('div');
        subEl.className = 'nav-subitem';
        subEl.id = 'menu-item-' + sub.id;
        subEl.dataset.label = sub.label.toLowerCase();
        subEl.style.cssText = 'display:flex; align-items:center; padding:7px 0 7px 1.5rem; font-size:13px; cursor:pointer; color:var(--text-secondary);';
        subEl.textContent = sub.label;
        subEl.onclick = () => { marcarMenuActivo('menu-item-' + sub.id); sub.onClick(); };
        submenuEl.appendChild(subEl);
      });
      nav.appendChild(submenuEl);
    }
  });
  document.getElementById('menu-search-input').addEventListener('input', (e) => filtrarMenuLateral(e.target.value));
  marcarMenuActivo(usuarioActual.rol === 'Comercial' ? 'menu-item-com-resumen' : usuarioActual.rol === 'Logistica' ? 'menu-item-log-resumen' : 'menu-item-resumen');
  // El grupo del item activo por defecto empieza desplegado (si no, Comercial/Logística
  // aterrizarían con su único grupo cerrado y no verían nada al entrar).
  if (usuarioActual.rol === 'Comercial') abrirGrupoMenu('comercial');
  else if (usuarioActual.rol === 'Logistica') abrirGrupoMenu('log');
}
function toggleGrupoMenu(groupId) {
  const submenuEl = document.getElementById('submenu-' + groupId);
  if (!submenuEl) return;
  const abierto = submenuEl.style.display !== 'none';
  submenuEl.style.display = abierto ? 'none' : 'block';
  const chevron = document.querySelector('#menu-item-' + groupId + ' .nav-chevron');
  if (chevron) chevron.style.transform = abierto ? '' : 'rotate(90deg)';
}
function abrirGrupoMenu(groupId) {
  const submenuEl = document.getElementById('submenu-' + groupId);
  if (submenuEl) submenuEl.style.display = 'block';
  const chevron = document.querySelector('#menu-item-' + groupId + ' .nav-chevron');
  if (chevron) chevron.style.transform = 'rotate(90deg)';
}
// Filtra el menú lateral por texto: si un grupo coincide se muestran todos sus
// subitems; si solo coincide algún subitem, se despliega el grupo automáticamente
// para que se vea. Con el buscador vacío se restaura todo (grupos quedan como estaban).
function filtrarMenuLateral(query) {
  const q = (query || '').trim().toLowerCase();
  document.querySelectorAll('#nav-container .nav-item').forEach(itemEl => {
    const groupId = itemEl.id.replace('menu-item-', '');
    const submenuEl = document.getElementById('submenu-' + groupId);
    const groupMatch = !q || (itemEl.dataset.label || '').includes(q);
    if (!submenuEl) {
      itemEl.style.display = groupMatch ? '' : 'none';
      return;
    }
    let anySubMatch = false;
    submenuEl.querySelectorAll('.nav-subitem').forEach(subEl => {
      const subMatch = groupMatch || !q || (subEl.dataset.label || '').includes(q);
      subEl.style.display = subMatch ? '' : 'none';
      if (subMatch) anySubMatch = true;
    });
    itemEl.style.display = (groupMatch || anySubMatch) ? '' : 'none';
    if (q && (groupMatch || anySubMatch)) submenuEl.style.display = 'block';
  });
}
function marcarMenuActivo(idActivo) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-subitem').forEach(el => {
    el.style.background = 'transparent';
    el.style.borderLeft = '2px solid transparent';
    el.style.color = 'var(--text-secondary)';
    el.style.fontWeight = 'normal';
  });
  const el = document.getElementById(idActivo);
  if (!el) return;
  if (el.classList.contains('nav-subitem')) {
    el.style.background = '#f3ead9';
    el.style.borderLeft = '2px solid #b8956a';
    el.style.color = '#8a6d1e';
    el.style.fontWeight = '500';
  } else {
    el.classList.add('active');
  }
}

function copiarAlPortapapeles(texto, elemento) {
  navigator.clipboard.writeText(String(texto)).then(() => {
    if (elemento) {
      const original = elemento.textContent;
      elemento.textContent = '✓ Copiado';
      elemento.style.color = '#27500A';
      setTimeout(() => {
        elemento.textContent = original;
        elemento.style.color = '';
      }, 1000);
    }
  }).catch(() => {});
}
function renderPreparacionPorProyecto() {
  const data = preparacionDataGlobal[preparacionVistaActiva];
  const busqueda = (document.getElementById('buscador-prep').value || '').toLowerCase();
  const cont = document.getElementById('prep-contenido');
  const coincide = (item) => {
    if (!busqueda) return true;
    return (item.cliente || '').toLowerCase().includes(busqueda) || String(item.numero || '').includes(busqueda);
  };
  let html = '';
  data.orden_periodos.forEach(periodo => {
    const grupo = data.por_proyecto[periodo];
    if (!grupo) return;
    const confirmados = grupo.confirmado.filter(coincide);
    const preparados = grupo.preparado.filter(coincide);
    if (confirmados.length === 0 && preparados.length === 0 && busqueda) return;
    html += `
      <div style="margin-bottom:1.5rem;">
        <p style="font-size:14px; font-weight:500; color:#1a1a18; margin:0 0 8px;">${periodo}</p>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
          <div>

            <p style="font-size:12px; color:#27500A; margin:0 0 6px; font-weight:500;">Preparado (${preparados.length})</p>
            ${renderTarjetasProyectosPrep(preparados, 'success')}
          </div>
        </div>
      </div>
    `;
  });
  cont.innerHTML = html || '<p style="color:#9a988f; font-size:13px;">Sin resultados.</p>';
}

let ordenFacturas = { campo: 'numero_factura', asc: false };
let ordenPNC = { campo: 'numero', asc: false };
function ordenarLista(lista, orden) {
  const copia = [...lista];
  copia.sort((a, b) => {
    let va = a[orden.campo], vb = b[orden.campo];
    if (Array.isArray(va) || Array.isArray(vb)) {
      va = (Array.isArray(va) ? va.join(', ') : (va || '')).toLowerCase();
      vb = (Array.isArray(vb) ? vb.join(', ') : (vb || '')).toLowerCase();
    } else if (orden.campo.startsWith('fecha') || orden.campo.startsWith('evento')) {
      va = parsearFechaDDMMYYYY(va); vb = parsearFechaDDMMYYYY(vb);
    } else if (typeof va === 'boolean' || typeof vb === 'boolean') {
      va = va ? 1 : 0; vb = vb ? 1 : 0;
    } else if (typeof va === 'string') {
      va = (va || '').toLowerCase(); vb = (vb || '').toLowerCase();
    } else {
      va = parseFloat(va) || 0; vb = parseFloat(vb) || 0;
    }
    if (va < vb) return orden.asc ? -1 : 1;
    if (va > vb) return orden.asc ? 1 : -1;
    return 0;
  });
  return copia;
}
function parsearFechaDDMMYYYY(str) {
  if (!str) return new Date(0);
  const soloFecha = String(str).split(' ')[0]; // admite "dd/MM/yyyy" y "dd/MM/yyyy HH:mm"
  const partes = soloFecha.split('/');
  if (partes.length !== 3) return new Date(0);
  return new Date(partes[2], partes[1] - 1, partes[0]);
}
function cambiarOrden(tabla, campo) {
  const orden = tabla === 'facturas' ? ordenFacturas : ordenPNC;
  if (orden.campo === campo) orden.asc = !orden.asc;
  else { orden.campo = campo; orden.asc = true; }
  if (tabla === 'facturas') aplicarFiltrosFacturas();
  else aplicarFiltrosPNC();
}
function flechaOrden(tabla, campo) {
  const orden = tabla === 'facturas' ? ordenFacturas : ordenPNC;
  if (orden.campo !== campo) return '';
  return orden.asc ? ' ▲' : ' ▼';
}

let facturasProveedoresDataGlobal = null;

async function cargarFacturasProveedores() {
  document.getElementById('content-title').textContent = 'Facturas Proveedores · Listado';
  const body = document.getElementById('content-body');
  body.innerHTML = '<p class="loading-text">Cargando facturas...</p>';
  try {
    const resp = await fetch('/api/facturas-proveedores');
    const data = await resp.json();
    if (data.error) { body.innerHTML = '<p class="loading-text">Error: ' + data.error + '</p>'; return; }
    facturasProveedoresDataGlobal = data;
    facturasFiltroDepartamentoActivo = null;
    pintarFacturasProveedores();
  } catch (err) {
    body.innerHTML = '<p class="loading-text">Error de conexión</p>';
  }
}
async function sincronizarFacturasProveedores() {
  const btn = document.getElementById('btn-sync-facturas');
  const estadoSync = document.getElementById('estado-sync-facturas');
  btn.disabled = true;
  btn.textContent = '⏳ Sincronizando...';
  estadoSync.textContent = '';
  try {
    const resp = await fetch('/api/facturas-proveedores/sincronizar?anio=2026', { method: 'POST' });
    const data = await resp.json();
    if (data.error) {
      estadoSync.textContent = 'Error: ' + data.error;
      estadoSync.style.color = '#A32D2D';
    } else {
      estadoSync.textContent = `✓ ${data.procesadas} facturas nuevas procesadas${data.con_error > 0 ? ', ' + data.con_error + ' con error' : ''}.`;
      estadoSync.style.color = '#27500A';
      await cargarFacturasProveedores();
      return;
    }
  } catch (err) {
    estadoSync.textContent = 'Error de conexión';
    estadoSync.style.color = '#A32D2D';
  } finally {
    btn.disabled = false;
    btn.textContent = '🔄 Actualizar facturas';
  }
}

function aplicarFiltrosFacturasProveedores() {

  }
  if (proveedor) filtradas = filtradas.filter(f => f.proveedor === proveedor);

  if (contabilizada) filtradas = filtradas.filter(f => contabilizada === 'si' ? !!f.contabilizada : !f.contabilizada);
  if (busqueda) {

// Guarda un campo (manual o de los extraídos por IA) al vuelo, sin recargar
// toda la tabla - así se puede ir marcando/corrigiendo sin perder el sitio.
async function actualizarCampoFacturaUI(el, fileId, campo) {
  const valor = el.type === 'checkbox' ? el.checked : el.value;
  el.disabled = true;
  try {
    const resp = await fetch('/api/facturas-proveedores/actualizar', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fileId, campo, valor })
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    const f = (facturasProveedoresDataGlobal.facturas || []).find(x => String(x.fileId) === String(fileId));
    if (f) f[campo] = valor;
  } catch (err) {
    alert('Error al guardar: ' + err.message);
  } finally {
    el.disabled = false;
  }
}

async function guardarConfiguracionProveedores() {
  const proveedores = configProveedoresGlobal.proveedores;
  const filasParaGuardar = [];
  let hayErrores = false;
  proveedores.forEach(prov => {
    const idProv = 'prov-' + prov.replace(/[^a-zA-Z0-9]/g, '');
    const cont = document.getElementById('filas-' + idProv);
    const filas = cont.querySelectorAll('.fila-dep');
    let suma = 0;
    filas.forEach(fila => {
      const departamento = fila.querySelector('.select-departamento').value;
      const porcentaje = parseFloat(fila.querySelector('.input-porcentaje').value) || 0;
      if (departamento && porcentaje > 0) {
        filasParaGuardar.push({ proveedor: prov, departamento, porcentaje });
        suma += porcentaje;
      }
    });
    if (suma !== 0 && suma !== 100) hayErrores = true;
  });
  const estado = document.getElementById('estado-guardar-reparto');
  if (hayErrores) {
    estado.textContent = '⚠️ Hay proveedores cuyos porcentajes no suman 100%. Revísalos antes de guardar.';
    estado.style.color = '#A32D2D';
    return;
  }
  estado.textContent = 'Guardando...';
  estado.style.color = '#6b6a64';
  try {
    const resp = await fetch('/api/facturas-proveedores/reparto', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reparto: filasParaGuardar })
    });
    const data = await resp.json();
    if (data.error) {
      estado.textContent = 'Error: ' + data.error;
      estado.style.color = '#A32D2D';
    } else {
      estado.textContent = '✓ Configuración guardada (' + data.guardadas + ' reglas)';
      estado.style.color = '#27500A';
      configProveedoresGlobal.reparto = filasParaGuardar;
    }
  } catch (err) {
    estado.textContent = 'Error de conexión';
    estado.style.color = '#A32D2D';
  }
}

function actualizarIndicadorFecha(fecha) {
  const textEl = document.getElementById('last-update-text');
  const indicatorEl = document.getElementById('last-update-indicator');
  if (!fecha) {
    textEl.textContent = 'Sin datos';
    indicatorEl.classList.add('stale');
    return;
  }
  let fechaObj;
  if (fecha.includes('T')) {
    // Formato ISO de Supabase: 2026-08-25T14:46:00.099+00:00
    fechaObj = new Date(fecha);
  } else {
    // Formato antiguo de Apps Script: dd/MM/yyyy HH:mm:ss
    const [fechaParte, horaParte] = fecha.split(' ');
    const [dia, mes, anio] = fechaParte.split('/');
    fechaObj = new Date(anio, mes - 1, dia, ...(horaParte ? horaParte.split(':') : []));
  }
  textEl.textContent = 'Actualizado ' + fechaObj.toLocaleString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const diffHoras = (new Date() - fechaObj) / (1000 * 60 * 60);
  indicatorEl.classList.toggle('stale', diffHoras > 2);
}

  });
}
function aplicarFiltrosProyectos(proyectos) {
  const texto = (document.getElementById('buscador-proyectos').value || '').toLowerCase();
  const estado = document.getElementById('filtro-estado-proyectos').value;
  const desde = document.getElementById('filtro-fecha-desde-proyectos').value;
  const hasta = document.getElementById('filtro-fecha-hasta-proyectos').value;
  let filtrados = proyectos.filter(p => {
    const coincideTexto = (p.cliente || '').toLowerCase().includes(texto) || String(p.numero || '').includes(texto);
    const coincideEstado = !estado || p.estado === estado;
    let coincideFecha = true;
    if ((desde || hasta) && p.evento_inicio) {
      const [fParte] = p.evento_inicio.split(' ');
      const [d, m, a] = fParte.split('/');
      const fechaEvento = `${a}-${m}-${d}`;
      if (desde && fechaEvento < desde) coincideFecha = false;
      if (hasta && fechaEvento > hasta) coincideFecha = false;
    } else if (desde || hasta) {
      coincideFecha = false;
    }
    return coincideTexto && coincideEstado && coincideFecha;
  });
  filtrados = ordenarLista(filtrados, ordenProyectos);
  document.getElementById('tabla-proyectos-body').innerHTML = filtrados.map(filaProyecto).join('');
}
function filaProyecto(p) {
  const badgeClass = badgeParaEstado(p.estado);
  return `
    <tr>
      <td style="text-align:center; width:28px;">${p.id ? `<button class="btn-material" onclick="abrirModalMaterialProyecto('${p.id}', '${String(p.numero || '').replace(/'/g, "\\'")}')" title="Ver material y servicios">&#128230;</button>` : ''}</td>
      <td class="celda-copiable" onclick="copiarAlPortapapeles('${p.numero || ''}', event)" title="Clic para copiar">${p.numero || ''}</td>
      <td>${p.cliente || ''}</td>
      <td>${p.comercial || ''}</td>
      <td>${(p.fecha_creacion || '').split(' ')[0]}</td>
      <td>${(p.evento_inicio || '').split(' ')[0]}</td>
      <td><span class="badge ${badgeClass}">${p.estado || ''}</span></td>
      <td style="text-align:right;">${formatearEuros(p.valor)}</td>
    </tr>
  `;
}
function badgeParaEstado(estado) {
  if (estado === 'Canceled') return 'badge-danger';
  if (estado === 'Pending' || estado === 'Concept') return 'badge-warning';
  return 'badge-success';
}
function formatearEuros(valor) {
  const n = parseFloat(valor) || 0;
  return n.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: 'always' }) + ' €';
}
function copiarAlPortapapeles(texto, ev) {
  if (ev) ev.stopPropagation();
  if (!texto) return;
  navigator.clipboard.writeText(String(texto)).then(() => mostrarToastCopiado(ev)).catch(() => {});
}
function mostrarToastCopiado(ev) {
  const toast = document.createElement('div');
  toast.textContent = '✓ Copiado';
  toast.style.cssText = 'position:fixed; padding:5px 10px; background:#1a1a18; color:#fff; border-radius:4px; font-size:12px; z-index:9999; pointer-events:none; transition:opacity 0.3s;';
  const x = (ev && ev.clientX) ? ev.clientX + 8 : window.innerWidth / 2;
  const y = (ev && ev.clientY) ? ev.clientY - 28 : 20;
  toast.style.left = x + 'px';
  toast.style.top = y + 'px';
  document.body.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 700);
}

// cara a la ruta. Los "badges" de color son solo una ayuda visual por
// palabra clave — no dependen de que el texto exacto de Rentman coincida
// al 100%, el filtro de tipo sí usa el valor real tal cual venga.

let SERVICIOS_EXTRA_DATA = null;
let servExtraFiltroTipo = '';
async function cargarServiciosExtra() {
  document.getElementById('content-title').textContent = 'Servicios Extra · Próximos 15 días';
  const body = document.getElementById('content-body');
  body.innerHTML = '<p class="loading-text">Cargando...</p>';
  try {
    const resp = await fetch('/api/logistica/servicios-extra');
    const data = await resp.json();
    if (data.error) { body.innerHTML = '<p class="loading-text">Error: ' + data.error + '</p>'; return; }
    SERVICIOS_EXTRA_DATA = data;
    servExtraFiltroTipo = '';
    pintarServiciosExtra();
  } catch (err) { body.innerHTML = '<p class="loading-text">Error de conexión</p>'; }
}
function servicioExtraBadge(nombre) {
  const n = (nombre || '').toLowerCase();
  if (n.includes('noctur')) return { bg: '#2a2a2a', fg: '#fff', icon: '🌙' };
  if (n.includes('doming')) return { bg: '#FCEBEB', fg: '#A32D2D', icon: '☀️' };
  if (n.includes('desplaz')) return { bg: '#cfe3fc', fg: '#1c4e80', icon: '🚚' };
  if (n.includes('montaj')) return { bg: '#d8f0dc', fg: '#1f6b3a', icon: '🔧' };
  return { bg: 'var(--gray-100)', fg: 'var(--text-secondary)', icon: '➕' };
}
function etiquetaDiaServExtra(diasDesdeHoy, fechaIso) {
  const [y, m, d] = fechaIso.split('-');
  const fechaFmt = d + '/' + m + '/' + y;
  if (diasDesdeHoy === 0) return 'HOY · ' + fechaFmt;
  if (diasDesdeHoy === 1) return 'MAÑANA · ' + fechaFmt;
  const dt = new Date(y, m - 1, d);
  const diaSemana = dt.toLocaleDateString('es-ES', { weekday: 'long' });
  return diaSemana.charAt(0).toUpperCase() + diaSemana.slice(1) + ' · ' + fechaFmt;
}
function toggleServExtraCard(headerEl) {
  const card = headerEl.closest('.servextra-card');
  const detalle = card.querySelector('.servextra-detalle');
  const chevron = card.querySelector('.servextra-chevron');
  const abierto = detalle.style.display !== 'none';
  detalle.style.display = abierto ? 'none' : 'block';
  chevron.style.transform = abierto ? '' : 'rotate(180deg)';
}

            </div>

function isabellaToggleTipo(prefix) {
  const tipo = document.getElementById(prefix + '-tiposervicio').value; // 'vehiculo' | 'personal' | 'combustible'
  const esVehiculo = tipo === 'vehiculo';
  const esCombustible = tipo === 'combustible';
  const fVeh = document.getElementById(prefix + '-field-vehiculo');
  const fKm = document.getElementById(prefix + '-field-km');
  const fVehNombre = document.getElementById(prefix + '-field-vehnombre');
  const fHoras = document.getElementById(prefix + '-field-horas');
  const fPersonas = document.getElementById(prefix + '-field-personas');
  if (fVeh) fVeh.style.display = esVehiculo ? '' : 'none';
  if (fKm) fKm.style.display = esVehiculo ? '' : 'none';
  // El nombre del vehículo también aplica a Combustible (para anotar qué coche se repostó).
  if (fVehNombre) fVehNombre.style.display = (esVehiculo || esCombustible) ? '' : 'none';
  if (fHoras) fHoras.style.display = esCombustible ? 'none' : '';
  if (fPersonas) fPersonas.style.display = esCombustible ? 'none' : '';
  if (!esVehiculo) { const kmEl = document.getElementById(prefix + '-km'); if (kmEl) kmEl.value = 0; }
  if (esCombustible) {
    const hEl = document.getElementById(prefix + '-horas'); if (hEl) hEl.value = 0;
    const pEl = document.getElementById(prefix + '-personas'); if (pEl) pEl.value = 1;
  }
}
function calcularIsabella() {
  clearTimeout(isabellaCalcTimer);
  isabellaCalcTimer = setTimeout(async () => {
    const tipo = document.getElementById('ic-tiposervicio').value;
    const vehTipo = tipo === 'vehiculo' ? parseInt(document.getElementById('ic-vehiculo').value) : 0;
    const km = tipo === 'vehiculo' ? (parseFloat(document.getElementById('ic-km').value) || 0) : 0;
    const horas = tipo === 'combustible' ? 0 : (parseFloat(document.getElementById('ic-horas').value) || 0);
    const personas = tipo === 'combustible' ? 1 : (parseInt(document.getElementById('ic-personas').value) || 1);
    try {
      const resp = await fetch('/api/isabella/calcular', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tipo, vehTipo, km, horas, personas }) });
      const data = await resp.json();
      if (data.error) { document.getElementById('ic-total').innerHTML = 'Error al calcular'; return; }
      document.getElementById('ic-total').innerHTML = euros(data.importe) + ' <span style="font-size:14px; font-weight:400; color:var(--gray-400);">importe a facturar</span>';
      if (data.combustible !== undefined) {
        const bd = document.getElementById('ic-breakdown');
        bd.style.display = 'grid';
        bd.innerHTML = tipo === 'combustible'
          ? `<div style="background:#fff; border:1px solid var(--border); border-radius:8px; padding:10px 12px;"><div style="font-size:11px; color:var(--gray-400); text-transform:uppercase;">Combustible (tarifa fija)</div><div style="font-size:15px; font-weight:600;">${euros(data.combustible)}</div></div>`
          : `

          <div style="background:#fff; border:1px solid var(--border); border-radius:8px; padding:10px 12px;"><div style="font-size:11px; color:var(--gray-400); text-transform:uppercase;">Desgaste vehículo</div><div style="font-size:15px; font-weight:600;">${euros(data.desgaste)}</div></div>

        `;

    } catch (err) { document.getElementById('ic-total').innerHTML = 'Error de conexión'; }
  }, 200);

async function isabellaCargarTabla() {
  const wrap = document.getElementById('ir-tabla-wrap');
  wrap.innerHTML = '<p class="loading-text">Cargando...</p>';
  const empresa = document.getElementById('ir-filtro-empresa').value;
  const todos = document.getElementById('ir-filtro-todos').checked;
  const mes = todos ? '' : document.getElementById('ir-filtro-mes').value;
  document.getElementById('ir-filtro-mes').disabled = todos;
  try {
    const params = new URLSearchParams();
    if (empresa) params.set('empresa', empresa);
    if (mes) params.set('mes', mes);
    const resp = await fetch('/api/isabella/servicios?' + params.toString());
    const data = await resp.json();
    if (data.error) { wrap.innerHTML = '<p class="loading-text">Error: ' + data.error + '</p>'; return; }
    ISABELLA_LAST_LIST = data.data || [];
    isabellaPintarTabla(ISABELLA_LAST_LIST);
  } catch (err) { wrap.innerHTML = '<p class="loading-text">Error de conexión</p>'; }
}
function isabellaVehLabel(t) { return t == 1 ? 'Camión Azul' : t == 2 ? 'Camión 3.500 Kg' : t == 3 ? 'Furgoneta' : 'Sin vehículo'; }
// Combustible (repostaje) puede llevar vehNombre sin vehTipo (no es un camión propio de ORUM) — se prioriza el nombre si existe.
function isabellaVehCelda(s) { return s.vehNombre || (Number(s.vehTipo) > 0 ? isabellaVehLabel(s.vehTipo) : 'Sin vehículo'); }
function isabellaFmtFecha(iso) { const p = String(iso).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso; }
function isabellaPintarTabla(list) {
  const wrap = document.getElementById('ir-tabla-wrap');
  if (!list.length) { wrap.innerHTML = '<p class="loading-text">Todavía no hay servicios registrados.</p>'; return; }
  const admin = isabellaEsAdmin();
  const filas = list.slice().sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)) || b.id - a.id).map(s => `
    <tr>

  wrap.innerHTML = `

      ${admin ? '<th>Coste real</th><th>Beneficio</th><th></th>' : ''}
    </tr></thead><tbody>${filas}</tbody></table>
    </div>
  `;
}
async function isabellaAnadirServicio() {
  const fecha = document.getElementById('ir-fecha').value;
  if (!fecha) { alert('Indica la fecha del servicio.'); return; }
  const tipo = document.getElementById('ir-tiposervicio').value;
  const esVehiculo = tipo === 'vehiculo';
  const esCombustible = tipo === 'combustible';
  const payload = {
    fecha, tipo, empresa: document.getElementById('ir-empresa').value, pedido: document.getElementById('ir-pedido').value.trim(),
    vehNombre: (esVehiculo || esCombustible) ? document.getElementById('ir-vehnombre').value.trim() : '',
    vehTipo: esVehiculo ? parseInt(document.getElementById('ir-vehiculo').value) : 0,
    personal: document.getElementById('ir-personal').value.trim(),
    personas: esCombustible ? 1 : (parseInt(document.getElementById('ir-personas').value) || 1),
    km: esVehiculo ? (parseFloat(document.getElementById('ir-km').value) || 0) : 0,
    horas: esCombustible ? 0 : (parseFloat(document.getElementById('ir-horas').value) || 0),
    desc: document.getElementById('ir-desc').value.trim()
  };
  const btn = document.getElementById('ir-add-btn');
  const estado = document.getElementById('ir-add-estado');
  btn.disabled = true; estado.textContent = 'Guardando…'; estado.style.color = 'var(--gray-400)';
  try {
    const resp = await fetch('/api/isabella/servicios', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const data = await resp.json();
    if (data.error) { estado.textContent = 'Error: ' + data.error; estado.style.color = '#A32D2D'; return; }
    estado.textContent = '✓ Guardado'; estado.style.color = '#27500A';
    ['ir-pedido', 'ir-vehnombre', 'ir-personal', 'ir-desc'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('ir-personas').value = 1;
    document.getElementById('ir-km').value = 0;
    document.getElementById('ir-horas').value = 0;
    isabellaCargarTabla();
  } catch (err) { estado.textContent = 'Error de conexión'; estado.style.color = '#A32D2D'; }
  finally { btn.disabled = false; }
}
async function isabellaBorrarServicio(id) {
  if (!confirm('¿Eliminar este servicio del registro?')) return;
  try {
    const resp = await fetch('/api/isabella/servicios/' + id, { method: 'DELETE' });
    const data = await resp.json();
    if (data.error) { alert('No se pudo eliminar: ' + data.error); return; }
    isabellaCargarTabla();
  } catch (err) { alert('Error de conexión'); }
}
function isabellaExportarCSV() {
  const headers = ['Fecha', 'Empresa', 'Pedido', 'Vehiculo', 'Personal', 'NumPersonas', 'Km', 'HorasPorPersona', 'ImporteACobrar', 'Descripcion'];
  const rows = ISABELLA_LAST_LIST.map(s => [s.fecha, s.empresa, s.pedido, isabellaVehCelda(s), s.personal, s.personas || 1, s.km, s.horas, Number(s.importe).toFixed(2), (s.desc || '').replace(/;/g, ',')]);
  const csv = headers.join(';') + '\n' + rows.map(r => r.join(';')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'servicios_isabella.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function donutSVG(segmentos, size) {
  size = size || 140;
  const total = segmentos.reduce((s, x) => s + x.valor, 0);
  const r = size / 2 - 14, cx = size / 2, cy = size / 2, circ = 2 * Math.PI * r;
  if (total === 0) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="18"/></svg>`;
  }
  let acc = 0;
  const arcos = segmentos.filter(s => s.valor > 0).map(s => {
    const frac = s.valor / total;
    const dash = frac * circ;
    const offset = -acc * circ;
    acc += frac;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="18" stroke-dasharray="${dash} ${circ - dash}" stroke-dashoffset="${offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcos}<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" font-size="22" font-weight="600" fill="#1a1a18">${total}</text></svg>`;
}
function leyendaDonut(segmentos) {
  return segmentos.map(s => `
    <div style="display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:6px;">
      <span style="width:10px; height:10px; border-radius:50%; background:${s.color}; flex-shrink:0;"></span>
      <span style="flex:1; color:var(--text-secondary);">${s.etiqueta}</span>
      <span style="font-weight:600;">${s.valor}</span>
    </div>
  `).join('');
}
const NOMBRES_MES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
function evolucionMensualPresupuestos(presupuestos) {
  const hoy = new Date();
  const anio = hoy.getFullYear();
  const meses = [];
  for (let m = 0; m <= 11; m++) {
    meses.push({ label: NOMBRES_MES[m], mes: m, emitidos: 0, aceptados: 0, cancelados: 0 });
  }
  presupuestos.forEach(p => {
    if (!p.fecha_emision) return;
    const partes = String(p.fecha_emision).split('/'); // dd/MM/yyyy
    if (partes.length !== 3) return;
    const mesPresu = parseInt(partes[1], 10) - 1;
    const anioPresu = parseInt(partes[2], 10);
    if (anioPresu !== anio || mesPresu < 0 || mesPresu > 11) return;
    const bucket = meses[mesPresu];
    bucket.emitidos++;
    if (p.semaforo === 'ganado') bucket.aceptados++;
    else if (p.semaforo === 'perdido') bucket.cancelados++;
  });
  return meses;
}
function graficoBarrasMensuales(meses) {
  const alturaMax = 130;
  const maxVal = Math.max(1, ...meses.flatMap(m => [m.emitidos, m.aceptados, m.cancelados]));
  return `
    <div style="display:flex; align-items:flex-end; gap:10px; height:${alturaMax + 26}px; overflow-x:auto;">
      ${meses.map(m => `
        <div style="display:flex; flex-direction:column; align-items:center; gap:4px; min-width:44px;">
          <div style="display:flex; align-items:flex-end; gap:3px; height:${alturaMax}px;" title="${m.label}: ${m.emitidos} emitidos, ${m.aceptados} aceptados, ${m.cancelados} cancelados">
            <div style="width:11px; background:#9a988f; height:${Math.max(2, Math.round(m.emitidos / maxVal * alturaMax))}px; border-radius:2px 2px 0 0;"></div>
            <div style="width:11px; background:#4c8c1f; height:${Math.max(2, Math.round(m.aceptados / maxVal * alturaMax))}px; border-radius:2px 2px 0 0;"></div>
            <div style="width:11px; background:#A32D2D; height:${Math.max(2, Math.round(m.cancelados / maxVal * alturaMax))}px; border-radius:2px 2px 0 0;"></div>
          </div>
          <div style="font-size:11px; color:var(--text-muted);">${m.label}</div>
        </div>
      `).join('')}
    </div>
    <div style="display:flex; gap:16px; margin-top:10px; font-size:12px; justify-content:center;">
      <span><span style="display:inline-block;width:9px;height:9px;background:#9a988f;border-radius:2px;margin-right:5px;"></span>Emitidos</span>
      <span><span style="display:inline-block;width:9px;height:9px;background:#4c8c1f;border-radius:2px;margin-right:5px;"></span>Aceptados</span>
      <span><span style="display:inline-block;width:9px;height:9px;background:#A32D2D;border-radius:2px;margin-right:5px;"></span>Cancelados</span>
    </div>
  `;
}

function pintarPresupuestos(presupuestos) {
  const body = document.getElementById('content-body');

    body.innerHTML = '<p class="loading-text">No hay presupuestos para mostrar.</p>';

  }
  const verComercial = usuarioActual.rol !== 'Comercial';
  const totalEmitidos = presupuestos.length;
  // "En juego" = solo lo que todavía está por decidir (verde/amarillo/rojo/negro).
  // Lo ganado ya no es pipeline, es facturación cerrada; lo perdido no cuenta.
  const importePipeline = presupuestos.filter(p => ['verde', 'amarillo', 'rojo', 'negro'].includes(p.semaforo))
    .reduce((s, p) => s + (parseFloat(p.importe_sin_iva) || 0), 0);
