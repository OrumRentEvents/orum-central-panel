  const perdidos = presupuestos.filter(p => p.semaforo === 'perdido').length;
  const decididos = ganados + perdidos;
  const tasaConversion = decididos > 0 ? Math.round((ganados / decididos) * 100) : 0;
  const pendientes = presupuestos.filter(p => ['verde', 'amarillo', 'rojo'].includes(p.semaforo));
  const caducados = presupuestos.filter(p => p.semaforo === 'negro');
  // El listado solo enseña lo que sigue en etapa comercial (Pending/Concept/
  // Inquiry) - lo ya confirmado, cancelado o ejecutado (Confirmed, Canceled,
  // Returned, On location...) ya no aporta como seguimiento y solo ensucia
  // la tabla; sigue contando en los KPIs de arriba (Ganados/Perdidos/etc.).
  const presupuestosListado = presupuestos.filter(p => p.en_pipeline);
  window.presupuestosOriginales = presupuestosListado;
  const estadosDisponibles = [...new Set(presupuestosListado.map(p => p.estado).filter(Boolean))].sort();
  const comercialesDisponibles = [...new Set(presupuestosListado.map(p => p.comercial).filter(Boolean))].sort();

  let html = `
    <div style="display:flex; gap:1rem; margin-bottom:1.25rem; flex-wrap:wrap;">
      <div style="flex:1; min-width:160px; background:#fff; border:1px solid var(--border); border-radius:4px; padding:1rem;">
        <div style="font-size:12px; color:var(--text-muted);">Presupuestos emitidos</div>
        <div style="font-size:22px; font-weight:600;">${totalEmitidos}</div>
      </div>
      <div style="flex:1; min-width:160px; background:#fff; border:1px solid var(--border); border-radius:4px; padding:1rem;">
        <div style="font-size:12px; color:var(--text-muted);">Importe en juego</div>
        <div style="font-size:22px; font-weight:600;">${formatearEuros(importePipeline)}</div>
      </div>
      <div style="flex:1; min-width:160px; background:#fff; border:1px solid var(--border); border-radius:4px; padding:1rem;">
        <div style="font-size:12px; color:var(--text-muted);">Tasa de conversión</div>
        <div style="font-size:22px; font-weight:600;">${tasaConversion}%</div>
      </div>
      <div style="flex:1; min-width:160px; background:#fff; border:1px solid ${grupoPresupuestos === 'pendientes' ? 'var(--accent, #1a1a18)' : 'var(--border)'}; border-width:${grupoPresupuestos === 'pendientes' ? '2px' : '1px'}; border-radius:4px; padding:1rem; cursor:pointer;" onclick="filtrarPresupuestosPorGrupo('pendientes')">
        <div style="font-size:12px; color:var(--text-muted);">Pendientes</div>
        <div style="font-size:22px; font-weight:600;">${pendientes.length}</div>
      </div>
      <div style="flex:1; min-width:160px; background:#fff; border:1px solid ${grupoPresupuestos === 'caducados' ? 'var(--accent, #1a1a18)' : 'var(--border)'}; border-width:${grupoPresupuestos === 'caducados' ? '2px' : '1px'}; border-radius:4px; padding:1rem; cursor:pointer;" onclick="filtrarPresupuestosPorGrupo('caducados')">
        <div style="font-size:12px; color:var(--text-muted);">Caducados</div>
        <div style="font-size:22px; font-weight:600;">${caducados.length}</div>
      </div>
      <div style="flex:1; min-width:160px; background:#fff; border:1px solid var(--border); border-radius:4px; padding:1rem;">
        <div style="font-size:12px; color:var(--text-muted);">Ganados / Perdidos</div>
        <div style="font-size:22px; font-weight:600;">${ganados} / ${perdidos}</div>
      </div>
    </div>
  `;
  html += `
    <div style="display:flex; flex-wrap:wrap; gap:0.75rem; margin-bottom:1rem; align-items:center;">
      <div class="search-box" style="flex:1; min-width:200px;">
        <input type="text" id="buscador-presupuestos" placeholder="Buscar cliente o proyecto...">
      </div>
      <select id="filtro-estado-presupuestos" style="padding:8px; border:1px solid var(--border); border-radius:4px;">
        <option value="">Estado: Todos</option>
        ${estadosDisponibles.map(e => `<option value="${e}">${e}</option>`).join('')}
      </select>
      ${verComercial ? `
      <select id="filtro-comercial-presupuestos" style="padding:8px; border:1px solid var(--border); border-radius:4px;">
        <option value="">Comercial: Todos</option>
        ${comercialesDisponibles.map(c => `<option value="${c}">${c}</option>`).join('')}
      </select>` : ''}
      <label style="font-size:13px; color:var(--text-secondary);">Evento desde
        <input type="date" id="filtro-fecha-desde-presupuestos" style="padding:7px; border:1px solid var(--border); border-radius:4px;">
      </label>
      <label style="font-size:13px; color:var(--text-secondary);">hasta
        <input type="date" id="filtro-fecha-hasta-presupuestos" style="padding:7px; border:1px solid var(--border); border-radius:4px;">
      </label>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width:28px;"></th>
          <th style="cursor:pointer;" onclick="cambiarOrdenPresupuestos('numero_proyecto')">Nº proyecto${flechaOrdenPresupuestos('numero_proyecto')}</th>
          <th style="cursor:pointer;" onclick="cambiarOrdenPresupuestos('cliente')">Cliente${flechaOrdenPresupuestos('cliente')}</th>
          ${verComercial ? `<th style="cursor:pointer;" onclick="cambiarOrdenPresupuestos('comercial')">Comercial${flechaOrdenPresupuestos('comercial')}</th>` : ''}
          <th style="cursor:pointer;" onclick="cambiarOrdenPresupuestos('fecha_emision')">Creado${flechaOrdenPresupuestos('fecha_emision')}</th>
          <th style="cursor:pointer;" onclick="cambiarOrdenPresupuestos('evento_inicio')">Fecha evento${flechaOrdenPresupuestos('evento_inicio')}</th>
          <th style="cursor:pointer; width:56px;" onclick="cambiarOrdenPresupuestos('dias_restantes')" title="Días para caducar (negativo = ya caducado)">Caduca${flechaOrdenPresupuestos('dias_restantes')}</th>
          <th style="cursor:pointer;" onclick="cambiarOrdenPresupuestos('estado')">Estado${flechaOrdenPresupuestos('estado')}</th>
          <th style="text-align:right; cursor:pointer;" onclick="cambiarOrdenPresupuestos('importe_sin_iva')">Importe${flechaOrdenPresupuestos('importe_sin_iva')}</th>
        </tr>
      </thead>
      <tbody id="tabla-presupuestos-body">${presupuestosListado.map(p => filaPresupuesto(p, verComercial)).join('')}</tbody>
    </table>
  `;
  body.innerHTML = html;
  ['buscador-presupuestos', 'filtro-estado-presupuestos', 'filtro-comercial-presupuestos', 'filtro-fecha-desde-presupuestos', 'filtro-fecha-hasta-presupuestos'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', () => aplicarFiltrosPresupuestos(presupuestosListado));
  });
}
let grupoPresupuestos = null; // null | 'pendientes' | 'caducados'
function filtrarPresupuestosPorGrupo(grupo) {
  grupoPresupuestos = (grupoPresupuestos === grupo) ? null : grupo; // pulsar 2 veces quita el filtro
  aplicarFiltrosPresupuestos(window.presupuestosOriginales);
}
function aplicarFiltrosPresupuestos(presupuestos) {
  const texto = (document.getElementById('buscador-presupuestos')?.value || '').toLowerCase();
  const estado = document.getElementById('filtro-estado-presupuestos').value;
  const comercial = document.getElementById('filtro-comercial-presupuestos')?.value || '';
  const desde = document.getElementById('filtro-fecha-desde-presupuestos')?.value || '';
  const hasta = document.getElementById('filtro-fecha-hasta-presupuestos')?.value || '';
  const verComercial = usuarioActual.rol !== 'Comercial';
  let filtrados = presupuestos.filter(p => {
    const coincideTexto = (p.cliente || '').toLowerCase().includes(texto) || String(p.numero_proyecto || '').includes(texto);
    const coincideEstado = !estado || p.estado === estado;
    const coincideComercial = !comercial || p.comercial === comercial;
    let coincideFecha = true;
    if ((desde || hasta) && p.evento_inicio) {
      const [fParte] = p.evento_inicio.split(' ');
      const [d, m, a] = fParte.split('/');
      const fechaEvento = `${a}-${m}-${d}`;
      if (desde && fechaEvento < desde) coincideFecha = false;
      if (hasta && fechaEvento > hasta) coincideFecha = false;
    } else if (desde || hasta) {
      coincideFecha = false;
    }
    return coincideTexto && coincideEstado && coincideComercial && coincideFecha;
  });
  if (grupoPresupuestos === 'pendientes') filtrados = filtrados.filter(p => ['verde', 'amarillo', 'rojo'].includes(p.semaforo));
  else if (grupoPresupuestos === 'caducados') filtrados = filtrados.filter(p => p.semaforo === 'negro');
  filtrados = ordenarLista(filtrados, ordenPresupuestos);
  document.getElementById('tabla-presupuestos-body').innerHTML = filtrados.map(p => filaPresupuesto(p, verComercial)).join('');
}
function filaPresupuesto(p, verComercial) {
  const badgeClase = p.semaforo === 'ganado' ? 'badge-success' : p.semaforo === 'perdido' ? 'badge-danger' : 'badge-warning';
  const yaDecidido = p.semaforo === 'ganado' || p.semaforo === 'perdido';
  const caduca = yaDecidido ? '—' : ((p.dias_restantes === null || p.dias_restantes === undefined) ? '—' : p.dias_restantes);
  return `
    <tr>
      <td style="text-align:center; width:28px;">${p.proyecto_id ? `<button class="btn-material" onclick="abrirModalMaterialProyecto('${p.proyecto_id}', '${String(p.numero_proyecto || '').replace(/'/g, "\\'")}')" title="Ver material y servicios">&#128230;</button>` : ''}</td>
      <td class="celda-copiable" onclick="copiarAlPortapapeles('${p.numero_proyecto || ''}', event)" title="Clic para copiar">${p.numero_proyecto || ''}</td>
      <td>${p.cliente || ''}</td>
      ${verComercial ? `<td>${p.comercial || ''}</td>` : ''}
      <td>${(p.fecha_emision || '').split(' ')[0]}</td>
      <td>${(p.evento_inicio || '').split(' ')[0]}</td>
      <td style="width:56px;">${badgeSemaforo(p.semaforo)} ${caduca}</td>
      <td><span class="badge ${badgeClase}">${p.estado || ''}</span></td>
      <td style="text-align:right;">${formatearEuros(p.importe_sin_iva)}</td>
    </tr>
  `;
}

// ================================================================
// COMERCIAL · LEADS
// ================================================================
async function cargarLeads() {
  document.getElementById('content-title').textContent = 'Comercial · Leads';
  const body = document.getElementById('content-body');
  body.innerHTML = '<p class="loading-text">Cargando leads...</p>';
  try {
    const resp = await fetch('/api/leads');
    const data = await resp.json();
    if (data.error) { body.innerHTML = '<p class="loading-text">Error: ' + data.error + '</p>'; return; }
    document.getElementById('last-update-text').textContent = 'Datos de marketing (hoja externa)';
    document.getElementById('last-update-indicator').classList.remove('stale');
    pintarLeads(data.data);
  } catch (err) {
    body.innerHTML = '<p class="loading-text">Error de conexión</p>';
  }
}
let ordenLeads = { campo: 'fecha_lead', asc: false };
function cambiarOrdenLeads(campo) {
  if (ordenLeads.campo === campo) ordenLeads.asc = !ordenLeads.asc;
  else { ordenLeads.campo = campo; ordenLeads.asc = true; }
  aplicarFiltrosLeads(window.leadsOriginales);
}
function flechaOrdenLeads(campo) {
  if (ordenLeads.campo !== campo) return '';
  return ordenLeads.asc ? ' ▲' : ' ▼';
}
function pintarLeads(leads) {
  const body = document.getElementById('content-body');
  window.leadsOriginales = leads;
  if (!leads || leads.length === 0) {
    body.innerHTML = '<p class="loading-text">No hay leads para mostrar.</p>';
    return;
  }
  const canalesDisponibles = [...new Set(leads.map(l => l.canal).filter(Boolean))].sort();
  const estadosDisponiblesLeads = [...new Set(leads.map(l => l.estado).filter(Boolean))].sort();
  const conPresupuesto = leads.filter(l => l.no_presupuesto).length;
  const sinPresupuesto = leads.filter(l => !l.no_presupuesto)
    .sort((a, b) => (parsearFechaDDMMYYYY(b.fecha_lead) || 0) - (parsearFechaDDMMYYYY(a.fecha_lead) || 0));
  const conPedido = leads.filter(l => String(l.no_pedido).toLowerCase() === 'si' || String(l.no_pedido).toLowerCase() === 'sí').length;
  let html = `
    <div style="display:flex; gap:1rem; margin-bottom:1.25rem; flex-wrap:wrap;">
      <div style="flex:1; min-width:160px; background:#fff; border:1px solid var(--border); border-radius:4px; padding:1rem;">
        <div style="font-size:12px; color:var(--text-muted);">Leads recibidos</div>
        <div style="font-size:22px; font-weight:600;">${leads.length}</div>
      </div>
      <div style="flex:1; min-width:160px; background:#fff; border:1px solid var(--border); border-radius:4px; padding:1rem; cursor:pointer;" onclick="filtrarLeadsPorGrupo('sin_presupuesto')">
        <div style="font-size:12px; color:var(--text-muted);">Sin presupuesto todavía</div>
        <div style="font-size:22px; font-weight:600;">${sinPresupuesto.length}</div>
      </div>
      <div style="flex:1; min-width:160px; background:#fff; border:1px solid var(--border); border-radius:4px; padding:1rem;">
        <div style="font-size:12px; color:var(--text-muted);">Con presupuesto</div>
        <div style="font-size:22px; font-weight:600;">${conPresupuesto} <span style="font-size:13px; color:var(--text-muted); font-weight:400;">(${Math.round(conPresupuesto / leads.length * 100)}%)</span></div>
      </div>
      <div style="flex:1; min-width:160px; background:#fff; border:1px solid var(--border); border-radius:4px; padding:1rem;">
        <div style="font-size:12px; color:var(--text-muted);">Convertidos en pedido</div>
        <div style="font-size:22px; font-weight:600;">${conPedido} <span style="font-size:13px; color:var(--text-muted); font-weight:400;">(${Math.round(conPedido / leads.length * 100)}%)</span></div>
      </div>
    </div>
    ${sinPresupuesto.length > 0 ? `
    <div style="background:#fff; border:1px solid var(--border); border-radius:4px; padding:1rem; margin-bottom:1.25rem;">
      <div style="font-weight:600; margin-bottom:8px; cursor:pointer;" onclick="filtrarLeadsPorGrupo('sin_presupuesto')">📋 Sin presupuesto todavía (${sinPresupuesto.length}) →</div>
      <div style="display:flex; flex-direction:column; gap:6px;">
        ${sinPresupuesto.slice(0, 8).map(l => `
          <div style="display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid var(--border);">
            <span>${l.nombre || '(sin nombre)'} — ${l.canal || ''}</span>
            <span style="color:var(--text-muted);">${l.fecha_lead || ''}</span>
          </div>
        `).join('')}
      </div>
      ${sinPresupuesto.length > 8 ? `<div style="font-size:12px; color:var(--text-muted); margin-top:8px;">+ ${sinPresupuesto.length - 8} más</div>` : ''}
    </div>` : ''}
    <div style="display:flex; flex-wrap:wrap; gap:0.75rem; margin-bottom:1rem; align-items:center;">
      <div class="search-box" style="flex:1; min-width:200px;">
        <input type="text" id="buscador-leads" placeholder="Buscar nombre, email o teléfono...">
      </div>
      <select id="filtro-canal-leads" style="padding:8px; border:1px solid var(--border); border-radius:4px;">
        <option value="">Canal: Todos</option>
        ${canalesDisponibles.map(c => `<option value="${c}">${c}</option>`).join('')}
      </select>
      <select id="filtro-estado-leads" style="padding:8px; border:1px solid var(--border); border-radius:4px;">
        <option value="">Estado: Todos</option>
        ${estadosDisponiblesLeads.map(e => `<option value="${e}">${e}</option>`).join('')}
      </select>
    </div>
    <table>
      <thead>
        <tr>
          <th style="cursor:pointer;" onclick="cambiarOrdenLeads('fecha_lead')">Fecha${flechaOrdenLeads('fecha_lead')}</th>
          <th style="cursor:pointer;" onclick="cambiarOrdenLeads('canal')">Canal${flechaOrdenLeads('canal')}</th>
          <th style="cursor:pointer;" onclick="cambiarOrdenLeads('nombre')">Nombre${flechaOrdenLeads('nombre')}</th>
          <th>Contacto</th>
          <th style="cursor:pointer;" onclick="cambiarOrdenLeads('estado')">Estado${flechaOrdenLeads('estado')}</th>
          <th>Nº presupuesto</th>
          <th>Pedido</th>
        </tr>
      </thead>
      <tbody id="tabla-leads-body">${leads.map(filaLead).join('')}</tbody>
    </table>
  `;
  body.innerHTML = html;
  grupoLeads = null;
  ['buscador-leads', 'filtro-canal-leads', 'filtro-estado-leads'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => aplicarFiltrosLeads(leads));
  });
}
let grupoLeads = null; // null | 'sin_presupuesto'
function filtrarLeadsPorGrupo(grupo) {
  grupoLeads = (grupoLeads === grupo) ? null : grupo;
  aplicarFiltrosLeads(window.leadsOriginales);
}
function aplicarFiltrosLeads(leads) {
  const texto = (document.getElementById('buscador-leads').value || '').toLowerCase();
  const canal = document.getElementById('filtro-canal-leads').value;
  const estado = document.getElementById('filtro-estado-leads').value;
  let filtrados = leads.filter(l => {
    const coincideTexto = (l.nombre || '').toLowerCase().includes(texto) || (l.email || '').toLowerCase().includes(texto) || String(l.telefono || '').includes(texto);
    const coincideCanal = !canal || l.canal === canal;
    const coincideEstado = !estado || l.estado === estado;
    return coincideTexto && coincideCanal && coincideEstado;
  });
  if (grupoLeads === 'sin_presupuesto') filtrados = filtrados.filter(l => !l.no_presupuesto);
  filtrados = ordenarLista(filtrados, ordenLeads);
  document.getElementById('tabla-leads-body').innerHTML = filtrados.map(filaLead).join('');
}
function filaLead(l) {
  const esPedido = String(l.no_pedido).toLowerCase() === 'si' || String(l.no_pedido).toLowerCase() === 'sí';
  const pedidoBadge = esPedido ? '<span class="badge badge-success">Sí</span>' : (l.no_presupuesto ? '<span class="badge badge-warning">No</span>' : '<span class="badge badge-neutral">—</span>');
  return `
    <tr>
      <td>${l.fecha_lead || ''}</td>
      <td>${l.canal || ''}</td>
      <td>${l.nombre || ''}</td>
      <td style="font-size:12px;">${l.telefono || ''}${l.email ? '<br>' + l.email : ''}</td>
      <td>${l.estado || ''}</td>
      <td>${l.no_presupuesto || ''}</td>
      <td>${pedidoBadge}</td>
    </tr>
  `;
}

comprobarSesion();
</script>
