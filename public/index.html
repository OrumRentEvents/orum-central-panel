<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORUM Central</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #1a1a1a;
    --gray-100: #f7f6f3;
    --gray-200: #eeecea;
    --gray-300: #dddbd7;
    --gray-400: #999794;
    --gray-500: #666462;
    --accent: #b8956a;
    --accent-dark: #8a6d1e;
    --accent-light: #e8d5b0;
    --green: #2e7d52;
    --red: #c0392b;
    --orange: #c0620a;
    --bg-main: #f2f0ec;
    --bg-sidebar: #ffffff;
    --border: #e0ddd9;
    --text-primary: #1a1a1a;
    --text-secondary: #555351;
    --text-muted: #888582;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #ffffff;
    color: var(--text-primary);
  }
  #login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: var(--bg-main);
    position: relative;
  }
  #login-screen::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 30% 50%, rgba(184,149,106,0.10) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 50%, rgba(184,149,106,0.06) 0%, transparent 60%);
  }
  .login-box {
    position: relative;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3rem 2.5rem;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .login-box .crown { display:block; margin:0 auto 10px; height:70px; width:auto; }
  .login-box h1 {
    font-family: 'Playfair Display', serif;
    font-size: 34px; font-weight: 900; letter-spacing: 7px;
    margin-bottom: 6px; text-align: center; text-transform: uppercase;
  }
  .login-box p.subtitle {
    font-size: 11px; color: var(--accent-dark); margin-bottom: 2.25rem; text-align: center;
    text-transform: uppercase; letter-spacing: 3px; font-weight: 600;
  }
  .login-box label {
    display: block; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--gray-500); margin-bottom: 6px; margin-top: 18px; font-weight: 500;
  }
  .login-box input {
    width: 100%; padding: 11px 14px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 2px; background: var(--gray-100); color: var(--text-primary);
    font-family: 'DM Sans', sans-serif;
  }
  .login-box input:focus { outline: none; border-color: var(--accent); background: #fff; }
  .login-box button {
    width: 100%; margin-top: 2rem; padding: 13px; font-size: 12px; font-weight: 600;
    letter-spacing: 2px; text-transform: uppercase;
    background: var(--black); color: #fff; border: none; border-radius: 2px; cursor: pointer;
    transition: background 0.2s;
  }
  .login-box button:hover { background: var(--accent); color: var(--black); }
  .login-error { color: var(--red); font-size: 13px; margin-top: 14px; display: none; text-align: center; }
  /* app-screen ocupa exactamente la ventana y no se desplaza — sidebar y
     main-content tienen cada uno su propio scroll interno, independiente
     uno del otro (antes todo era un único documento y al hacer scroll
     abajo en el contenido el menú se iba con él). */
  #app-screen { display: none; height: 100vh; overflow: hidden; }
  .app-layout { display: flex; height: 100%; }
  .sidebar { width: 230px; height: 100%; overflow-y: auto; background: var(--bg-sidebar); border-right: 1px solid var(--border); padding: 1.5rem 0; flex-shrink: 0; }
  .sidebar-header { padding: 0 1.5rem 1.25rem; border-bottom: 1px solid var(--border); margin-bottom: 0.5rem; }
  .sidebar-header .org-name {
    font-family: 'Playfair Display', serif; font-weight: 900; font-size: 20px; letter-spacing: 3px; text-transform: uppercase;
  }
  .sidebar-header .org-name .crown-mini { height: 22px; width: auto; vertical-align: middle; margin-right: 6px; }
  .sidebar-header .org-name { display: flex; align-items: center; }
  .sidebar-user-block { display: flex; align-items: center; gap: 10px; margin-top: 0.9rem; }
  .user-avatar {
    width: 34px; height: 34px; border-radius: 50%; background: var(--black); color: #fff; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif;
    font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
  }
  .sidebar-header .user-name { font-size: 12.5px; color: var(--text-primary); font-weight: 600; }
  .role-badge {
    display: inline-block; font-size: 9.5px; padding: 2px 8px; margin-top: 3px; border-radius: 10px;
    background: var(--accent-light); color: var(--accent-dark); text-transform: uppercase;
    letter-spacing: 0.6px; font-weight: 700;
  }
  .nav-group-title {
    padding: 1.1rem 1.5rem 0.4rem; font-size: 10px; color: var(--gray-400);
    text-transform: uppercase; letter-spacing: 2px; font-weight: 600;
  }
  .nav-group-title:not(:first-child) { border-top: 1px solid var(--border); margin-top: 0.6rem; padding-top: 1.1rem; }
  .nav-icon { width: 16px; height: 16px; flex-shrink: 0; display: inline-flex; }
  .nav-icon svg { width: 100%; height: 100%; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 1.5rem; font-size: 13px;
    color: var(--text-secondary); cursor: pointer; border-left: 2px solid transparent;
    transition: all 0.15s;
  }
  .nav-item:hover { background: var(--gray-100); color: var(--text-primary); }
  .nav-item.active { background: var(--accent-light); border-left-color: var(--accent); color: var(--accent-dark); font-weight: 600; }
  .logout-button {
    margin: 1.75rem 1.5rem 0; padding: 9px 12px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    border: 1px solid var(--border); border-radius: 2px; background: #fff; color: var(--gray-500); cursor: pointer;
    width: calc(100% - 3rem); transition: all 0.2s;
  }
  .logout-button:hover { border-color: var(--red); color: var(--red); }
  .main-content { flex: 1; height: 100%; overflow-y: auto; padding: 2rem 2.25rem; min-width: 0; background: var(--bg-main); }
  .main-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
  .main-header h1 { font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 700; color: var(--text-primary); letter-spacing: 0.5px; }
  .last-update { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; letter-spacing: 0.5px; }
  .last-update .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .last-update.stale .dot { background: var(--orange); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
  th {
    text-align: left; padding: 10px 12px; color: var(--gray-500); font-weight: 600; font-size: 10px;
    text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); background: var(--gray-100);
    position: sticky; top: 0; z-index: 3; box-shadow: 0 1px 0 var(--border);
  }
  th[onclick]:hover { color: var(--accent-dark); background: var(--gray-200); }
  td { padding: 11px 12px; border-bottom: 1px solid var(--gray-200); }
  .badge { font-size: 11px; padding: 3px 10px; border-radius: 2px; display: inline-block; font-weight: 600; letter-spacing: 0.3px; }
  .badge-success { background: #EAF3DE; color: #27500A; }
  .badge-warning { background: #FAEEDA; color: #854F0B; }
  .badge-danger { background: #FCEBEB; color: #A32D2D; }
  .badge-neutral { background: var(--gray-200); color: var(--gray-500); }
  .badge-dark { background: #2a2a2a; color: #ffffff; }
  .celda-copiable { cursor: pointer; }
  .celda-copiable:hover { text-decoration: underline; }
  .search-box { position: relative; }
  .search-box input {
    width: 220px; padding: 7px 12px 7px 32px; font-size: 13px;
    border: 1px solid var(--border); border-radius: 2px; background: #fff; color: var(--text-primary);
  }
  .search-box::before {
    content: "🔍"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; opacity: 0.5;
  }
  /* Los formularios de Servicios Isabella usan grid (a diferencia del resto
     del panel, que usa filas flex) - sin esto los inputs/selects se quedan a
     su ancho natural (pequeño) dentro de columnas de grid mucho más anchas,
     y el formulario sale descuadrado/apretado. */
  #isabella-panel input, #isabella-panel select { width: 100%; }
  .loading-text { color: var(--gray-400); font-size: 13px; padding: 2rem 0; }
  select { padding: 7px 10px; border: 1px solid var(--border); border-radius: 2px; font-size: 13px; background: #fff; color: var(--text-primary); }
  .pnc-filtro-btn { font-size:13px; padding:6px 14px; border-radius:2px; background:#fff; color:var(--text-secondary); border:1px solid var(--border); cursor:pointer; }
  .btn-material { background: var(--accent-light); color: var(--accent-dark); border: none; border-radius: 4px; padding: 1px 5px; cursor: pointer; font-size: 10px; margin-left: 4px; vertical-align: middle; }
  /* Extracto de Cliente (Financiero) - "Exportar PDF" usa window.print() en
     vez de una librería: oculta el chrome de la app (sidebar/cabecera/
     botones) y muestra solo la cabecera de documento (.solo-impresion),
     así "Guardar como PDF" del propio diálogo de impresión del navegador
     ya produce un documento limpio para mandar al cliente. */
  .solo-impresion { display: none; }
  @media print {
    .sidebar, .main-header, .no-imprimir { display: none !important; }
    .solo-impresion { display: block !important; }
    .main-content { padding: 0; }
    body { background: #fff; }
    /* Márgenes propios de la página impresa - sin esto el navegador puede
       recortar el contenido casi hasta el borde del papel (el logo/cabecera
       de la derecha quedaban pegados al canto y a veces cortados). @page
       depende de que el diálogo de impresión tenga "Márgenes: Predet." (si
       el usuario dejó "Ninguno" de una impresión anterior, @page se ignora)
       - el padding de #extracto-imprimible es un margen de seguridad propio
       que no depende de esa opción del diálogo.
       th{position:sticky} también se desactiva al imprimir: combinado con
       la paginación puede solapar la cabecera con la primera fila de cada
       página impresa - el navegador ya repite <thead> solo en cada página. */
    @page { margin: 1.6cm; }
    #extracto-imprimible { padding: 0.4cm 0.6cm; }
    th { position: static !important; box-shadow: none !important; }
  }
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-box">
    <img class="crown" src="logo-orum-crown.png" alt="ORUM">
    <h1>Central</h1>
    <p class="subtitle">Rent &amp; Events</p>
    <form id="login-form">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <p class="login-error" id="login-error"></p>
      <button type="submit">Entrar</button>
    </form>
  </div>
</div>
<div id="app-screen">
  <div class="app-layout">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="org-name"><img class="crown-mini" src="logo-orum-crown.png" alt="ORUM"> Central</div>
        <div class="sidebar-user-block">
          <div class="user-avatar" id="sidebar-user-avatar"></div>
          <div>
            <div class="user-name" id="sidebar-user-name"></div>
            <div class="role-badge" id="sidebar-role-badge"></div>
          </div>
        </div>
      </div>
      <div id="nav-container"></div>
      <button class="logout-button" id="logout-btn">Cerrar sesión</button>
    </div>
    <div class="main-content">
      <div class="main-header">
        <h1 id="content-title">Proyectos</h1>
        <div class="last-update" id="last-update-indicator">
          <span class="dot"></span>
          <span id="last-update-text">Cargando...</span>
        </div>
      </div>
      <div id="content-body">
        <p class="loading-text">Cargando datos...</p>
      </div>
    </div>
  </div>
</div>

<!-- Modal material + servicios adicionales de un proyecto -->
<div id="modal-material" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; align-items:center; justify-content:center;">
  <div style="background:#fff; border-radius:6px; width:100%; max-width:480px; max-height:80vh; display:flex; flex-direction:column; margin:1rem;">
    <div style="display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--border);">
      <h2 style="font-size:15px; font-weight:600; margin:0;" id="modal-material-titulo">Material</h2>
      <span style="cursor:pointer; font-size:18px; color:var(--text-muted);" onclick="cerrarModalMaterialProyecto()">&times;</span>
    </div>
    <div style="padding:14px 16px; overflow-y:auto;" id="modal-material-body"></div>
  </div>
</div>

<!-- Modal historial de cambios de una factura de proveedor -->
<div id="modal-historial-factura" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; align-items:center; justify-content:center;">
  <div style="background:#fff; border-radius:6px; width:100%; max-width:480px; max-height:80vh; display:flex; flex-direction:column; margin:1rem;">
    <div style="display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--border);">
      <h2 style="font-size:15px; font-weight:600; margin:0;">🕓 Historial de cambios</h2>
      <span style="cursor:pointer; font-size:18px; color:var(--text-muted);" onclick="document.getElementById('modal-historial-factura').style.display='none'">&times;</span>
    </div>
    <div style="padding:14px 16px; overflow-y:auto;" id="modal-historial-factura-body"></div>
  </div>
</div>

<!-- Modal histórico de importaciones (facturas por día de sincronización) -->
<div id="modal-historico-importaciones" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; align-items:center; justify-content:center;">
  <div style="background:#fff; border-radius:6px; width:100%; max-width:640px; max-height:80vh; display:flex; flex-direction:column; margin:1rem;">
    <div style="display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--border);">
      <h2 style="font-size:15px; font-weight:600; margin:0;">📅 Histórico de importaciones</h2>
      <span style="cursor:pointer; font-size:18px; color:var(--text-muted);" onclick="document.getElementById('modal-historico-importaciones').style.display='none'">&times;</span>
    </div>
    <div style="padding:14px 16px; overflow-y:auto;" id="modal-historico-importaciones-body"></div>
  </div>
</div>

<!-- Modal errores de sincronización de facturas de proveedores -->
<div id="modal-errores-facturas" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; align-items:center; justify-content:center;">
  <div style="background:#fff; border-radius:6px; width:100%; max-width:640px; max-height:80vh; display:flex; flex-direction:column; margin:1rem;">
    <div style="display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--border);">
      <h2 style="font-size:15px; font-weight:600; margin:0;">⚠️ Facturas con error al sincronizar</h2>
      <span style="cursor:pointer; font-size:18px; color:var(--text-muted);" onclick="document.getElementById('modal-errores-facturas').style.display='none'">&times;</span>
    </div>
    <div style="padding:14px 16px; overflow-y:auto;" id="modal-errores-facturas-body"></div>
  </div>
</div>

<script>
let usuarioActual = null;
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const usuario = document.getElementById('usuario').value.trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('login-error');
  errorEl.style.display = 'none';
  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario, password })
    });
    const data = await resp.json();
    if (!resp.ok) {
      errorEl.textContent = data.error || 'Error al iniciar sesión';
      errorEl.style.display = 'block';
      return;
    }
    usuarioActual = data.usuario;
    mostrarApp();
  } catch (err) {
    errorEl.textContent = 'Error de conexión con el servidor';
    errorEl.style.display = 'block';
  }
});
document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  location.reload();
});
async function comprobarSesion() {
  try {
    const resp = await fetch('/api/sesion');
    if (resp.ok) {
      const data = await resp.json();
      usuarioActual = data.usuario;
      mostrarApp();
    }
  } catch (err) {}
}
const ETIQUETA_ROL = { Direccion: 'Dirección', Contabilidad: 'Contabilidad', Logistica: 'Logística', Comercial: 'Comercial' };
function inicialesNombre(nombre) {
  if (!nombre) return '?';
  const partes = nombre.trim().split(/\s+/);
  return ((partes[0] || '')[0] || '') + ((partes[1] || '')[0] || '');
}
function mostrarApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  document.getElementById('sidebar-user-name').textContent = usuarioActual.nombre;
  document.getElementById('sidebar-user-avatar').textContent = inicialesNombre(usuarioActual.nombre).toUpperCase();
  document.getElementById('sidebar-role-badge').textContent = ETIQUETA_ROL[usuarioActual.rol] || usuarioActual.rol;
  construirMenu();
  if (usuarioActual.rol === 'Comercial') cargarResumenComercial();
  else if (usuarioActual.rol === 'Logistica') cargarResumenLogistica();
  else cargarResumenGeneral();
}
function renderProximamente(nombre) {
  document.getElementById('content-title').textContent = nombre;
  document.getElementById('last-update-text').textContent = 'Sin datos';
  document.getElementById('last-update-indicator').classList.add('stale');
  document.getElementById('content-body').innerHTML = `
    <div style="background:#fff; border:1px solid var(--border); border-radius:4px; padding:3rem; text-align:center;">
      <div style="font-size:32px; margin-bottom:12px;">🚧</div>
      <p style="font-size:15px; color:#1a1a18; margin-bottom:6px; font-weight:500;">Todavía no conectado</p>
      <p style="font-size:13px; color:#9a988f;">Esta sección se irá activando en próximas fases, en cuanto tenga su fuente de datos.</p>
    </div>
  `;
}

// ================================================================
// RESUMEN GENERAL — pantalla de bienvenida (Dirección/admin)
// Junta lo más importante de cada departamento sin recalcular nada
// nuevo: reutiliza los mismos endpoints y funciones de gráfica que ya
// usan Comercial·Resumen y Financiero·Resumen.
// ================================================================
function saludoHorario() {
  const h = new Date().getHours();
  if (h < 12) return 'Buenos días';
  if (h < 20) return 'Buenas tardes';
  return 'Buenas noches';
}
function kpiCardDash(icono, color, etiqueta, valor) {
  return `
    <div style="flex:1; min-width:190px; background:#fff; border:1px solid var(--border); border-radius:6px; padding:1rem 1.1rem; display:flex; align-items:flex-start; gap:12px;">
      <div style="width:34px; height:34px; border-radius:8px; background:${color}1a; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        ${iconoInline(icono, 18, color)}
      </div>
      <div style="min-width:0;">
        <div style="font-size:20px; font-weight:700; color:var(--text-primary); line-height:1.2;">${valor}</div>
        <div style="font-size:11.5px; color:var(--text-muted); margin-top:2px;">${etiqueta}</div>
      </div>
    </div>
  `;
}
async function cargarResumenGeneral() {
  document.getElementById('content-title').textContent = 'Resumen';
  const body = document.getElementById('content-body');
  body.innerHTML = '<p class="loading-text">Cargando resumen...</p>';
  try {
    const [rProy, rPresu, rLeads, rFin, rSync] = await Promise.all([
      fetch('/api/proyectos').then(r => r.json()),
      fetch('/api/presupuestos').then(r => r.json()),
      fetch('/api/leads').then(r => r.json()),
      fetch('/api/financiero').then(r => r.json()).catch(() => null),
      fetch('/api/sync-status').then(r => r.json()).catch(() => null)
    ]);
    if (rProy.error) { body.innerHTML = '<p class="loading-text">Error: ' + rProy.error + '</p>'; return; }
    actualizarIndicadorFecha(rProy.ultima_actualizacion);
    pintarResumenGeneral(rProy.data || [], rPresu.data || [], rLeads.data || [], rFin, rSync);
  } catch (err) {
    console.error('Error en Resumen general:', err);
    body.innerHTML = '<p class="loading-text">Error de conexión: ' + (err && err.message ? err.message : err) + '</p>';
  }
}
function pintarResumenGeneral(proyectos, presupuestos, leads, fin, sync) {
  const body = document.getElementById('content-body');
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const en7 = new Date(hoy); en7.setDate(en7.getDate() + 7);
  const en30 = new Date(hoy); en30.setDate(en30.getDate() + 30);
  const inicioMes = new Date(hoy.getFullYear(), hoy.getMonth(), 1);

  const parseFechaLocal = raw => {
    if (!raw) return null;
    const fParte = raw.split(' ')[0];
    const partes = fParte.split('/');
    if (partes.length !== 3) return null;
    const d = new Date(partes[2], partes[1] - 1, partes[0]);
    return isNaN(d) ? null : d;
  };

  const activos = proyectos.filter(p => p.estado !== 'Canceled');
  const conFecha = activos.map(p => ({ ...p, _fecha: parseFechaLocal(p.evento_inicio) })).filter(p => p._fecha);

// RUTAS & CONDUCTORES · ESTADÍSTICAS
// (no confundir con el panel operativo del día a día, /rutas.html —
// esto es el informe de entregas/recogidas hechas por conductor y por
// vehículo, sacado de rutas_paradas en Supabase.)

function lunesDeLaSemanaJS_(d) {
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  const dia = x.getDay() || 7;
  x.setDate(x.getDate() - dia + 1);
  return x;
}
function isoWeekNumberJS_(fecha) {
  const d = new Date(Date.UTC(fecha.getFullYear(), fecha.getMonth(), fecha.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}
function rangoSemanaISO_(anio, semana) {
  const jan4 = new Date(anio, 0, 4);
  const diaJan4 = jan4.getDay() || 7;
  const lunesSemana1 = new Date(jan4);
  lunesSemana1.setDate(jan4.getDate() - diaJan4 + 1);
  const lunes = new Date(lunesSemana1);
  lunes.setDate(lunesSemana1.getDate() + (semana - 1) * 7);
  const domingo = new Date(lunes);
  domingo.setDate(lunes.getDate() + 6);
  return { desde: lunes.toISOString().slice(0, 10), hasta: domingo.toISOString().slice(0, 10) };
}
// Un mes = todas las semanas ISO cuya MAYORÍA de días caen en ese mes -
// misma regla que el Informe Mensual, así "mes" significa lo mismo en
// todo el panel (una semana a caballo entre dos meses no se parte).
function rangoMesPorSemanasISO_(anio, mes) {
  const primerDia = new Date(anio, mes - 1, 1);
  const ultimoDia = new Date(anio, mes, 0);
  let cursor = lunesDeLaSemanaJS_(primerDia);
  cursor.setDate(cursor.getDate() - 7);
  const limite = new Date(ultimoDia); limite.setDate(limite.getDate() + 7);
  let primerLunes = null, ultimoDomingo = null;
  while (cursor <= limite) {
    const lunes = new Date(cursor);
    const domingo = new Date(cursor); domingo.setDate(domingo.getDate() + 6);
    const conteo = {};
    const d = new Date(lunes);
    for (let i = 0; i < 7; i++) { const key = d.getFullYear() + '-' + d.getMonth(); conteo[key] = (conteo[key] || 0) + 1; d.setDate(d.getDate() + 1); }
    let mejorKey = null, mejorCount = -1;
    Object.keys(conteo).forEach(k => { if (conteo[k] > mejorCount) { mejorCount = conteo[k]; mejorKey = k; } });
    const [anioM, mesIdx] = mejorKey.split('-').map(Number);
    if (anioM === anio && mesIdx === mes - 1) { if (!primerLunes) primerLunes = lunes; ultimoDomingo = domingo; }
    cursor = new Date(cursor); cursor.setDate(cursor.getDate() + 7);
  }
  return { desde: primerLunes.toISOString().slice(0, 10), hasta: ultimoDomingo.toISOString().slice(0, 10) };
}
async function cargarEstadisticasRutas(desde, hasta, periodo, filtroNave) {
  document.getElementById('content-title').textContent = 'Rutas & Conductores · Estadísticas';
  const body = document.getElementById('content-body');
  body.innerHTML = '<p class="loading-text">Cargando estadísticas...</p>';
  filtroNave = filtroNave || window.rutasFiltroNaveActual || 'todos';
  window.rutasFiltroNaveActual = filtroNave;
  if (!desde || !hasta) {
    const hoy = new Date();
    periodo = periodo || 'mes';
    if (periodo === 'semana') {
      desde = lunesDeLaSemanaJS_(hoy).toISOString().slice(0, 10);
      hasta = hoy.toISOString().slice(0, 10);
    } else {
      desde = new Date(hoy.getFullYear(), hoy.getMonth(), 1).toISOString().slice(0, 10);
      hasta = hoy.toISOString().slice(0, 10);
    }
  } else {
    periodo = periodo || 'custom';
  }
  try {
    const [resp, respEvo] = await Promise.all([
      fetch('/api/rutas/estadisticas?desde=' + desde + '&hasta=' + hasta + '&nave=' + filtroNave),
      fetch('/api/rutas/evolucion-mensual')
    ]);
    const data = await resp.json();
    const evolucion = await respEvo.json();
    if (data.error) { body.innerHTML = '<p class="loading-text">Error: ' + data.error + '</p>'; return; }
    document.getElementById('last-update-text').textContent = 'Actualizado ' + new Date().toLocaleString('es-ES');
    document.getElementById('last-update-indicator').classList.remove('stale');
    pintarEstadisticasRutas(data, desde, hasta, periodo, evolucion.meses || [], filtroNave);
  } catch (err) {
    console.error('Error en estadísticas de Rutas:', err);
    body.innerHTML = '<p class="loading-text">Error de conexión: ' + (err && err.message ? err.message : err) + '</p>';
  }
}
function graficoBarrasRutas_(meses) {
  const alturaMax = 130;
  const maxVal = Math.max(1, ...meses.flatMap(m => [m.entregas, m.recogidas]));
  return `
    <div style="display:flex; align-items:flex-end; gap:10px; height:${alturaMax + 26}px; overflow-x:auto;">
      ${meses.map(m => `
        <div style="display:flex; flex-direction:column; align-items:center; gap:4px; min-width:44px;">
          <div style="display:flex; align-items:flex-end; gap:3px; height:${alturaMax}px;" title="${m.label}: ${m.entregas} entregas, ${m.recogidas} recogidas">
            <div style="width:14px; background:#4c8c1f; height:${Math.max(2, Math.round(m.entregas / maxVal * alturaMax))}px; border-radius:2px 2px 0 0;"></div>
            <div style="width:14px; background:#C77D0B; height:${Math.max(2, Math.round(m.recogidas / maxVal * alturaMax))}px; border-radius:2px 2px 0 0;"></div>
          </div>
          <div style="font-size:11px; color:var(--text-muted);">${m.label}</div>
        </div>
      `).join('')}
    </div>
    <div style="display:flex; gap:16px; margin-top:10px; font-size:12px; justify-content:center;">
      <span><span style="display:inline-block;width:9px;height:9px;background:#4c8c1f;border-radius:2px;margin-right:5px;"></span>Entregas</span>
      <span><span style="display:inline-block;width:9px;height:9px;background:#C77D0B;border-radius:2px;margin-right:5px;"></span>Recogidas</span>
    </div>
  `;
}
function aplicarSelectorNave_(desde, hasta, periodo) {

function poblarSemanasISO_(anio) {
  const sel = document.getElementById('est-rutas-semana-sel');
  if (!sel) return;
  const fmtCorto = iso => { const [a, m, d] = iso.split('-'); return d + '/' + m; };
  let opts = '';
  for (let s = 1; s <= 53; s++) {
    const r = rangoSemanaISO_(anio, s);
    opts += `<option value="${s}">Semana ${s} (${fmtCorto(r.desde)} - ${fmtCorto(r.hasta)})</option>`;
  }
  sel.innerHTML = opts;
}
function irAMesISO_() {

}

// ESTADÍSTICAS DE MATERIAL (Logística · Almacén)
// Más/menos alquilado, más rentable, roturas/no devueltos, por familia.
// Sacado de estadisticas_material(_pnc) y costes_adicionales en Supabase.
// ================================================================
async function cargarEstadisticasMaterial() {
  document.getElementById('content-title').textContent = 'Estadísticas de Material';
  const body = document.getElementById('content-body');
  body.innerHTML = '<p class="loading-text">Cargando estadísticas...</p>';
  try {
    const resp = await fetch('/api/material/estadisticas');
    const data = await resp.json();
    if (data.error) { body.innerHTML = '<p class="loading-text">Error: ' + data.error + '</p>'; return; }
    document.getElementById('last-update-text').textContent = 'Actualizado ' + new Date().toLocaleString('es-ES');
    document.getElementById('last-update-indicator').classList.remove('stale');
    window.materialEstadisticasData = data;
    pintarEstadisticasMaterial(data, '');
  } catch (err) {
    console.error('Error en estadísticas de Material:', err);
    body.innerHTML = '<p class="loading-text">Error de conexión: ' + (err && err.message ? err.message : err) + '</p>';
  }
}
function pintarEstadisticasMaterial(data, familiaFiltro) {
  const body = document.getElementById('content-body');
  const familias = [...new Set(data.articulos.map(a => a.familia).filter(Boolean))].sort();
  const articulosFiltrados = familiaFiltro ? data.articulos.filter(a => a.familia === familiaFiltro) : data.articulos;

  const totalIngresos = articulosFiltrados.reduce((s, a) => s + a.importe, 0);
  const masAlquilado = [...articulosFiltrados].sort((a, b) => b.veces - a.veces).slice(0, 15);
  const menosAlquilado = [...articulosFiltrados].filter(a => a.veces > 0).sort((a, b) => a.veces - b.veces).slice(0, 15);
  const masRentable = [...articulosFiltrados].sort((a, b) => b.importe - a.importe).slice(0, 15);

  const colsArticulo = '<th>Artículo</th><th>Familia</th><th style="text-align:right;">Veces</th><th style="text-align:right;">Unidades</th><th style="text-align:right;">Importe</th>';
  const filaArticulo = a => `
    <tr>
      <td>${a.articulo}</td>
      <td style="color:var(--text-muted); font-size:12px;">${a.familia || '—'}</td>
      <td style="text-align:right;">${a.veces}</td>
      <td style="text-align:right;">${a.unidades}</td>
      <td style="text-align:right; font-weight:600;">${formatearEuros(a.importe)}</td>
    </tr>`;
  const filaRotura = r => `
    <tr>
      <td>${r.articulo}</td>
      <td style="text-align:right;">${r.veces}</td>
      <td style="text-align:right;">${r.unidades}</td>
      <td style="text-align:right; font-weight:600; color:#A32D2D;">${formatearEuros(r.importe)}</td>
    </tr>`;
  const filaFamilia = f => `
    <tr>
      <td>${f.familia}</td>
      <td style="text-align:right;">${f.unidades}</td>
      <td style="text-align:right; font-weight:600;">${formatearEuros(f.importe)}</td>
    </tr>`;
  const tabla = (titulo, filasHtml, colsHtml, vacio) => `
    <div style="background:#fff; border:1px solid var(--border); border-radius:4px; padding:1rem; flex:1; min-width:340px;">
      <div style="font-weight:600; margin-bottom:8px;">${titulo}</div>
      ${!filasHtml ? `<p style="font-size:13px; color:var(--text-muted);">${vacio || 'Sin datos.'}</p>` : `
      <div style="overflow-x:auto;"><table>
        <thead><tr>${colsHtml}</tr></thead>
        <tbody>${filasHtml}</tbody>
      </table></div>`}
    </div>`;

  let html = `
    <div style="display:flex; flex-wrap:wrap; gap:0.75rem; margin-bottom:1.25rem; align-items:center;">
      <select id="filtro-familia-material" style="padding:8px; border:1px solid var(--border); border-radius:4px;" onchange="pintarEstadisticasMaterial(window.materialEstadisticasData, this.value)">
        <option value="">Familia: Todas</option>
        ${familias.map(f => `<option value="${f}" ${f === familiaFiltro ? 'selected' : ''}>${f}</option>`).join('')}
      </select>
    </div>
    <div style="display:flex; gap:1rem; margin-bottom:1.5rem; flex-wrap:wrap;">
      ${kpiCard('Artículos distintos', articulosFiltrados.length)}
      ${kpiCard('Ingresos por material', formatearEuros(totalIngresos))}
      ${kpiCard('Más alquilado', masAlquilado[0] ? masAlquilado[0].articulo : '—')}
      ${kpiCard('Más rentable', masRentable[0] ? masRentable[0].articulo : '—')}
    </div>
    <div style="display:flex; gap:1rem; margin-bottom:1rem; flex-wrap:wrap;">
      ${tabla('📈 Más alquilado', masAlquilado.map(filaArticulo).join(''), colsArticulo)}
      ${tabla('💰 Más rentable', masRentable.map(filaArticulo).join(''), colsArticulo)}
    </div>
    <div style="display:flex; gap:1rem; margin-bottom:1rem; flex-wrap:wrap;">
      ${tabla('📉 Menos alquilado', menosAlquilado.map(filaArticulo).join(''), colsArticulo)}
      ${tabla('⚠️ Roturas / no devueltos', data.roturas.slice(0, 15).map(filaRotura).join(''), '<th>Artículo</th><th style="text-align:right;">Veces</th><th style="text-align:right;">Unidades</th><th style="text-align:right;">Importe cobrado</th>', 'Sin roturas registradas.')}
    </div>
    <div style="background:#fff; border:1px solid var(--border); border-radius:4px; padding:1rem;">
      <div style="font-weight:600; margin-bottom:8px;">Ingresos por familia</div>
      <div style="overflow-x:auto;"><table>
        <thead><tr><th>Familia</th><th style="text-align:right;">Unidades</th><th style="text-align:right;">Importe</th></tr></thead>
        <tbody>${data.familias.map(filaFamilia).join('')}</tbody>
      </table></div>
    </div>
  `;
  body.innerHTML = html;
}

function construirMenu() {
  const nav = document.getElementById('nav-container');
  nav.innerHTML = '';

  // Buscador del menú lateral — filtra grupos/subitems por texto mientras se escribe.
  const searchWrap = document.createElement('div');
  searchWrap.style.cssText = 'padding: 0 1.5rem 0.75rem;';
  searchWrap.innerHTML = '<input type="text" id="menu-search-input" placeholder="🔍 Buscar en el menú..." style="width:100%; padding:7px 10px; font-size:12px; border:1px solid var(--border); border-radius:4px; background:#fff; color:var(--text-primary);">';
  nav.appendChild(searchWrap);

  // Rol Comercial: solo ve el apartado Comercial. Rol Logística: el apartado
  // Logística completo (incluye Servicios Isabella) + Incidencias,
  // Mantenimiento y Pantalla Muelle (pedido explícito del usuario — hoy son
  // placeholders "próximamente", pero deben ser visibles para Logística
  // desde ya). Nada más del menú en ninguno de los dos casos.
  const rolRestringido = usuarioActual.rol === 'Comercial' || usuarioActual.rol === 'Logistica';
  const menuVisible = usuarioActual.rol === 'Comercial' ? MENU.filter(item => item.id === 'comercial')
    : usuarioActual.rol === 'Logistica' ? MENU.filter(item => ['log', 'incidencias', 'mantenimiento', 'muelle'].includes(item.id))
    : MENU;

  if (rolRestringido) {
    // Con un único apartado visible, una sección temática no aporta nada:
    // se mantiene el título plano de siempre con el nombre del rol.
    const grupoTitle = document.createElement('div');
    grupoTitle.className = 'nav-group-title';
    grupoTitle.textContent = ETIQUETA_ROL[usuarioActual.rol] || usuarioActual.rol;
    nav.appendChild(grupoTitle);
    menuVisible.forEach(item => renderItemMenu(nav, item));
  } else {
    // Menú completo (Dirección/Contabilidad...): agrupado por sección temática
    // en vez de una lista plana, para que se lea de un vistazo.

function renderItemMenu(nav, item) {

  itemEl.id = 'menu-item-' + item.id;
  itemEl.dataset.label = item.label.toLowerCase();
  itemEl.style.fontWeight = '500';

  if (item.submenu && !item.especial) {
    itemEl.style.justifyContent = 'space-between';
    itemEl.innerHTML = '<span style="display:flex; align-items:center; gap:10px;">' + iconoMenuHtml(item.icon) + '<span>' + item.label + '</span></span><span class="nav-chevron" style="font-size:10px; color:var(--gray-400); transition:transform .15s;">▸</span>';
  } else {
    itemEl.innerHTML = iconoMenuHtml(item.icon) + '<span>' + item.label + '</span>';
  }
  if (item.especial) {
    itemEl.onclick = item.onClick;
  } else if (item.submenu) {
    // Contraído por defecto: pinchar en el grupo solo despliega/repliega sus
    // submenús (no navega), así el menú no queda tan extenso de entrada.
    itemEl.onclick = () => toggleGrupoMenu(item.id);
  } else {
    itemEl.onclick = () => { marcarMenuActivo('menu-item-' + item.id); item.onClick(); };
  }
  nav.appendChild(itemEl);
  if (item.submenu) {
    const submenuEl = document.createElement('div');
    submenuEl.id = 'submenu-' + item.id;
    submenuEl.style.cssText = 'padding-left:1.25rem; display:none;';

      subEl.style.cssText = 'display:flex; align-items:center; padding:7px 0 7px 1.5rem; font-size:13px; cursor:pointer; color:var(--text-secondary);';
      subEl.textContent = sub.label;
      subEl.onclick = () => { marcarMenuActivo('menu-item-' + sub.id); sub.onClick(); };
      submenuEl.appendChild(subEl);
    });

}
function toggleGrupoMenu(groupId) {
  const submenuEl = document.getElementById('submenu-' + groupId);
  if (!submenuEl) return;
  const abierto = submenuEl.style.display !== 'none';
  submenuEl.style.display = abierto ? 'none' : 'block';
  const chevron = document.querySelector('#menu-item-' + groupId + ' .nav-chevron');
  if (chevron) chevron.style.transform = abierto ? '' : 'rotate(90deg)';
}
function abrirGrupoMenu(groupId) {
  const submenuEl = document.getElementById('submenu-' + groupId);
  if (submenuEl) submenuEl.style.display = 'block';
  const chevron = document.querySelector('#menu-item-' + groupId + ' .nav-chevron');
  if (chevron) chevron.style.transform = 'rotate(90deg)';
}
// Filtra el menú lateral por texto: si un grupo coincide se muestran todos sus
// subitems; si solo coincide algún subitem, se despliega el grupo automáticamente
// para que se vea. Con el buscador vacío se restaura todo (grupos quedan como estaban).
function filtrarMenuLateral(query) {
  const q = (query || '').trim().toLowerCase();
  document.querySelectorAll('#nav-container .nav-item').forEach(itemEl => {
    const groupId = itemEl.id.replace('menu-item-', '');
    const submenuEl = document.getElementById('submenu-' + groupId);
    const groupMatch = !q || (itemEl.dataset.label || '').includes(q);
    if (!submenuEl) {
      itemEl.style.display = groupMatch ? '' : 'none';
      return;
    }
    let anySubMatch = false;
    submenuEl.querySelectorAll('.nav-subitem').forEach(subEl => {
      const subMatch = groupMatch || !q || (subEl.dataset.label || '').includes(q);
      subEl.style.display = subMatch ? '' : 'none';
      if (subMatch) anySubMatch = true;
    });
    itemEl.style.display = (groupMatch || anySubMatch) ? '' : 'none';
    if (q && (groupMatch || anySubMatch)) submenuEl.style.display = 'block';
  });
  // Con el menú agrupado por secciones (Principal/Gestión/...), una cabecera
  // de sección sin ningún item visible debajo se queda huérfana: se oculta
  // también en ese caso (recorre los hermanos hasta la siguiente cabecera).
  document.querySelectorAll('#nav-container .nav-group-title').forEach(tituloEl => {
    let hayVisible = false;
    let sib = tituloEl.nextElementSibling;
    while (sib && !sib.classList.contains('nav-group-title')) {
      if (sib.style.display !== 'none') { hayVisible = true; break; }
      sib = sib.nextElementSibling;
    }
    tituloEl.style.display = hayVisible ? '' : 'none';
  });
}
function marcarMenuActivo(idActivo) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-subitem').forEach(el => {
    el.style.background = 'transparent';
    el.style.borderLeft = '2px solid transparent';
    el.style.color = 'var(--text-secondary)';
    el.style.fontWeight = 'normal';
  });
  const el = document.getElementById(idActivo);
  if (!el) return;
  if (el.classList.contains('nav-subitem')) {
    el.style.background = '#f3ead9';
    el.style.borderLeft = '2px solid #b8956a';
    el.style.color = '#8a6d1e';
    el.style.fontWeight = '500';
  } else {
    el.classList.add('active');
  }
}

function barrasCierreSVG(meses) {
  const w = 900, h = 260, padL = 10, padR = 10, padT = 10, padB = 28;
  const areaW = w - padL - padR, areaH = h - padT - padB;
  const max = Math.max(1, ...meses.map(m => Math.max(m.ingresos, m.gastos)));
  const grupoW = areaW / meses.length;
  const barW = grupoW * 0.32;
  let barras = '';
  meses.forEach((m, i) => {
    const cx = padL + grupoW * i + grupoW / 2;
    const hIng = (m.ingresos / max) * areaH;
    const hGas = (m.gastos / max) * areaH;
    const activo = m.mes === mesSeleccionadoCierre;
    barras += `
      <rect x="${cx - barW - 2}" y="${padT + areaH - hIng}" width="${barW}" height="${hIng}" fill="#4C8C2B" opacity="${activo ? 1 : 0.75}" rx="2"/>
      <rect x="${cx + 2}" y="${padT + areaH - hGas}" width="${barW}" height="${hGas}" fill="#C24545" opacity="${activo ? 1 : 0.75}" rx="2"/>
      <rect x="${cx - grupoW / 2}" y="${padT}" width="${grupoW}" height="${areaH + padB}" fill="transparent" style="cursor:pointer;" onclick="seleccionarMesCierre(${m.mes})"/>
      <text x="${cx}" y="${h - 8}" text-anchor="middle" font-size="11" fill="${activo ? '#1a1a18' : '#9a988f'}" font-weight="${activo ? '600' : '400'}">${m.nombre.slice(0, 3)}</text>
    `;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto;">${barras}</svg>`;
}
function seleccionarMesCierre(mes) {
  mesSeleccionadoCierre = mes;
  pintarCierreMensual(cierreMensualDataActual);
}

// CONFIG. PAGOS ANUALES (10 sep 2026) — Financiero → Config. Pagos Anuales.
// Aquí se dan de alta las partidas que se pagan una vez al año (seguros de
// vehículos, impuestos, IBI, IAE...) con su importe anual; Cierre Mensual
// las reparte solo entre los 12 meses (importe_anual / 12). No hace falta
// tocarlas cada mes, solo cuando cambie la cuota (renovación de seguro,
// nuevo recibo de impuesto...).
// ================================================================
let gastosAnualesGlobal = { anio: new Date().getFullYear(), categorias: [], data: [] };
async function cargarGastosAnuales() {
  document.getElementById('content-title').textContent = 'Financiero · Config. Pagos Anuales';
  const body = document.getElementById('content-body');
  body.innerHTML = '<p class="loading-text">Cargando...</p>';
  try {
    const resp = await fetch('/api/gastos-anuales?anio=' + gastosAnualesGlobal.anio);
    const data = await resp.json();
    if (data.error) { body.innerHTML = '<p class="loading-text">Error: ' + data.error + '</p>'; return; }
    gastosAnualesGlobal.categorias = data.categorias || [];
    gastosAnualesGlobal.data = data.data || [];
    pintarGastosAnuales();
  } catch (err) {
    body.innerHTML = '<p class="loading-text">Error de conexión</p>';
  }
}
function cambiarAnioGastosAnuales(anio) {
  gastosAnualesGlobal.anio = parseInt(anio);
  cargarGastosAnuales();
}

      <td><input type="text" value="${(g.concepto || '').replace(/"/g, '&quot;')}" onblur="actualizarGastoAnualUI(${id}, 'concepto', this.value)" style="width:100%; border:1px solid transparent; padding:4px 6px; border-radius:4px; font-size:13px;" onfocus="this.style.border='1px solid #e2e2de'"></td>
      <td><select onchange="actualizarGastoAnualUI(${id}, 'categoria', this.value)" style="font-size:13px; padding:4px; border-radius:4px; border:1px solid #e2e2de;">${opcionesCategoria}</select></td>
      <td style="text-align:right;"><input type="number" step="0.01" value="${g.importe_anual}" onblur="actualizarGastoAnualUI(${id}, 'importe_anual', this.value)" style="width:100px; text-align:right; border:1px solid transparent; padding:4px 6px; border-radius:4px; font-size:13px;" onfocus="this.style.border='1px solid #e2e2de'"></td>
      <td style="text-align:right; color:#6b6a64;">${euros(g.importe_mensual)}<span style="color:#c9c7bf;"> /mes</span></td>
      <td><input type="text" value="${(g.notas || '').replace(/"/g, '&quot;')}" placeholder="matrícula, referencia..." onblur="actualizarGastoAnualUI(${id}, 'notas', this.value)" style="width:100%; border:1px solid transparent; padding:4px 6px; border-radius:4px; font-size:13px; color:#6b6a64;" onfocus="this.style.border='1px solid #e2e2de'"></td>
      <td style="text-align:center;"><button onclick="eliminarGastoAnual(${id})" title="Eliminar" style="border:none; background:transparent; color:#A32D2D; cursor:pointer; font-size:15px;">🗑️</button></td>

}

        <thead><tr><th>Concepto</th><th>Categoría</th><th style="text-align:right;">Importe anual</th><th style="text-align:right;">Importe mensual</th><th>Notas</th><th></th></tr></thead>
        <tbody id="tabla-gastos-anuales-body">

            <td><select id="nuevo-gasto-categoria" style="font-size:13px; padding:4px; border-radius:4px; border:1px solid #e2e2de;">${opcionesCategoriaNueva}</select></td>
            <td style="text-align:right;"><input type="number" step="0.01" id="nuevo-gasto-importe" placeholder="0,00" style="width:100px; text-align:right; border:1px solid #e2e2de; padding:5px 6px; border-radius:4px; font-size:13px;"></td>
            <td></td>
            <td><input type="text" id="nuevo-gasto-notas" placeholder="Opcional" style="width:100%; border:1px solid #e2e2de; padding:5px 6px; border-radius:4px; font-size:13px;"></td>
            <td style="text-align:center;"><button onclick="anadirGastoAnual()" style="border:none; background:#1a1a18; color:#fff; padding:5px 10px; border-radius:6px; cursor:pointer; font-size:12px;">+ Añadir</button></td>

async function actualizarGastoAnualUI(id, campo, valor) {
  try {
    const resp = await fetch('/api/gastos-anuales/' + id, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ [campo]: valor })
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    const g = gastosAnualesGlobal.data.find(x => x.id === id);
    if (g) {
      g[campo] = valor;
      if (campo === 'importe_anual') {
        g.importe_mensual = Math.round((parseFloat(valor) || 0) / 12 * 100) / 100;
        pintarGastosAnuales();
      }
    }
  } catch (err) {
    alert('Error al guardar: ' + err.message);
  }
}
async function eliminarGastoAnual(id) {
  if (!confirm('¿Eliminar este pago anual? No se podrá deshacer.')) return;
  try {
    const resp = await fetch('/api/gastos-anuales/' + id, { method: 'DELETE' });
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    gastosAnualesGlobal.data = gastosAnualesGlobal.data.filter(g => g.id !== id);
    pintarGastosAnuales();
  } catch (err) {
    alert('Error al eliminar: ' + err.message);
  }
}
async function anadirGastoAnual() {
  const concepto = document.getElementById('nuevo-gasto-concepto').value.trim();
  const categoria = document.getElementById('nuevo-gasto-categoria').value;
  const importe_anual = document.getElementById('nuevo-gasto-importe').value;
  const notas = document.getElementById('nuevo-gasto-notas').value.trim();
  if (!concepto || !importe_anual) { alert('Concepto e importe anual son obligatorios.'); return; }
  try {
    const resp = await fetch('/api/gastos-anuales', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ concepto, categoria, importe_anual, notas, anio: gastosAnualesGlobal.anio })
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    const g = data.gasto;
    g.importe_mensual = Math.round((parseFloat(g.importe_anual) || 0) / 12 * 100) / 100;
    gastosAnualesGlobal.data.push(g);
    pintarGastosAnuales();
  } catch (err) {
    alert('Error al guardar: ' + err.message);
  }
}

// GASTOS DE PERSONAL (11 sep 2026) — Financiero → Personal. Dos gastos:
// Nóminas (se sube cada mes el .xls de la gestoría, se guarda el detalle de
// cada trabajador) y Extras (pendiente — vive en una hoja de Sheets aparte,
// falta el enlace para engancharla). El coste de cada trabajador se reparte
// a un único departamento (pestaña Config. Departamentos) y de ahí sale el
// bloque "Personal" del desglose por departamento en Cierre Mensual.
// Pestaña Informe: tabla cruzada trabajador/departamento × meses
// seleccionables — cualquier combinación de meses (uno, varios, el año
// entero) con cualquiera de las dos agrupaciones, todo en el cliente sobre
// los datos ya cargados del año. Métricas: importe, nº de personas y coste
// medio por persona; comparable con uno o varios años (cada año extra se
// pide una vez al marcarlo) y filtrable por departamento (detalle de sus
// trabajadores). Exportable a Excel (CSV) e imprimible/PDF.
// ================================================================
let personalGlobal = { anio: new Date().getFullYear(), detalle: [], departamentos: [], extras: [], extrasDepartamentos: [], extrasAlias: [], empleadosAlias: [], tab: 'nominas', otrosAnios: {}, aniosDisponibles: [] };
const ETIQUETA_FORMATO_ORIGEN = { nominas_gestoria: 'Nóminas', resumen_contable: 'Resumen Contable' };
let informePersonalMeses = new Set(Array.from({ length: 12 }, (_, i) => i + 1));
let informePersonalAgrupacion = 'departamento';
let informePersonalFuente = 'ambos'; // 'nominas' | 'extras' | 'ambos'
let informePersonalMetrica = 'importe'; // 'importe' | 'personas' | 'medio'
let informePersonalAniosComparar = new Set(); // años a comparar además del seleccionado
let informePersonalDepto = null; // null = todos; si no, detalle de ese departamento por trabajador
let informePersonalEstado = 'todos'; // 'todos' | 'activo' | 'baja' | 'eventual' (ver construirRegistroPersonal)

// Módulo Personal (28 sep 2026: sale de Financiero a módulo propio en el
// menú). Cada apartado es una entrada del submenú "Personal"; la navegación
// interna (enlaces "ir a Config"...) usa cambiarPestanaPersonal, que también
// marca el submenú. Histórico y Comparador trabajan con TODOS los años.
const SECCIONES_PERSONAL = {
  nominas: 'Nóminas', informe: 'Informe', extras: 'Extras', analisis: 'Análisis',
  historico: 'Histórico de personal', comparador: 'Comparador', config: 'Configuración'
};
const SECCIONES_PERSONAL_SIN_ANIO = ['historico', 'comparador', 'config'];
// Carga (28 sep 2026): TODOS los años en una sola petición (/api/personal/datos,
// con caché en el servidor) y se reutiliza al cambiar de apartado o de año
// durante 5 min; tras guardar/subir/sincronizar se vuelve a pedir. Con límite
// de espera: si el servidor no responde, error con "Reintentar" en vez de
// quedarse en "Cargando..." indefinidamente.
const VIGENCIA_DATOS_PERSONAL_MS = 5 * 60 * 1000;
async function fetchConLimitePersonal(url, ms) {
  const control = new AbortController();
  const t = setTimeout(() => control.abort(), ms);
  try {
    return await fetch(url, { signal: control.signal });
  } catch (err) {
    if (err.name === 'AbortError') throw new Error('El servidor tarda demasiado en responder (más de ' + Math.round(ms / 1000) + ' s).');
    throw err;
  } finally {
    clearTimeout(t);
  }
}
async function cargarPersonal(seccion) {
  if (seccion) personalGlobal.tab = seccion;
  document.getElementById('content-title').textContent = 'Personal · ' + (SECCIONES_PERSONAL[personalGlobal.tab] || '');
  const body = document.getElementById('content-body');
  const vigente = personalGlobal.cargadoEn && Date.now() - personalGlobal.cargadoEn < VIGENCIA_DATOS_PERSONAL_MS;
  if (!vigente) body.innerHTML = '<p class="loading-text">Cargando datos de personal...</p>';
  try {
    if (!vigente) await recargarDatosPersonal();
    pintarPersonal();
  } catch (err) {
    body.innerHTML = '<p class="loading-text">Error: ' + err.message + '</p><button onclick="cargarPersonal()" style="font-size:13px; padding:8px 16px; border-radius:8px; border:none; background:#1a1a18; color:#fff; cursor:pointer;">Reintentar</button>';
  }
}
async function recargarDatosPersonal(forzar) {
  const resp = await fetchConLimitePersonal('/api/personal/datos' + (forzar ? '?refrescar=1' : ''), 45000);
  const data = await resp.json();
  if (data.error) throw new Error(data.error);
  personalGlobal.porAnio = data.por_anio || {};
  personalGlobal.departamentos = data.departamentos || [];
  personalGlobal.extrasDepartamentos = data.extras_departamentos || [];
  personalGlobal.extrasAlias = data.extras_alias || [];
  personalGlobal.empleadosAlias = data.empleados_alias || [];
  personalGlobal.aniosDisponibles = data.anios_disponibles || [];
  personalGlobal.inicioFormularioExtras = data.inicio_formulario_extras || null;
  personalGlobal.cargadoEn = Date.now();
  aplicarAnioPersonal();
}
// Reparte los datos ya cargados: año seleccionado → detalle/extras/movimientos;
// el resto → otrosAnios (así Informe, Histórico, Comparador... no piden nada más).
function aplicarAnioPersonal() {
  const vacio = { detalle: [], extras: [], movimientos: [] };
  const actual = personalGlobal.porAnio[personalGlobal.anio] || vacio;
  personalGlobal.detalle = actual.detalle;
  personalGlobal.extras = actual.extras;
  personalGlobal.movimientos = actual.movimientos;
  personalGlobal.otrosAnios = {};
  personalGlobal.aniosDisponibles.forEach(a => { if (a !== personalGlobal.anio) personalGlobal.otrosAnios[a] = personalGlobal.porAnio[a] || vacio; });
}
function cambiarAnioPersonal(anio) {
  personalGlobal.anio = parseInt(anio);
  aplicarAnioPersonal();
  pintarPersonal();
}
function recargarPersonalManual() {
  const body = document.getElementById('content-body');
  body.innerHTML = '<p class="loading-text">Recargando datos de personal...</p>';
  recargarDatosPersonal(true).then(pintarPersonal).catch(err => {
    body.innerHTML = '<p class="loading-text">Error: ' + err.message + '</p><button onclick="recargarPersonalManual()" style="font-size:13px; padding:8px 16px; border-radius:8px; border:none; background:#1a1a18; color:#fff; cursor:pointer;">Reintentar</button>';
  });
}
function pintarPersonal() {
  const body = document.getElementById('content-body');
  const anios = new Set([...personalGlobal.aniosDisponibles, new Date().getFullYear(), personalGlobal.anio]);
  const opcionesAnio = [...anios].sort((a, b) => b - a).map(a => `<option value="${a}" ${a === personalGlobal.anio ? 'selected' : ''}>${a}</option>`).join('');
  body.innerHTML = `
    <div class="no-imprimir" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; gap:1rem;">
      <p style="font-size:13px; color:#6b6a64; margin:0;">Nóminas + extras. El coste repercute en <span style="cursor:pointer; text-decoration:underline;" onclick="marcarMenuActivo('menu-item-fin-cierre-mensual'); cargarCierreMensual();">Cierre Mensual</span> según el departamento asignado a cada trabajador.</p>
      <div style="display:flex; align-items:center; gap:12px; flex-shrink:0;">
        <span onclick="recargarPersonalManual()" title="Volver a leer los datos de la base de datos" style="font-size:12px; color:#6b6a64; cursor:pointer; white-space:nowrap;">↻ Recargar</span>
        <div id="selector-anio-personal" style="display:flex; align-items:center; gap:8px;">
          <label style="font-size:13px; color:#6b6a64;">Año</label>
          <select onchange="cambiarAnioPersonal(this.value)" style="font-size:13px; padding:5px 8px; border-radius:6px; border:1px solid #e2e2de;">${opcionesAnio}</select>
        </div>
      </div>
    </div>
    <div id="personal-tab-body"></div>
  `;
  cambiarPestanaPersonal(personalGlobal.tab);
}
function cambiarPestanaPersonal(tab) {
  personalGlobal.tab = tab;
  document.getElementById('content-title').textContent = 'Personal · ' + (SECCIONES_PERSONAL[tab] || '');
  marcarMenuActivo('menu-item-per-' + tab);
  const selector = document.getElementById('selector-anio-personal');
  if (selector) selector.style.display = SECCIONES_PERSONAL_SIN_ANIO.includes(tab) ? 'none' : 'flex';
  if (tab === 'nominas') pintarPersonalNominas();
  else if (tab === 'config') pintarPersonalConfig();
  else if (tab === 'informe') pintarPersonalInforme();
  else if (tab === 'analisis') pintarPersonalAnalisis();
  else if (tab === 'historico') pintarPersonalHistorico();
  else if (tab === 'comparador') pintarPersonalComparador();
  else pintarPersonalExtras();
}

async function subirNomina() {
  const input = document.getElementById('input-archivo-nomina');
  if (!input.files || input.files.length === 0) {
    const estado = document.getElementById('estado-subida-nomina');
    estado.textContent = 'Selecciona uno o varios archivos primero.'; estado.style.color = '#A32D2D';
    return;
  }
  document.getElementById('estado-subida-nomina').textContent = 'Subiendo y procesando ' + input.files.length + ' archivo(s)...';
  document.getElementById('estado-subida-nomina').style.color = '#6b6a64';
  document.getElementById('resultado-subida-nomina').innerHTML = '';
  document.getElementById('aviso-sin-departamento').innerHTML = '';
  try {
    const formData = new FormData();
    for (const f of input.files) formData.append('archivos', f);
    const resp = await fetch('/api/nominas/subir', { method: 'POST', body: formData });
    const data = await resp.json();
    if (data.error) throw new Error(data.error);

    const okCount = data.resultados.filter(r => r.ok).length;
    const failCount = data.resultados.length - okCount;
    const textoEstado = '✓ ' + okCount + ' archivo(s) procesados' + (failCount ? ', ' + failCount + ' con error' : '');
    const colorEstado = failCount ? '#854F0B' : '#27500A';
    const htmlResultado = `
      <div style="margin-top:12px; background:#fff; border:1px solid #e2e2de; border-radius:8px; overflow:hidden;">
        <table>
          <thead><tr><th>Archivo</th><th>Mes</th><th>Empresa</th><th>Formato</th><th style="text-align:right;">Trabajadores</th><th style="text-align:right;">Coste</th></tr></thead>
          <tbody>${data.resultados.map(r => r.ok
            ? `<tr><td>${r.archivo}</td><td>${MESES_ES_FACTURAS[r.mes]} ${r.anio}</td><td>${r.empresa}</td><td>${ETIQUETA_FORMATO_ORIGEN[r.formato] || r.formato}</td><td style="text-align:right;">${r.num_empleados}</td><td style="text-align:right;">${euros(r.total_coste)}</td></tr>`
            : `<tr style="background:#FCEBEB;"><td>${r.archivo}</td><td colspan="5" style="color:#A32D2D;">Error: ${r.error}</td></tr>`
          ).join('')}</tbody>
        </table>
      </div>
    `;
    const htmlAviso = (data.sin_departamento && data.sin_departamento.length > 0) ? `
      <div style="margin-top:12px; background:#FCEBEB; border:0.5px solid #F3C9C9; border-radius:8px; padding:0.85rem 1rem; cursor:pointer;" onclick="cambiarPestanaPersonal('config')">
        <p style="font-size:13px; color:#A32D2D; margin:0; font-weight:500;">⚠️ ${data.sin_departamento.length} trabajador(es) nuevo(s) sin departamento asignado</p>
        <p style="font-size:11px; color:#854F0B; margin:2px 0 0;">Haz clic para asignarlos en Config. Departamentos</p>
      </div>
    ` : '';
    // Trabajadores que venían en varias filas del mismo archivo (dos nóminas
    // en el mes): se han sumado en una — se avisa para poder revisarlo.
    const htmlUnificados = (data.unificados && data.unificados.length) ? `
      <div style="margin-top:12px; background:#E8F0F6; border:0.5px solid #C9DCE8; border-radius:8px; padding:0.85rem 1rem;">
        <p style="font-size:13px; color:#2F6280; margin:0; font-weight:500;">ℹ️ ${data.unificados.length} trabajador(es) venían en varias filas del mismo mes y se han sumado en una:</p>
        <p style="font-size:12px; color:#2F6280; margin:4px 0 0;">${data.unificados.map(u => u.nombre + ' (' + MESES_ES_FACTURAS[u.mes] + ', ' + u.filas + ' filas)').join(' · ')}</p>
      </div>` : '';

    // Si todos los archivos subidos son del mismo año, saltamos directamente
    // a verlo; si mezclan años (histórico de varios de golpe), se deja el
    // selector de año tal cual para que el usuario navegue entre ellos.
    const aniosVistos = [...new Set(data.resultados.filter(r => r.ok).map(r => r.anio))];
    if (aniosVistos.length === 1) personalGlobal.anio = aniosVistos[0];
    await recargarDatosPersonal();
    pintarPersonal(); // reconstruye toda la pestaña — los divs de abajo son nuevos

    document.getElementById('estado-subida-nomina').textContent = textoEstado;
    document.getElementById('estado-subida-nomina').style.color = colorEstado;
    document.getElementById('resultado-subida-nomina').innerHTML = htmlResultado;
    document.getElementById('aviso-sin-departamento').innerHTML = htmlAviso + htmlUnificados;
  } catch (err) {
    document.getElementById('estado-subida-nomina').textContent = 'Error: ' + err.message;
    document.getElementById('estado-subida-nomina').style.color = '#A32D2D';
  }
}
async function eliminarNominaMes(mes, empresaNif, formatoOrigen, empresaNombre) {
  if (!confirm('¿Eliminar la nómina de ' + MESES_ES_FACTURAS[mes] + ' de ' + empresaNombre + ' (' + (ETIQUETA_FORMATO_ORIGEN[formatoOrigen] || formatoOrigen) + ')? Borra el detalle de todos los trabajadores de ese mes. No se puede deshacer.')) return;
  try {
    const resp = await fetch('/api/nominas/mes?anio=' + personalGlobal.anio + '&mes=' + mes + '&empresa_nif=' + encodeURIComponent(empresaNif) + '&formato_origen=' + encodeURIComponent(formatoOrigen), { method: 'DELETE' });
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    await recargarDatosPersonal();
    pintarPersonalNominas();
  } catch (err) {
    alert('Error al eliminar: ' + err.message);
  }
}

// ── Configuración de Personal (reorganizada 28 sep 2026) ──
// 1. Personal en activo / 2. Personal en baja o inactivo: una fila por
//    PERSONA (sus filas de empleados_departamento de cualquier formato de
//    gestoría, agrupadas con la misma clave de persona que el Informe). Aquí
//    se asigna el departamento y se marca "fijo discontinuo" (inactivo que
//    volverá: en el histórico sale como tal en vez de baja; al subir una
//    nómina suya vuelve a "activo" solo).
// 3. Fusionar trabajadores del formato antiguo con su ficha actual.
// 4. Extras: vincular cada nombre de Extras a un trabajador de CUALQUIER
//    época (activos arriba, bajas al final) para que sus horas caigan en su
//    ficha. Las sugerencias automáticas solo se aplican a lo que nunca se ha
//    revisado (extras_alias.revisado / fila en empleados_alias): una vez
//    guardado "Sin vincular" o "No fusionar", se respeta.
function tokensNombrePersona(s) {
  return (s || '').replace(/\(.*?\)/g, ' ').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Z\s]/g, ' ').split(/\s+/).filter(Boolean);
}
// Sugiere una persona solo si TODAS las palabras del nombre buscado casan con
// palabras de su "APELLIDOS, NOMBRE" (entera, o abreviatura de 3+ letras, o
// inicial de una letra) y ninguna otra persona cumple lo mismo. Un nombre de
// una sola palabra exige coincidencia exacta (evita "DANI" → cualquier Daniel).
function sugerirPersonaPorNombre(nombreBuscado, candidatos) {
  const tb = tokensNombrePersona(nombreBuscado);
  if (!tb.length) return null;
  const casa = (t, tp) => tp === t || (tb.length > 1 && ((t.length >= 3 && tp.startsWith(t)) || (t.length === 1 && tp[0] === t)));
  const validos = candidatos.filter(c => { const tp = tokensNombrePersona(c.nombre); return tb.every(t => tp.some(x => casa(t, x))); });
  return validos.length === 1 ? validos[0] : null;
}
function valorClavePersona(c) { return c.empresa_nif + '|' + c.formato_origen + '|' + c.num_empleado; }

// Desplegable de todo el personal con nómina: activos, fijos discontinuos y
// bajas (al final), en "APELLIDOS, NOMBRE".
function opcionesTodoElPersonal(activos, inactivos, valorSeleccionado) {
  const opt = (p) => { const v = valorClavePersona(p.clave); return `<option value="${v}" ${v === valorSeleccionado ? 'selected' : ''}>${p.nombre}${p.estado !== 'activo' ? ' · hasta ' + textoYM(p.ultimo) : ''}</option>`; };
  const disc = inactivos.filter(p => p.estado === 'discontinuo'), bajas = inactivos.filter(p => p.estado !== 'discontinuo').sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));
  return `<optgroup label="En activo">${activos.map(opt).join('')}</optgroup>`
    + (disc.length ? `<optgroup label="Fijos discontinuos (inactivos)">${disc.map(opt).join('')}</optgroup>` : '')
    + (bajas.length ? `<optgroup label="En baja">${bajas.map(opt).join('')}</optgroup>` : '');
}
function filaExtraDeptoHtml(e, alias, ctx, activos, inactivos) {
  const vinculado = !!(alias && alias.empresa_nif && alias.num_empleado);
  const revisado = vinculado || !!(alias && alias.revisado);
  let valor = '';
  if (vinculado) {
    // El vínculo puede apuntar a una fila del formato antiguo ya fusionada:
    // se muestra seleccionada la persona (su clave representativa).
    const per = ctx.personaDeClave(alias.empresa_nif, alias.formato_origen || 'nominas_gestoria', alias.num_empleado);
    const p = personalGlobal.configPersonas.porPersona[per];
    valor = p ? valorClavePersona(p.clave) : (alias.empresa_nif + '|' + (alias.formato_origen || 'nominas_gestoria') + '|' + alias.num_empleado);
  }
  const sugerido = !revisado ? sugerirPersonaPorNombre(e.nombre, [...activos, ...inactivos]) : null;
  if (sugerido) valor = valorClavePersona(sugerido.clave);
  const persona = valor ? personalGlobal.configPersonas.porClave[valor] : null;

  const sugerido = !revisado ? sugerirPersonaPorNombre(e.nombre, roster) : null;
  const valor = alias && alias.num_empleado_canonico ? (alias.formato_canonico || 'nominas_gestoria') + '|' + alias.num_empleado_canonico : (sugerido ? 'nominas_gestoria|' + sugerido.clave.num_empleado : '');

  const porNombre = (a, b) => (a.nombre || '').localeCompare(b.nombre || '');

  const optAntiguo = (d) => { const v = d.formato_origen + '|' + d.num_empleado; return `<option value="${v}" ${v === valor ? 'selected' : ''}>${d.nombre} · Nº ${d.num_empleado}</option>`; };

// Formato según métrica — tabla (completo) y etiquetas del gráfico (compacto).
function formatoMetricaInforme(v) {
  if (v == null) return '—';

function formatoCompactoInforme(v) {

// Mapas de departamento/fusión (globales, no dependen del año):
// Por departamento: Nóminas + Extras se suman juntas (misma lista
// DEPARTAMENTOS_ORUM) usando formato_origen en la clave — el mismo número
// de trabajador puede ser otra persona según el formato del archivo.
// Por trabajador: se agrupa por nombre ACTUAL (roster "nominas_gestoria")
// cuando hay fusión guardada (empleados_alias / extras_alias) — así el
// histórico de Resumen Contable 2025 y los extras vinculados aparecen bajo
// la misma fila que la persona hoy, permitiendo comparar años. Sin
// fusionar, cada fuente/formato aporta su propia fila etiquetada aparte.
function contextoInformePersonal() {
  const mapaDepto = {};
  personalGlobal.departamentos.forEach(d => { mapaDepto[d.empresa_nif + '|' + (d.formato_origen || 'nominas_gestoria') + '|' + d.num_empleado] = d.departamento || 'Personal sin clasificar'; });
  const mapaDeptoExtras = {};
  personalGlobal.extrasDepartamentos.forEach(d => { mapaDeptoExtras[d.nombre] = d.departamento || 'Extras sin clasificar'; });
  // Fusión de un código del formato antiguo: normalmente con su ficha del
  // formato actual, pero también con OTRO código antiguo de la misma persona
  // (formato_canonico; 28 sep 2026: gente de baja con varios códigos en
  // Resumen Contable y sin ficha actual). null = formato actual.
  const mapaAliasEmpleado = {};
  personalGlobal.empleadosAlias.forEach(a => { if (a.num_empleado_canonico) mapaAliasEmpleado[a.empresa_nif + '|' + a.formato_origen + '|' + a.num_empleado] = { formato: a.formato_canonico || 'nominas_gestoria', num: a.num_empleado_canonico }; });
  // Clave final de una clave de nómina, siguiendo fusiones encadenadas.
  const canonDeClave = (nif, formato, num) => {
    let f = formato, n = num;
    for (let i = 0; i < 5 && f !== 'nominas_gestoria'; i++) {

function abrirDeptoInforme(depto) { informePersonalDepto = depto; pintarPersonalInforme(); }

function renderTablaInformePersonal() {
  const cont = document.getElementById('tabla-informe-personal');

  const aniosNecesarios = aniosConDatosPersonal().filter(a => a !== personalGlobal.anio);

    cont.innerHTML = '<p class="loading-text" style="padding:1.5rem;">Cargando histórico...</p>';
    asegurarAniosCompararPersonal(aniosNecesarios).then(renderTablaInformePersonal).catch(err => {
      alert('No se pudieron cargar los años a comparar: ' + err.message);
      informePersonalAniosComparar = new Set();
      pintarPersonalInforme();
    });
    return;
  }
  const ctx = contextoInformePersonal();
  const registro = construirRegistroPersonal(ctx);
  personalGlobal.estadoPorPersona = {};
  registro.personas.forEach(p => { personalGlobal.estadoPorPersona[p.persona] = p.estado; });
  const datosAnio = (a) => a === personalGlobal.anio ? personalGlobal : personalGlobal.otrosAnios[a];
  const mesesSeleccionados = Array.from(informePersonalMeses).sort((a, b) => a - b);
  const todosAnios = [...aniosComparar, personalGlobal.anio].sort((a, b) => a - b);
  // Años sin ningún dato en los meses elegidos se apartan (no vaciarían la
  // intersección de meses del resto) y se avisa.
  const mesesPorAnio = {};
  todosAnios.forEach(a => { mesesPorAnio[a] = cuboInformePersonal(datosAnio(a).detalle, datosAnio(a).extras, mesesSeleccionados, ctx).mesesConDatos; });
  const anios = todosAnios.filter(a => a === personalGlobal.anio || mesesPorAnio[a].length > 0);
  const aniosSinDatos = todosAnios.filter(a => !anios.includes(a));
  const meses = mesesSeleccionados.filter(m => anios.every(a => mesesPorAnio[a].includes(m)));
  const cubos = {};
  anios.forEach(a => { cubos[a] = cuboInformePersonal(datosAnio(a).detalle, datosAnio(a).extras, meses, ctx); });
  const cAct = cubos[personalGlobal.anio];
  const multi = anios.length > 1;

  const ambito = informePersonalDepto ? 'Departamento: ' + informePersonalDepto : (informePersonalAgrupacion === 'departamento' ? 'Todos los departamentos' : 'Todos los trabajadores');
  cabeceraDiv.innerHTML = `
    ${informePersonalDepto ? `<div class="no-imprimir" style="margin-bottom:10px;"><span onclick="cambiarDeptoInforme('')" style="font-size:12px; color:#3D7C9E; cursor:pointer;">← Todos los departamentos</span> <span style="font-size:15px; font-weight:600; margin-left:8px;">${informePersonalDepto}</span></div>` : ''}
    <div class="solo-impresion" style="margin-bottom:12px;">
      <p style="font-size:18px; font-weight:600; margin:0;">Informe de Personal · ${ambito}</p>
      <p style="font-size:12px; color:#6b6a64; margin:2px 0 0;">${ETIQUETA_FUENTE_INFORME[informePersonalFuente]} · ${ETIQUETA_METRICA_INFORME[informePersonalMetrica]} · ${meses.length ? textoPeriodoInforme(meses) : '—'} · ${anios.join(' / ')} · generado ${new Date().toLocaleDateString('es-ES')}</p>
    </div>
    ${aniosSinDatos.length ? `<p class="no-imprimir" style="font-size:12px; color:#854F0B; margin:0 0 10px;">Sin datos en los meses elegidos: ${aniosSinDatos.join(', ')} (no se comparan).</p>` : ''}
  `;
  informePersonalExport = [];
  if (meses.length === 0 || cAct.filas.length === 0) {
    const msg = multi || aniosSinDatos.length

  // ── KPIs del periodo (serie por año) ──

  };
  const res = anios.map(a => ({ anio: a, r: resumen(cubos[a]) }));
  const serie = (k) => res.map(x => ({ anio: x.anio, v: x.r[k] }));
  const fmtNum = (v) => v == null ? '—' : v.toLocaleString('es-ES', { maximumFractionDigits: 1 });
  const fmtPct = (v) => v == null ? '—' : (v * 100).toLocaleString('es-ES', { maximumFractionDigits: 1 }) + ' %';
  const fmtEur = (v) => v == null ? '—' : euros(v);
  kpisDiv.innerHTML =

    return persona ? `<td><span onclick="abrirFichaTrabajador('${escaparAtributoInforme(persona)}')" style="cursor:pointer; color:#1a1a18; text-decoration:underline; text-decoration-color:#c9c7bf;" title="Ver la ficha del trabajador">${f}</span> ${estado && estado !== 'activo' ? badgeEstadoPersonal(estado) : ''}</td>` : `<td>${f}</td>`;

      .sort((x, y) => valorImporteFila(cAct, y.f, meses) - valorImporteFila(cAct, x.f, meses) || x.f.localeCompare(y.f));

      return `<td style="text-align:right; ${i === valores.length - 1 ? 'font-weight:500;' : 'color:#4a4944;'}">${v == null ? '<span style="color:#c9c7bf;">—</span>' : formatoMetricaInforme(v)}${sub}</td>`;

    const filaHtml = (celdaNombre, valores, esTotal) => {
      const t = tendenciaSerieInforme(valores);
      const vPrimero = valores[0], vUltimo = valores[valores.length - 1];
      return `<tr ${esTotal ? 'style="background:#f7f6f2; font-weight:500;"' : ''}>${celdaNombre}${celdasAnios(valores)}

    const totalValores = anios.map(a => valorPeriodoInforme(cubos[a], null, meses));
    cont.innerHTML = `

      <table>

    const pctTotal = (vs) => vs[0] != null && vs[vs.length - 1] != null && vs[0] ? (vs[vs.length - 1] - vs[0]) / Math.abs(vs[0]) : null;
    informePersonalExport.push({

      cabecera: [etiquetaFila, ...anios.map(String), 'Δ % ' + primero + '→' + ultimo, 'Tendencia'],
      filas: [...filas.map(x => [x.f, ...x.valores.map(numExport), numExport(pctTotal(x.valores) == null ? null : pctTotal(x.valores) * 100), tendenciaSerieInforme(x.valores).etiqueta.replace(/^[^A-Za-z]+/, '')]),
        ['Total', ...totalValores.map(numExport), numExport(pctTotal(totalValores) == null ? null : pctTotal(totalValores) * 100), tendenciaSerieInforme(totalValores).etiqueta.replace(/^[^A-Za-z]+/, '')]]

      }).join('');
      const pct = conPct ? `<td style="text-align:right; color:#6b6a64;">${granImporte ? (valorImporteFila(cAct, f, meses) / granImporte * 100).toLocaleString('es-ES', { maximumFractionDigits: 1 }) + ' %' : '—'}</td>` : '';
      return `<tr>${celdaFila(f)}${celdas}<td style="text-align:right; font-weight:500;">${formatoMetricaInforme(valorPeriodoInforme(cAct, f, meses))}</td>${pct}</tr>`;
    }).join('');
    const celdasTotales = meses.map(m => `<td style="text-align:right;">${formatoMetricaInforme(valorMesInforme(cAct, null, m))}</td>`).join('');
    const notaMetrica = informePersonalMetrica === 'personas'
      ? 'Personas con coste en el mes (nómina y/o extras; quien tiene ambas cuenta una vez si está vinculado en Config). La columna Media es la plantilla media del periodo.'
      : informePersonalMetrica === 'medio' ? 'Coste del mes ÷ personas con coste ese mes. La columna Media = coste total ÷ (personas × meses).' : '';
    const notaClic = clicable ? ' Pulsa un departamento para ver sus trabajadores.' : '';
    cont.innerHTML = `
      ${notaMetrica || notaClic ? `<p style="font-size:12px; color:#6b6a64; margin:0; padding:10px 12px 0;">${notaMetrica}${notaClic}</p>` : ''}
      <table>
        <thead><tr><th>${etiquetaFila}</th>${cabeceraMeses}<th style="text-align:right;">${etiquetaTotal}</th>${conPct ? '<th style="text-align:right;">% total</th>' : ''}</tr></thead>
        <tbody>${filasHtml}</tbody>
        <tfoot><tr style="background:#f7f6f2; font-weight:500;"><td>Total</td>${celdasTotales}<td style="text-align:right;">${formatoMetricaInforme(valorPeriodoInforme(cAct, null, meses))}</td>${conPct ? '<td style="text-align:right;">100 %</td>' : ''}</tr></tfoot>
      </table>
    `;
    informePersonalExport.push({
      titulo: personalGlobal.anio + ' · ' + ETIQUETA_METRICA_INFORME[informePersonalMetrica] + ' por mes',
      cabecera: [etiquetaFila, ...meses.map(m => MESES_ES_FACTURAS[m]), etiquetaTotal].concat(conPct ? ['% total'] : []),
      filas: [...filas.map(f => [f, ...meses.map(m => numExport(valorMesInforme(cAct, f, m))), numExport(valorPeriodoInforme(cAct, f, meses))].concat(conPct ? [granImporte ? valorImporteFila(cAct, f, meses) / granImporte * 100 : ''] : [])),
        ['Total', ...meses.map(m => numExport(valorMesInforme(cAct, null, m))), numExport(valorPeriodoInforme(cAct, null, meses))].concat(conPct ? [100] : [])]
    });
  }

  // ── Desglose detallado del periodo (año seleccionado): de qué se compone

  const filasD = [...cAct.filas].sort((a, b) => valorImporteFila(cAct, b, meses) - valorImporteFila(cAct, a, meses) || a.localeCompare(b));
  const personasMesFila = (f) => meses.reduce((s, m) => s + (((cAct.personas[f] || {})[m] || { size: 0 }).size), 0);
  const granTotal = valorImporteFila(cAct, null, meses);
  const lineaD = (f) => {
    const d = cAct.desglose[f];
    const total = d.nominas + d.extras, pm = personasMesFila(f);
    return { nombre: f, plantilla: pm / meses.length, personas: d.personas.size, bruto: d.bruto, ssTrab: d.ssTrab, irpf: d.irpf, neto: d.neto, costeEmpresa: d.nominas - d.bruto, nominas: d.nominas, extras: d.extras, total, medio: pm ? total / pm : null, pct: granTotal ? total / granTotal * 100 : null };
  };
  const lineas = filasD.map(lineaD);
  const camposSuma = ['bruto', 'ssTrab', 'irpf', 'neto', 'costeEmpresa', 'nominas', 'extras', 'total'];
  const tot = {};
  camposSuma.forEach(k => { tot[k] = lineas.reduce((s, l) => s + l[k], 0); });
  const pmTotal = meses.reduce((s, m) => s + (cAct.personasMes[m] || { size: 0 }).size, 0);
  const lineaTotal = { nombre: 'Total', plantilla: pmTotal / meses.length, personas: cAct.personasPeriodo.size, ...tot, medio: pmTotal ? tot.total / pmTotal : null, pct: 100 };
  const tdE = (v, extra) => `<td style="text-align:right;${extra || ''}">${euros(v)}</td>`;
  const celdasD = (l) => `
    <td style="text-align:right;">${fmtNum(l.plantilla)}</td><td style="text-align:right;">${l.personas}</td>

    ${tdE(l.nominas)}${tdE(l.extras)}${tdE(l.total, ' font-weight:500;')}
