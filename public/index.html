function aplicarFiltrosProyectos(proyectos) {
  const texto = (document.getElementById('buscador-proyectos').value || '').toLowerCase();
  const estado = document.getElementById('filtro-estado-proyectos').value;
  const desde = document.getElementById('filtro-fecha-desde-proyectos').value;
  const hasta = document.getElementById('filtro-fecha-hasta-proyectos').value;
  let filtrados = proyectos.filter(p => {
    const coincideTexto = (p.cliente || '').toLowerCase().includes(texto) || String(p.numero || '').includes(texto);
    const coincideEstado = !estado || p.estado === estado;
    let coincideFecha = true;
    if ((desde || hasta) && p.evento_inicio) {
      const [fParte] = p.evento_inicio.split(' ');
      const [d, m, a] = fParte.split('/');
      const fechaEvento = `${a}-${m}-${d}`;
      if (desde && fechaEvento < desde) coincideFecha = false;
      if (hasta && fechaEvento > hasta) coincideFecha = false;
    } else if (desde || hasta) {
      coincideFecha = false;
    }
    return coincideTexto && coincideEstado && coincideFecha;
  });
  filtrados = ordenarLista(filtrados, ordenProyectos);
  document.getElementById('tabla-proyectos-body').innerHTML = filtrados.map(filaProyecto).join('');
}
function filaProyecto(p) {
  const badgeClass = badgeParaEstado(p.estado);
  return `
    <tr>
      <td style="text-align:center; width:28px;">${p.id ? `<button class="btn-material" onclick="abrirModalMaterialProyecto('${p.id}', '${String(p.numero || '').replace(/'/g, "\\'")}')" title="Ver material y servicios">&#128230;</button>` : ''}</td>
      <td class="celda-copiable" onclick="copiarAlPortapapeles('${p.numero || ''}', event)" title="Clic para copiar">${p.numero || ''}</td>
      <td>${p.cliente || ''}</td>
      <td>${p.comercial || ''}</td>
      <td>${(p.fecha_creacion || '').split(' ')[0]}</td>
      <td>${(p.evento_inicio || '').split(' ')[0]}</td>
      <td><span class="badge ${badgeClass}">${p.estado || ''}</span></td>
      <td style="text-align:right;">${formatearEuros(p.valor)}</td>
    </tr>
  `;
}
function badgeParaEstado(estado) {
  if (estado === 'Canceled') return 'badge-danger';
  if (estado === 'Pending' || estado === 'Concept') return 'badge-warning';
  return 'badge-success';
}
function formatearEuros(valor) {
  const n = parseFloat(valor) || 0;
  return n.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: 'always' }) + ' €';
}
function copiarAlPortapapeles(texto, ev) {
  if (ev) ev.stopPropagation();
  if (!texto) return;
  navigator.clipboard.writeText(String(texto)).then(() => mostrarToastCopiado(ev)).catch(() => {});
}
function mostrarToastCopiado(ev) {
  const toast = document.createElement('div');
  toast.textContent = '✓ Copiado';
  toast.style.cssText = 'position:fixed; padding:5px 10px; background:#1a1a18; color:#fff; border-radius:4px; font-size:12px; z-index:9999; pointer-events:none; transition:opacity 0.3s;';
  const x = (ev && ev.clientX) ? ev.clientX + 8 : window.innerWidth / 2;
  const y = (ev && ev.clientY) ? ev.clientY - 28 : 20;
  toast.style.left = x + 'px';
  toast.style.top = y + 'px';
  document.body.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 700);
}

// ================================================================
// SERVICIOS EXTRA (Logística) — próximos 15 días. Engloba los servicios
// adicionales que contratan los clientes (desplazamiento, montaje,
// nocturnidad, domingo...) agrupados por día, para tenerlos en cuenta de
// cara a la ruta. Los "badges" de color son solo una ayuda visual por
// palabra clave — no dependen de que el texto exacto de Rentman coincida
// al 100%, el filtro de tipo sí usa el valor real tal cual venga.
// ================================================================
let SERVICIOS_EXTRA_DATA = null;
let servExtraFiltroTipo = '';
async function cargarServiciosExtra() {
  document.getElementById('content-title').textContent = 'Servicios Extra · Próximos 15 días';
  const body = document.getElementById('content-body');
  body.innerHTML = '<p class="loading-text">Cargando...</p>';
  try {
    const resp = await fetch('/api/logistica/servicios-extra');
    const data = await resp.json();
    if (data.error) { body.innerHTML = '<p class="loading-text">Error: ' + data.error + '</p>'; return; }
    actualizarIndicadorFecha(data.ultima_actualizacion);
    SERVICIOS_EXTRA_DATA = data;
    servExtraFiltroTipo = '';
    pintarServiciosExtra();
  } catch (err) { body.innerHTML = '<p class="loading-text">Error de conexión</p>'; }
}
function servicioExtraBadge(nombre) {
  const n = (nombre || '').toLowerCase();
  if (n.includes('noctur')) return { bg: '#2a2a2a', fg: '#fff', icon: '🌙' };
  if (n.includes('doming')) return { bg: '#FCEBEB', fg: '#A32D2D', icon: '☀️' };
  if (n.includes('desplaz')) return { bg: '#cfe3fc', fg: '#1c4e80', icon: '🚚' };
  if (n.includes('montaj')) return { bg: '#d8f0dc', fg: '#1f6b3a', icon: '🔧' };
  return { bg: 'var(--gray-100)', fg: 'var(--text-secondary)', icon: '➕' };
}
function etiquetaDiaServExtra(diasDesdeHoy, fechaIso) {
  const [y, m, d] = fechaIso.split('-');
  const fechaFmt = d + '/' + m + '/' + y;
  if (diasDesdeHoy === 0) return 'HOY · ' + fechaFmt;
  if (diasDesdeHoy === 1) return 'MAÑANA · ' + fechaFmt;
  const dt = new Date(y, m - 1, d);
  const diaSemana = dt.toLocaleDateString('es-ES', { weekday: 'long' });
  return diaSemana.charAt(0).toUpperCase() + diaSemana.slice(1) + ' · ' + fechaFmt;
}
function toggleServExtraCard(headerEl) {
  const card = headerEl.closest('.servextra-card');
  const detalle = card.querySelector('.servextra-detalle');
  const chevron = card.querySelector('.servextra-chevron');
  const abierto = detalle.style.display !== 'none';
  detalle.style.display = abierto ? 'none' : 'block';
  chevron.style.transform = abierto ? '' : 'rotate(180deg)';
}
// Aviso: entrega/recogida en domingo o festivo (calendario fijo +
// Jueves/Viernes Santo calculados) sin servicio "Domingo/Festivo" dado de
// alta en el proyecto — para pillar el despiste antes de que llegue el día.
function pintarAlertasServExtra(alertas) {
  if (!alertas || !alertas.length) return '';
  const filas = alertas.map(a => {
    const [y, m, d] = a.fecha_iso.split('-');
    return `<li style="margin-bottom:4px;">${a.tipo_fecha === 'recogida' ? 'Recogida' : 'Entrega'} en <strong>${a.motivo === 'domingo' ? 'domingo' : 'festivo'}</strong> (${d}/${m}/${y}) — ${a.proyecto_numero ? '#' + a.proyecto_numero : 'Proyecto s/n'} ${a.cliente ? '· ' + a.cliente : ''} — sin servicio Domingo/Festivo dado de alta</li>`;
  }).join('');
  return `
    <div style="background:#FCEBEB; border:1px solid #f0c9c9; border-radius:8px; padding:0.85rem 1.1rem; margin-bottom:1.25rem; font-size:13px; color:#A32D2D;">
      <p style="font-weight:700; margin:0 0 6px;">⚠️ ${alertas.length} entrega(s)/recogida(s) en domingo o festivo sin contemplar</p>
      <ul style="margin:0 0 0 1.1rem; padding:0;">${filas}</ul>
    </div>
  `;
}
function pintarServiciosExtra() {
  const body = document.getElementById('content-body');
  const data = SERVICIOS_EXTRA_DATA;
  const alertasHtml = pintarAlertasServExtra(data.alertas);
  const filtroHtml = `
    <div style="display:flex; gap:10px; align-items:center; margin-bottom:1.25rem; flex-wrap:wrap;">
      <select id="sext-filtro-tipo" onchange="servExtraFiltroTipo = this.value; pintarServiciosExtra();" style="width:auto;">
        <option value="">Tipo: Todos</option>
        ${data.tipos.map(t => `<option value="${t}" ${servExtraFiltroTipo === t ? 'selected' : ''}>${t}</option>`).join('')}
      </select>
      <span style="font-size:12px; color:var(--gray-400);">${data.total} servicio(s) extra en los próximos 15 días</span>
    </div>
  `;
  // Si hay filtro de tipo activo: se queda solo con los proyectos que tengan
  // ESE servicio (pero mostrando igualmente todos sus servicios en la
  // tarjeta, para no perder contexto de lo que lleva ese día).
  const porDia = servExtraFiltroTipo
    ? data.por_dia.map(d => ({ ...d, proyectos: d.proyectos.filter(p => p.servicios.some(s => s.servicio === servExtraFiltroTipo)) })).filter(d => d.proyectos.length)
    : data.por_dia;
  if (!porDia.length) {
    body.innerHTML = alertasHtml + filtroHtml + '<p class="loading-text">No hay servicios extra que coincidan.</p>';
    return;
  }
  const bloques = porDia.map(dia => {
    const tarjetas = dia.proyectos.map((p, idx) => {
      const badges = p.servicios.map(s => {
        const badge = servicioExtraBadge(s.servicio);
        return `<span style="background:${badge.bg}; color:${badge.fg}; font-size:11px; font-weight:700; padding:3px 10px; border-radius:12px; white-space:nowrap;">${badge.icon} ${s.servicio}</span>`;
      }).join('');
      const filasDetalle = p.servicios.map(s => `
        <tr><td>${s.servicio}</td><td>${s.cantidad != null ? s.cantidad : '—'}</td><td>${s.importe != null ? euros(s.importe) : '—'}</td></tr>
      `).join('');
      const cardId = 'sext-' + dia.fecha_iso + '-' + idx;
      return `
        <div class="servextra-card" id="${cardId}" style="border:1px solid var(--border); border-radius:8px; margin-bottom:8px; overflow:hidden; background:#fff;">
          <div onclick="toggleServExtraCard(this)" style="cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 14px;">
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
              <span style="font-weight:600; font-size:13px;">${p.proyecto_numero ? `<span class="celda-copiable" onclick="copiarAlPortapapeles('${p.proyecto_numero}', event)" title="Clic para copiar">#${p.proyecto_numero}</span>` : 'Proyecto s/n'} — ${p.cliente || 'Sin cliente'}</span>
              ${badges}
            </div>
            <span class="servextra-chevron" style="font-size:11px; color:var(--gray-400); transition:transform .15s;">▾</span>
          </div>
          <div class="servextra-detalle" style="display:none; padding:0 14px 14px; border-top:1px solid var(--border); background:#faf9f6;">
            <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; padding-top:12px; font-size:13px;">
              <div><span style="color:var(--gray-400); font-size:11px; text-transform:uppercase; display:block;">Proyecto</span>${p.proyecto_nombre || '—'}</div>
              <div><span style="color:var(--gray-400); font-size:11px; text-transform:uppercase; display:block;">Cliente</span>${p.cliente || '—'}</div>
              <div><span style="color:var(--gray-400); font-size:11px; text-transform:uppercase; display:block;">Comercial</span>${p.comercial || '—'}</div>
              <div><span style="color:var(--gray-400); font-size:11px; text-transform:uppercase; display:block;">Estado</span>${p.estado || '—'}</div>
              <div><span style="color:var(--gray-400); font-size:11px; text-transform:uppercase; display:block;">Hora entrega</span>${p.entrega_hora || '—'}</div>
              <div><span style="color:var(--gray-400); font-size:11px; text-transform:uppercase; display:block;">Recogida</span>${p.recogida_fecha ? (p.recogida_fecha + (p.recogida_hora ? ' ' + p.recogida_hora : '')) : '—'}</div>
              <div style="grid-column:1/-1;"><span style="color:var(--gray-400); font-size:11px; text-transform:uppercase; display:block;">Ubicación</span>${p.localizacion || '—'}</div>
            </div>
            <div style="overflow-x:auto; margin-top:12px;"><table style="background:#fff;"><thead><tr><th>Servicio</th><th>Cant.</th><th>Importe</th></tr></thead><tbody>${filasDetalle}</tbody></table></div>
            ${p.google_maps_url ? `<a href="${p.google_maps_url}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="display:inline-flex; align-items:center; gap:6px; margin-top:12px; font-size:13px; font-weight:600; color:var(--accent-dark); text-decoration:none;">📍 Ver ubicación en Maps</a>` : ''}
          </div>
        </div>
      `;
    }).join('');
    return `
      <div style="margin-bottom:1.5rem;">
        <p style="font-size:13px; font-weight:600; color:var(--accent-dark); text-transform:uppercase; letter-spacing:.5px; margin:0 0 8px;">${etiquetaDiaServExtra(dia.dias_desde_hoy, dia.fecha_iso)}</p>
        ${tarjetas}
      </div>
    `;
  }).join('');
  body.innerHTML = alertasHtml + filtroHtml + bloques;
}

// ================================================================
// INICIO — Logística. Página de aterrizaje del rol Logistica: aviso de
// servicios sensibles (nocturnidad/domingo) próximos, resumen de
// preparación de hoy/mañana y accesos rápidos al resto del apartado.
// ================================================================
async function cargarResumenLogistica() {
  document.getElementById('content-title').textContent = 'Logística · Inicio';
  const body = document.getElementById('content-body');
  body.innerHTML = '<p class="loading-text">Cargando...</p>';
  try {
    const [prep, extra] = await Promise.all([
      fetch('/api/preparacion?vista=almacen').then(r => r.json()),
      fetch('/api/logistica/servicios-extra').then(r => r.json())
    ]);
    if (prep.error) { body.innerHTML = '<p class="loading-text">Error: ' + prep.error + '</p>'; return; }
    actualizarIndicadorFecha(prep.ultima_actualizacion);
    pintarResumenLogistica(prep, extra);
  } catch (err) { body.innerHTML = '<p class="loading-text">Error de conexión</p>'; }
}
function pintarResumenLogistica(prep, extra) {
  const body = document.getElementById('content-body');
  const hoy = new Date();
  const saludo = usuarioActual.nombre ? ('Hola, ' + usuarioActual.nombre.split(' ')[0]) : 'Hola';
  const fechaTexto = hoy.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });

  const resumenHoy = (prep.resumen_periodos || []).find(r => r.periodo === 'HOY') || { listos: 0, total: 0 };
  const resumenManana = (prep.resumen_periodos || []).find(r => r.periodo === 'MAÑANA') || { listos: 0, total: 0 };

  const extraOk = extra && !extra.error;
  const totalExtra = extraOk ? extra.total : 0;
  const contadorTipo = {};
  if (extraOk) extra.por_dia.forEach(d => d.proyectos.forEach(p => p.servicios.forEach(s => { contadorTipo[s.servicio] = (contadorTipo[s.servicio] || 0) + 1; })));
  const destacados = ['nocturnidad', 'domingo'];
  const avisos = Object.keys(contadorTipo).filter(t => destacados.some(d => t.toLowerCase().includes(d)));

  const previewExtra = (extraOk ? extra.por_dia : []).slice(0, 3).map(dia => {
    const chips = dia.proyectos.slice(0, 4).map(p => {
      const badge = servicioExtraBadge(p.servicios[0].servicio);
      const etiquetaServicios = p.servicios.map(s => s.servicio).join(' + ');
      return `<span style="background:${badge.bg}; color:${badge.fg}; font-size:11px; font-weight:700; padding:2px 8px; border-radius:10px; margin-right:4px; display:inline-block; margin-bottom:4px;">${badge.icon} ${etiquetaServicios} — ${p.cliente || 'sin cliente'}</span>`;
    }).join('');
    return `<div style="margin-bottom:10px;"><p style="font-size:12px; font-weight:600; color:var(--gray-500); margin:0 0 4px;">${etiquetaDiaServExtra(dia.dias_desde_hoy, dia.fecha_iso)}</p>${chips}</div>`;
  }).join('') || '<p class="loading-text" style="padding:0.5rem 0;">Sin servicios extra en los próximos días.</p>';

  const tarjeta = (icon, titulo, desc, onclick) => `
    <div onclick="${onclick}" style="cursor:pointer; background:#fff; border:1px solid var(--border); border-radius:10px; padding:1.25rem; transition:box-shadow .15s;" onmouseover="this.style.boxShadow='0 2px 10px rgba(0,0,0,.06)'" onmouseout="this.style.boxShadow='none'">
      <div style="font-size:26px; margin-bottom:8px;">${icon}</div>
      <p style="font-size:14px; font-weight:600; margin:0 0 4px; color:var(--text-primary);">${titulo}</p>
      <p style="font-size:12px; color:var(--gray-400); margin:0;">${desc}</p>
    </div>
  `;

  body.innerHTML = `
    <div style="margin-bottom:1.5rem;">
      <p style="font-family:'Playfair Display',serif; font-size:24px; font-weight:700; margin:0 0 2px;">${saludo} 👋</p>
      <p style="font-size:13px; color:var(--gray-400); text-transform:capitalize;">${fechaTexto}</p>
    </div>

    ${avisos.length ? `
    <div style="background:#FCEBEB; border:1px solid #f0c9c9; border-radius:8px; padding:0.85rem 1rem; margin-bottom:0.75rem; font-size:13px; color:#A32D2D;">
      ⚠️ Hay servicios con ${avisos.join(' y ')} en los próximos 15 días — revísalos en "Servicios Extra" para tenerlos en cuenta en la ruta.
    </div>` : ''}
    ${extraOk && extra.alertas && extra.alertas.length ? `
    <div style="background:#FCEBEB; border:1px solid #f0c9c9; border-radius:8px; padding:0.85rem 1rem; margin-bottom:1.5rem; font-size:13px; color:#A32D2D; cursor:pointer;" onclick="marcarMenuActivo('menu-item-log-servicios-extra'); cargarServiciosExtra();">
      ⚠️ ${extra.alertas.length} entrega(s)/recogida(s) en domingo o festivo sin servicio Domingo/Festivo dado de alta — ver en "Servicios Extra" →
    </div>` : ''}

    <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:1.75rem;">
      <div style="background:#f7f6f2; border-radius:8px; padding:1rem;">
        <p style="font-size:11px; color:var(--gray-400); text-transform:uppercase; margin:0 0 6px;">Listos para hoy</p>
        <p style="font-size:22px; font-weight:700; margin:0;">${resumenHoy.listos} / ${resumenHoy.total}</p>
      </div>
      <div style="background:#f7f6f2; border-radius:8px; padding:1rem;">
        <p style="font-size:11px; color:var(--gray-400); text-transform:uppercase; margin:0 0 6px;">Listos para mañana</p>
        <p style="font-size:22px; font-weight:700; margin:0;">${resumenManana.listos} / ${resumenManana.total}</p>
      </div>
      <div style="background:#f7f6f2; border-radius:8px; padding:1rem;">
        <p style="font-size:11px; color:var(--gray-400); text-transform:uppercase; margin:0 0 6px;">Servicios extra (15 días)</p>
        <p style="font-size:22px; font-weight:700; margin:0;">${totalExtra}</p>
      </div>
    </div>

    <p style="font-size:14px; font-weight:600; margin:0 0 10px;">Próximos servicios extra</p>
    <div style="background:#fff; border:1px solid var(--border); border-radius:10px; padding:1rem 1.25rem; margin-bottom:1.75rem;">${previewExtra}</div>

    <p style="font-size:14px; font-weight:600; margin:0 0 10px;">Accesos rápidos</p>
    <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px;">
      ${tarjeta('🚨', 'Servicios Extra', 'Próximos 15 días', "marcarMenuActivo('menu-item-log-servicios-extra'); cargarServiciosExtra();")}
      ${tarjeta('📦', 'Preparación', 'Almacén, Lavandería, Office', "marcarMenuActivo('menu-item-log-preparacion'); cargarPreparacion('almacen');")}
      ${tarjeta('🚗', 'Servicios Isabella', 'Registrar servicio al grupo Isabella', "marcarMenuActivo('menu-item-log-isabella'); cargarIsabellaServicios();")}
      ${tarjeta('🧭', 'App de Rutas', 'Se abre en pestaña nueva (PIN)', "window.open('/rutas.html','_blank');")}
    </div>
  `;
}

function isabellaEsAdmin() { return usuarioActual.rol === 'Direccion' || usuarioActual.rol === 'Contabilidad'; }
let ISABELLA_TAB = 'calc';
let ISABELLA_LAST_LIST = [];
let isabellaCalcTimer = null;

function cargarIsabellaServicios() {
  document.getElementById('content-title').textContent = 'Logística · Servicios Isabella';
  ISABELLA_TAB = 'calc';

function cambiarPestanaIsabella(tab) {
  ISABELLA_TAB = tab;

function renderIsabellaTab() {

  else if (ISABELLA_TAB === 'tarifas') renderIsabellaTarifas();
}

// Desplegable de la flota fija de ORUM (misma lista que ya usa Facturas
// Proveedores) + "Otro" para escribir el vehículo a mano cuando no es de la
// flota propia (coche de una empresa Isabella, alquilado puntual, etc.).
function isabellaOnVehiculoSelect() {
  const sel = document.getElementById('ir-vehnombre-select');
  const input = document.getElementById('ir-vehnombre');
  if (sel.value === '__otro__') {
    input.style.display = '';
    input.value = '';
    input.focus();
  } else {
    input.style.display = 'none';
    input.value = sel.value;
  }
}
function isabellaToggleTipo(prefix) {
  const tipo = document.getElementById(prefix + '-tiposervicio').value; // 'vehiculo' | 'personal' | 'combustible'
  const esVehiculo = tipo === 'vehiculo';
  const esCombustible = tipo === 'combustible';
  const fVeh = document.getElementById(prefix + '-field-vehiculo');
  const fKm = document.getElementById(prefix + '-field-km');
  const fLitros = document.getElementById(prefix + '-field-litros');
  const fVehNombre = document.getElementById(prefix + '-field-vehnombre');
  const fHoras = document.getElementById(prefix + '-field-horas');
  const fPersonas = document.getElementById(prefix + '-field-personas');
  if (fVeh) fVeh.style.display = esVehiculo ? '' : 'none';
  if (fKm) fKm.style.display = esVehiculo ? '' : 'none';
  if (fLitros) fLitros.style.display = esCombustible ? '' : 'none';
  // El nombre del vehículo también aplica a Combustible (para anotar qué coche se repostó).
  if (fVehNombre) fVehNombre.style.display = (esVehiculo || esCombustible) ? '' : 'none';
  if (fHoras) fHoras.style.display = esCombustible ? 'none' : '';
  if (fPersonas) fPersonas.style.display = esCombustible ? 'none' : '';
  if (!esVehiculo) { const kmEl = document.getElementById(prefix + '-km'); if (kmEl) kmEl.value = 0; }
  if (!esCombustible) { const lEl = document.getElementById(prefix + '-litros'); if (lEl) lEl.value = 0; }
  if (esCombustible) {
    const hEl = document.getElementById(prefix + '-horas'); if (hEl) hEl.value = 0;
    const pEl = document.getElementById(prefix + '-personas'); if (pEl) pEl.value = 1;
  }
}
function calcularIsabella() {
  clearTimeout(isabellaCalcTimer);
  isabellaCalcTimer = setTimeout(async () => {
    const tipo = document.getElementById('ic-tiposervicio').value;
    const vehTipo = tipo === 'vehiculo' ? parseInt(document.getElementById('ic-vehiculo').value) : 0;
    const km = tipo === 'vehiculo' ? (parseFloat(document.getElementById('ic-km').value) || 0) : 0;
    const horas = tipo === 'combustible' ? 0 : (parseFloat(document.getElementById('ic-horas').value) || 0);
    const personas = tipo === 'combustible' ? 1 : (parseInt(document.getElementById('ic-personas').value) || 1);
    const litros = tipo === 'combustible' ? (parseFloat(document.getElementById('ic-litros').value) || 0) : 0;
    try {
      const resp = await fetch('/api/isabella/calcular', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tipo, vehTipo, km, horas, personas, litros }) });
      const data = await resp.json();
      if (data.error) { document.getElementById('ic-total').innerHTML = 'Error al calcular'; return; }
      document.getElementById('ic-total').innerHTML = euros(data.importe) + ' <span style="font-size:14px; font-weight:400; color:var(--gray-400);">importe a facturar</span>';
      if (data.combustible !== undefined) {
        const bd = document.getElementById('ic-breakdown');
        bd.style.display = 'grid';
        bd.innerHTML = tipo === 'combustible'
          ? `<div style="background:#fff; border:1px solid var(--border); border-radius:8px; padding:10px 12px;"><div style="font-size:11px; color:var(--gray-400); text-transform:uppercase;">Combustible (${litros} L)</div><div style="font-size:15px; font-weight:600;">${euros(data.combustible)}</div></div>`
          : `
          <div style="background:#fff; border:1px solid var(--border); border-radius:8px; padding:10px 12px;"><div style="font-size:11px; color:var(--gray-400); text-transform:uppercase;">Combustible</div><div style="font-size:15px; font-weight:600;">${euros(data.combustible)}</div></div>
          <div style="background:#fff; border:1px solid var(--border); border-radius:8px; padding:10px 12px;"><div style="font-size:11px; color:var(--gray-400); text-transform:uppercase;">Desgaste vehículo</div><div style="font-size:15px; font-weight:600;">${euros(data.desgaste)}</div></div>
          <div style="background:#fff; border:1px solid var(--border); border-radius:8px; padding:10px 12px;"><div style="font-size:11px; color:var(--gray-400); text-transform:uppercase;">Mano de obra</div><div style="font-size:15px; font-weight:600;">${euros(data.manoObra)}</div></div>
          <div style="background:#fff; border:1px solid var(--border); border-radius:8px; padding:10px 12px;"><div style="font-size:11px; color:var(--gray-400); text-transform:uppercase;">Coste real</div><div style="font-size:15px; font-weight:600;">${euros(data.costeNOE)}</div></div>
        `;
      }
    } catch (err) { document.getElementById('ic-total').innerHTML = 'Error de conexión'; }
  }, 200);
}

async function isabellaCargarTabla() {
  const wrap = document.getElementById('ir-tabla-wrap');
  wrap.innerHTML = '<p class="loading-text">Cargando...</p>';
  const empresa = document.getElementById('ir-filtro-empresa').value;
  const todos = document.getElementById('ir-filtro-todos').checked;
  const mes = todos ? '' : document.getElementById('ir-filtro-mes').value;
  document.getElementById('ir-filtro-mes').disabled = todos;
  try {
    const params = new URLSearchParams();
    if (empresa) params.set('empresa', empresa);
    if (mes) params.set('mes', mes);
    const resp = await fetch('/api/isabella/servicios?' + params.toString());
    const data = await resp.json();
    if (data.error) { wrap.innerHTML = '<p class="loading-text">Error: ' + data.error + '</p>'; return; }
    ISABELLA_LAST_LIST = data.data || [];
    isabellaPintarTabla(ISABELLA_LAST_LIST);
  } catch (err) { wrap.innerHTML = '<p class="loading-text">Error de conexión</p>'; }
}
function isabellaVehLabel(t) { return t == 1 ? 'Camión Azul' : t == 2 ? 'Camión 3.500 Kg' : t == 3 ? 'Furgoneta' : 'Sin vehículo'; }
// Combustible (repostaje) puede llevar vehNombre sin vehTipo (no es un camión propio de ORUM) — se prioriza el nombre si existe.
function isabellaVehCelda(s) { return s.vehNombre || (Number(s.vehTipo) > 0 ? isabellaVehLabel(s.vehTipo) : 'Sin vehículo'); }
function isabellaFmtFecha(iso) { const p = String(iso).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso; }
function isabellaPintarTabla(list) {

  if (!list.length) { wrap.innerHTML = '<p class="loading-text">Todavía no hay servicios registrados.</p>'; return; }

  const filas = list.slice().sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)) || b.id - a.id).map(s => `

      ${admin ? `<td>${euros(s.costeNOE)}</td><td>${euros(s.beneficio)}</td><td><button onclick="isabellaBorrarServicio('${s.id}')" style="background:#fff; color:#A32D2D; border:1px solid #edd0d0; border-radius:4px; padding:4px 8px; font-size:11px; cursor:pointer;">Eliminar</button></td>` : ''}

      ${admin ? '<th>Coste real</th><th>Beneficio</th><th></th>' : ''}
    </tr></thead><tbody>${filas}</tbody></table>
    </div>
  `;
}
async function isabellaAnadirServicio() {
  const fecha = document.getElementById('ir-fecha').value;
  if (!fecha) { alert('Indica la fecha del servicio.'); return; }
  const tipo = document.getElementById('ir-tiposervicio').value;
  const esVehiculo = tipo === 'vehiculo';
  const esCombustible = tipo === 'combustible';
  const payload = {
    fecha, tipo, empresa: document.getElementById('ir-empresa').value, pedido: document.getElementById('ir-pedido').value.trim(),
    vehNombre: (esVehiculo || esCombustible) ? document.getElementById('ir-vehnombre').value.trim() : '',
    vehTipo: esVehiculo ? parseInt(document.getElementById('ir-vehiculo').value) : 0,
    personal: document.getElementById('ir-personal').value.trim(),
    personas: esCombustible ? 1 : (parseInt(document.getElementById('ir-personas').value) || 1),
    km: esVehiculo ? (parseFloat(document.getElementById('ir-km').value) || 0) : 0,
    litros: esCombustible ? (parseFloat(document.getElementById('ir-litros').value) || 0) : 0,
    horas: esCombustible ? 0 : (parseFloat(document.getElementById('ir-horas').value) || 0),
    desc: document.getElementById('ir-desc').value.trim()
  };
  const btn = document.getElementById('ir-add-btn');
  const estado = document.getElementById('ir-add-estado');
  btn.disabled = true; estado.textContent = 'Guardando…'; estado.style.color = 'var(--gray-400)';
  try {
    const resp = await fetch('/api/isabella/servicios', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const data = await resp.json();
    if (data.error) { estado.textContent = 'Error: ' + data.error; estado.style.color = '#A32D2D'; return; }
    estado.textContent = '✓ Guardado'; estado.style.color = '#27500A';
    ['ir-pedido', 'ir-vehnombre', 'ir-personal', 'ir-desc'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('ir-vehnombre-select').value = '';
    document.getElementById('ir-vehnombre').style.display = 'none';
    document.getElementById('ir-personas').value = 1;
    document.getElementById('ir-km').value = 0;
    document.getElementById('ir-litros').value = 0;
    document.getElementById('ir-horas').value = 0;
    isabellaCargarTabla();
  } catch (err) { estado.textContent = 'Error de conexión'; estado.style.color = '#A32D2D'; }
  finally { btn.disabled = false; }
}
async function isabellaBorrarServicio(id) {
  if (!confirm('¿Eliminar este servicio del registro?')) return;
  try {
    const resp = await fetch('/api/isabella/servicios/' + id, { method: 'DELETE' });
    const data = await resp.json();
    if (data.error) { alert('No se pudo eliminar: ' + data.error); return; }
    isabellaCargarTabla();
  } catch (err) { alert('Error de conexión'); }
}
// Copia los datos de un servicio ya registrado al formulario de alta, dejando
// solo la fecha vacía y con el foco puesto ahí — para repetir el mismo
// servicio varios días (p.ej. un trabajador varios días en otra empresa)
// sin tener que rellenar todo de nuevo, solo cambiar el día y "Añadir".
function isabellaDuplicarServicio(id) {
  const s = ISABELLA_LAST_LIST.find(x => String(x.id) === String(id));
  if (!s) return;
  document.getElementById('ir-empresa').value = s.empresa;
  document.getElementById('ir-pedido').value = s.pedido || '';
  document.getElementById('ir-tiposervicio').value = s.tipo || 'vehiculo';
  isabellaToggleTipo('ir');
  const sel = document.getElementById('ir-vehnombre-select');
  const inp = document.getElementById('ir-vehnombre');
  if (s.vehNombre) {
    const opt = Array.from(sel.options).find(o => o.value === s.vehNombre);
    if (opt) { sel.value = s.vehNombre; inp.style.display = 'none'; inp.value = ''; }
    else { sel.value = '__otro__'; inp.style.display = ''; inp.value = s.vehNombre; }
  } else {
    sel.value = ''; inp.style.display = 'none'; inp.value = '';
  }
  if (s.tipo === 'vehiculo') document.getElementById('ir-vehiculo').value = s.vehTipo || 2;
  document.getElementById('ir-personal').value = s.personal || '';
  document.getElementById('ir-personas').value = s.personas || 1;
  document.getElementById('ir-km').value = s.km || 0;
  document.getElementById('ir-litros').value = s.litros || 0;
  document.getElementById('ir-horas').value = s.horas || 0;
  document.getElementById('ir-desc').value = s.desc || '';
  const fecha = document.getElementById('ir-fecha');
  fecha.value = '';
  fecha.scrollIntoView({ behavior: 'smooth', block: 'center' });
  fecha.focus();
  const estado = document.getElementById('ir-add-estado');
  estado.textContent = 'Datos copiados — elige la fecha y pulsa "Añadir al registro"';
  estado.style.color = 'var(--gray-400)';
}
function isabellaExportarCSV() {
  const headers = ['Fecha', 'Empresa', 'Pedido', 'Vehiculo', 'Personal', 'NumPersonas', 'Km', 'Litros', 'HorasPorPersona', 'ImporteACobrar', 'Descripcion'];
  const rows = ISABELLA_LAST_LIST.map(s => [s.fecha, s.empresa, s.pedido, isabellaVehCelda(s), s.personal, s.personas || 1, s.km, s.tipo === 'combustible' ? s.litros : '', s.horas, Number(s.importe).toFixed(2), (s.desc || '').replace(/;/g, ',')]);
  const csv = headers.join(';') + '\n' + rows.map(r => r.join(';')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'servicios_isabella.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

async function isabellaGenerarInforme() {
  const empresa = document.getElementById('ii-empresa').value;
  const mes = document.getElementById('ii-mes').value;
  const wrap = document.getElementById('ii-report');
  if (!mes) { alert('Selecciona un mes.'); return; }
  wrap.innerHTML = '<p class="loading-text">Cargando...</p>';
  try {
    const resp = await fetch('/api/isabella/servicios?empresa=' + encodeURIComponent(empresa));
    const data = await resp.json();
    if (data.error) { wrap.innerHTML = '<p class="loading-text">Error: ' + data.error + '</p>'; return; }
    const todos = data.data || [];
    const list = todos.filter(s => String(s.fecha).startsWith(mes)).sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)));
    if (!list.length) {
      if (!todos.length) { wrap.innerHTML = `<p class="loading-text">Todavía no hay ningún servicio registrado para ${empresa}.</p>`; return; }

      return;
    }
    const total = list.reduce((a, s) => a + Number(s.importe), 0);
    const [y, m] = mes.split('-');
    const nombreMes = new Date(y, m - 1, 1).toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
    const filas = list.map(s => `

      <p style="font-size:13px; color:var(--gray-400); margin:0 0 14px;">Servicios logísticos y de personal prestados por ORUM Rent &amp; Events a ${empresa}.</p>
      <div style="overflow-x:auto;"><table><thead><tr><th>Fecha</th><th>Pedido</th><th>Vehículo</th><th>Personal</th><th>Nº pers.</th><th>Km</th><th>Litros</th><th>Horas/pers.</th><th>Importe</th><th>Descripción</th></tr></thead><tbody>${filas}</tbody></table></div>
      <div style="margin-top:16px; background:#1a1a18; color:#fff; border-radius:8px; padding:16px; max-width:320px;">
        <div style="font-size:11px; color:#cbb98a; text-transform:uppercase;">Total a facturar a ${empresa}</div>
        <div style="font-size:22px; font-weight:700;">${euros(total)}</div>
      </div>

        <button onclick="window.print()" style="padding:8px 16px; border-radius:4px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:13px;">Imprimir / Guardar PDF</button>
      </div>
    `;
  } catch (err) { wrap.innerHTML = '<p class="loading-text">Error de conexión</p>'; }
}

function donutSVG(segmentos, size) {
  size = size || 140;
  const total = segmentos.reduce((s, x) => s + x.valor, 0);
  const r = size / 2 - 14, cx = size / 2, cy = size / 2, circ = 2 * Math.PI * r;
  if (total === 0) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="18"/></svg>`;
  }
  let acc = 0;
  const arcos = segmentos.filter(s => s.valor > 0).map(s => {
    const frac = s.valor / total;
    const dash = frac * circ;
    const offset = -acc * circ;
    acc += frac;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="18" stroke-dasharray="${dash} ${circ - dash}" stroke-dashoffset="${offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcos}<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" font-size="22" font-weight="600" fill="#1a1a18">${total}</text></svg>`;
}
function leyendaDonut(segmentos) {
  return segmentos.map(s => `
    <div style="display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:6px;">
      <span style="width:10px; height:10px; border-radius:50%; background:${s.color}; flex-shrink:0;"></span>
      <span style="flex:1; color:var(--text-secondary);">${s.etiqueta}</span>
      <span style="font-weight:600;">${s.valor}</span>
    </div>
  `).join('');
}
const NOMBRES_MES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
function evolucionMensualPresupuestos(presupuestos) {
  const hoy = new Date();
  const anio = hoy.getFullYear();
  const meses = [];
  for (let m = 0; m <= 11; m++) {
    meses.push({ label: NOMBRES_MES[m], mes: m, emitidos: 0, aceptados: 0, cancelados: 0 });
  }
  presupuestos.forEach(p => {
    if (!p.fecha_emision) return;
    const partes = String(p.fecha_emision).split('/'); // dd/MM/yyyy
    if (partes.length !== 3) return;
    const mesPresu = parseInt(partes[1], 10) - 1;
    const anioPresu = parseInt(partes[2], 10);
    if (anioPresu !== anio || mesPresu < 0 || mesPresu > 11) return;
    const bucket = meses[mesPresu];
    bucket.emitidos++;
    if (p.semaforo === 'ganado') bucket.aceptados++;
    else if (p.semaforo === 'perdido') bucket.cancelados++;
  });
  return meses;
}
function graficoBarrasMensuales(meses) {
  const alturaMax = 130;
  const maxVal = Math.max(1, ...meses.flatMap(m => [m.emitidos, m.aceptados, m.cancelados]));
  return `
    <div style="display:flex; align-items:flex-end; gap:10px; height:${alturaMax + 26}px; overflow-x:auto;">
      ${meses.map(m => `
        <div style="display:flex; flex-direction:column; align-items:center; gap:4px; min-width:44px;">
          <div style="display:flex; align-items:flex-end; gap:3px; height:${alturaMax}px;" title="${m.label}: ${m.emitidos} emitidos, ${m.aceptados} aceptados, ${m.cancelados} cancelados">
            <div style="width:11px; background:#9a988f; height:${Math.max(2, Math.round(m.emitidos / maxVal * alturaMax))}px; border-radius:2px 2px 0 0;"></div>
            <div style="width:11px; background:#4c8c1f; height:${Math.max(2, Math.round(m.aceptados / maxVal * alturaMax))}px; border-radius:2px 2px 0 0;"></div>
            <div style="width:11px; background:#A32D2D; height:${Math.max(2, Math.round(m.cancelados / maxVal * alturaMax))}px; border-radius:2px 2px 0 0;"></div>
          </div>
          <div style="font-size:11px; color:var(--text-muted);">${m.label}</div>
        </div>
      `).join('')}
    </div>
    <div style="display:flex; gap:16px; margin-top:10px; font-size:12px; justify-content:center;">
      <span><span style="display:inline-block;width:9px;height:9px;background:#9a988f;border-radius:2px;margin-right:5px;"></span>Emitidos</span>
      <span><span style="display:inline-block;width:9px;height:9px;background:#4c8c1f;border-radius:2px;margin-right:5px;"></span>Aceptados</span>
      <span><span style="display:inline-block;width:9px;height:9px;background:#A32D2D;border-radius:2px;margin-right:5px;"></span>Cancelados</span>
    </div>
  `;
}

async function cargarPresupuestos() {
  document.getElementById('content-title').textContent = 'Comercial · Presupuestos';
  const body = document.getElementById('content-body');
  body.innerHTML = '<p class="loading-text">Cargando presupuestos...</p>';

    const data = await resp.json();
    if (data.error) { body.innerHTML = '<p class="loading-text">Error: ' + data.error + '</p>'; return; }
    actualizarIndicadorFecha(data.ultima_actualizacion);
    pintarPresupuestos(data.data);

    body.innerHTML = '<p class="loading-text">Error de conexión</p>';
  }

function cambiarOrdenPresupuestos(campo) {
  if (ordenPresupuestos.campo === campo) ordenPresupuestos.asc = !ordenPresupuestos.asc;

function flechaOrdenPresupuestos(campo) {

function pintarPresupuestos(presupuestos) {

  // Lo ganado ya no es pipeline, es facturación cerrada; lo perdido no cuenta.
  const importePipeline = presupuestos.filter(p => ['verde', 'amarillo', 'rojo', 'negro'].includes(p.semaforo))
    .reduce((s, p) => s + (parseFloat(p.importe_sin_iva) || 0), 0);

  const perdidos = presupuestos.filter(p => p.semaforo === 'perdido').length;

  const pendientes = presupuestos.filter(p => ['verde', 'amarillo', 'rojo'].includes(p.semaforo));

  window.presupuestosOriginales = presupuestosListado;

      <div style="flex:1; min-width:160px; background:#fff; border:1px solid ${grupoPresupuestos === 'caducados' ? 'var(--accent, #1a1a18)' : 'var(--border)'}; border-width:${grupoPresupuestos === 'caducados' ? '2px' : '1px'}; border-radius:4px; padding:1rem; cursor:pointer;" onclick="filtrarPresupuestosPorGrupo('caducados')">

let grupoPresupuestos = null; // null | 'pendientes' | 'caducados'
function filtrarPresupuestosPorGrupo(grupo) {
  grupoPresupuestos = (grupoPresupuestos === grupo) ? null : grupo; // pulsar 2 veces quita el filtro

}
function aplicarFiltrosPresupuestos(presupuestos) {
  const texto = (document.getElementById('buscador-presupuestos')?.value || '').toLowerCase();
  const estado = document.getElementById('filtro-estado-presupuestos').value;
  const comercial = document.getElementById('filtro-comercial-presupuestos')?.value || '';
  const desde = document.getElementById('filtro-fecha-desde-presupuestos')?.value || '';
  const hasta = document.getElementById('filtro-fecha-hasta-presupuestos')?.value || '';
  const verComercial = usuarioActual.rol !== 'Comercial';
  let filtrados = presupuestos.filter(p => {
    const coincideTexto = (p.cliente || '').toLowerCase().includes(texto) || String(p.numero_proyecto || '').includes(texto);
    const coincideEstado = !estado || p.estado === estado;
    const coincideComercial = !comercial || p.comercial === comercial;
    let coincideFecha = true;
    if ((desde || hasta) && p.evento_inicio) {
      const [fParte] = p.evento_inicio.split(' ');
      const [d, m, a] = fParte.split('/');
      const fechaEvento = `${a}-${m}-${d}`;
      if (desde && fechaEvento < desde) coincideFecha = false;
      if (hasta && fechaEvento > hasta) coincideFecha = false;
    } else if (desde || hasta) {
      coincideFecha = false;
    }
    return coincideTexto && coincideEstado && coincideComercial && coincideFecha;
  });
  if (grupoPresupuestos === 'pendientes') filtrados = filtrados.filter(p => ['verde', 'amarillo', 'rojo'].includes(p.semaforo));
  else if (grupoPresupuestos === 'caducados') filtrados = filtrados.filter(p => p.semaforo === 'negro');

  document.getElementById('tabla-presupuestos-body').innerHTML = filtrados.map(p => filaPresupuesto(p, verComercial)).join('');
}
function filaPresupuesto(p, verComercial) {

  const caduca = yaDecidido ? '—' : ((p.dias_restantes === null || p.dias_restantes === undefined) ? '—' : p.dias_restantes);
  return `
    <tr>
      <td style="text-align:center; width:28px;">${p.proyecto_id ? `<button class="btn-material" onclick="abrirModalMaterialProyecto('${p.proyecto_id}', '${String(p.numero_proyecto || '').replace(/'/g, "\\'")}')" title="Ver material y servicios">&#128230;</button>` : ''}</td>
      <td class="celda-copiable" onclick="copiarAlPortapapeles('${p.numero_proyecto || ''}', event)" title="Clic para copiar">${p.numero_proyecto || ''}</td>
      <td>${p.cliente || ''}</td>
      ${verComercial ? `<td>${p.comercial || ''}</td>` : ''}
      <td>${(p.fecha_emision || '').split(' ')[0]}</td>
      <td>${(p.evento_inicio || '').split(' ')[0]}</td>
      <td style="width:56px;">${badgeSemaforo(p.semaforo)} ${caduca}</td>
      <td><span class="badge ${badgeClase}">${p.estado || ''}</span></td>
      <td style="text-align:right;">${formatearEuros(p.importe_sin_iva)}</td>
    </tr>
  `;
}
