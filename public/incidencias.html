<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ORUM Incidencias</title>
<link rel="manifest" href="/movil.webmanifest?v=2">
<meta name="theme-color" content="#1a1a18">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-orum.png?v=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f7f6f2; color: #1a1a18; min-height: 100vh; }
button, input, select, textarea { font-family: inherit; }
.oculto { display: none !important; }
.cab { background: #1a1a18; color: #fff; padding: calc(12px + env(safe-area-inset-top)) 16px 10px; position: sticky; top: 0; z-index: 10; }
.cab-top { display: flex; align-items: center; gap: 10px; }
.cab h1 { font-size: 16px; font-weight: 600; flex: 1; }
.cab button { background: transparent; border: 0.5px solid rgba(255,255,255,.3); color: rgba(255,255,255,.85); font-size: 12.5px; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
.cab button.nueva { background: #D85A30; border-color: #D85A30; color: #fff; font-weight: 600; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-top: 8px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: none; background: transparent; color: rgba(255,255,255,.65); font-size: 13.5px; padding: 7px 12px; border-radius: 6px; white-space: nowrap; flex-shrink: 0; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.tabs button.on { background: rgba(255,255,255,.15); color: #fff; font-weight: 600; }
.badge { background: #D93025; color: #fff; font-size: 11px; font-weight: 700; min-width: 19px; height: 19px; border-radius: 10px; padding: 0 5px; display: inline-flex; align-items: center; justify-content: center; }
.cuerpo { padding: 12px 16px 32px; max-width: 760px; margin: 0 auto; }
.cargando { text-align: center; padding: 3rem 1rem; color: #6b6a64; font-size: 14px; }
.vacio { text-align: center; color: #9a988f; font-size: 14px; padding: 2.5rem 1rem; }
.filtros { display: flex; gap: 8px; margin-bottom: 12px; }
.filtros input, .filtros select { flex: 1; min-width: 0; padding: 10px 12px; font-size: 15px; border: 0.5px solid #d8d4c8; border-radius: 10px; background: #fff; }
.filtros select { flex: 0 0 auto; max-width: 45%; }
.tarjeta { background: #fff; border: 0.5px solid #e2e2de; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.tarjeta.click { cursor: pointer; }
.tarjeta.click:active { background: #faf9f5; }
.tarjeta.urg { border-left: 4px solid #D93025; }
.t-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.t-txt { font-size: 15px; font-weight: 600; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.t-sub { font-size: 12.5px; color: #6b6a64; margin-top: 4px; line-height: 1.45; }
.etq { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
.etq.abierta { background: #FAEEDA; color: #854F0B; } .etq.en_curso { background: #E6F1FB; color: #185FA5; } .etq.resuelta { background: #E1F5EE; color: #0F6E56; }
.etq.urgente { background: #FCEBEB; color: #A32D2D; } .etq.tipo { background: #f0efe9; color: #5f5e5a; }
.etqs { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
/* Formulario */
.campo { margin-bottom: 14px; }
.campo > label { display: block; font-size: 12.5px; font-weight: 600; color: #5f5e5a; margin-bottom: 6px; }
.campo textarea, .campo input[type=text], .campo select { width: 100%; padding: 11px 12px; font-size: 16px; border: 0.5px solid #d8d4c8; border-radius: 10px; background: #fff; }
.campo textarea { min-height: 96px; resize: vertical; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { border: 0.5px solid #d8d4c8; background: #fff; color: #1a1a18; font-size: 14px; padding: 8px 12px; border-radius: 18px; cursor: pointer; }
.chips button.on { background: #1a1a18; color: #fff; border-color: #1a1a18; font-weight: 600; }
.chips button.on.urg { background: #D93025; border-color: #D93025; }
.ayuda { font-size: 12.5px; color: #6b6a64; margin-top: 5px; min-height: 16px; }
.ayuda.mal { color: #A32D2D; } .ayuda.ok { color: #0F6E56; }
.fotos { display: flex; gap: 8px; flex-wrap: wrap; }
.fotos .mini { position: relative; width: 76px; height: 76px; border-radius: 8px; overflow: hidden; background: #e8e6df; }
.fotos .mini img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }
.fotos .mini button { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 11px; border: none; background: rgba(0,0,0,.6); color: #fff; font-size: 13px; line-height: 1; cursor: pointer; }
.fotos .anadir { width: 76px; height: 76px; border-radius: 8px; border: 1px dashed #b4b2a9; background: #fff; color: #6b6a64; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; }
.fotos .anadir b { font-size: 22px; font-weight: 400; line-height: 1; }
.btn { border: none; border-radius: 10px; padding: 12px 16px; font-size: 15px; font-weight: 600; cursor: pointer; }
.btn.pri { background: #1D9E75; color: #fff; } .btn.sec { background: #f0efe9; color: #1a1a18; } .btn.peli { background: #D85A30; color: #fff; }
.btn.ancho { width: 100%; }
.btn:disabled { opacity: .5; }
.error { color: #A32D2D; font-size: 13.5px; text-align: center; min-height: 18px; margin: 8px 0; }
/* Ficha */
.ficha-txt { font-size: 16px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
.datos { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13.5px; margin-top: 12px; padding-top: 12px; border-top: 0.5px solid #efeee9; }
.datos dt { color: #6b6a64; }
.datos dd { font-weight: 500; }
.solucion { margin-top: 12px; padding: 10px 12px; background: #E1F5EE; border-radius: 8px; font-size: 14px; color: #0F6E56; white-space: pre-wrap; }
.acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.acciones .btn { flex: 1; padding: 10px 12px; font-size: 14px; }
.sec-tit { font-size: 12px; font-weight: 600; color: #6b6a64; text-transform: uppercase; letter-spacing: .04em; margin: 18px 0 8px; }
.hist { position: relative; padding-left: 16px; }
.hist::before { content: ''; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 1px; background: #d8d4c8; }
.h-item { position: relative; margin-bottom: 12px; }
.h-item::before { content: ''; position: absolute; left: -16px; top: 5px; width: 9px; height: 9px; border-radius: 5px; background: #b4b2a9; }
.h-item.comentario::before { background: #1a1a18; } .h-item.estado::before { background: #1D9E75; }
.h-cab { font-size: 12px; color: #6b6a64; }
.h-cab b { color: #1a1a18; font-weight: 600; }
.h-txt { font-size: 14px; line-height: 1.4; margin-top: 2px; white-space: pre-wrap; word-wrap: break-word; }
.h-item .fotos { margin-top: 6px; }
.comentar textarea { width: 100%; min-height: 70px; padding: 10px 12px; font-size: 16px; border: 0.5px solid #d8d4c8; border-radius: 10px; background: #fff; resize: vertical; }
.comentar .fila { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; }
.comentar .fila .fotos { flex: 1; }
#visor { position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 50; display: flex; align-items: center; justify-content: center; }
#visor img { max-width: 100%; max-height: 100%; }
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a1a18; color: #fff; font-size: 13px; padding: 9px 16px; border-radius: 20px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; max-width: 90%; text-align: center; }
#toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="cab">
  <div class="cab-top">
    <button id="btn-volver" class="oculto">&lsaquo; Inicio</button>
    <h1 id="titulo">Incidencias</h1>
    <button id="btn-nueva" class="nueva oculto">+ Nueva</button>
  </div>
  <div class="tabs" id="tabs"></div>
</div>
<div class="cuerpo" id="cuerpo"><div class="cargando">Cargando…</div></div>
<input type="file" id="sel-fotos" accept="image/*" multiple class="oculto">
<div id="visor" class="oculto"><img alt=""></div>
<div id="toast"></div>

<script>
// Incidencias (oct 2026): crear, asignar y seguir hasta cerrarla. API en
// lib/incidencias.js. Misma pantalla en la app (/incidencias), en el panel
// (?embebido=1) y desde Rutas, Preparación, Mantenimiento y la ficha del
// vehículo, que la abren con ?nueva=1&proyecto=…&vehiculo=…&origen=…&volver=…
var PARAMS = new URLSearchParams(location.search);
var EMBEBIDO = PARAMS.get('embebido') === '1';
var VOLVER = PARAMS.get('volver');
var USUARIO = null, OPC = null, LISTA = [], vista = 'abiertas', filtroTipo = PARAMS.get('tipo') || '', filtroTexto = '';
var pantalla = 'lista', fichaId = null, desdeAcceso = false;
var fotosNueva = [], fotosComentario = [], destinoFotos = null, nueva = null;
var MAX_FOTOS = 5;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fecha(ts) { return ts ? new Date(ts).toLocaleString('es-ES', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : ''; }
function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(function () { t.classList.remove('show'); }, 2200); }
function leerJson(r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok || d.error) throw new Error(d.error || ('Error ' + r.status)); return d; }); }
function getJson(url) { return fetch(url).then(leerJson); }
function postJson(url, cuerpo) { return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo || {}) }).then(leerJson); }
function postForm(url, fd) { return fetch(url, { method: 'POST', body: fd }).then(leerJson); }
function etqEstado(e) { return '<span class="etq ' + e + '">' + esc(OPC.estados[e] || e) + '</span>'; }
function txtProyecto(p) { return p ? '#' + esc(p.numero) + (p.cliente ? ' · ' + esc(p.cliente) : '') : ''; }

// ── Entrada: sesión abierta o la llave del dispositivo de la app ──
function entrar() {
  fetch('/api/sesion').then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }).then(function (d) {
    if (d && d.usuario) return arrancar(d.usuario);
    var llave = ''; try { llave = localStorage.getItem('orum_movil_dispositivo') || ''; } catch (e) {}
    if (!llave) return location.replace(EMBEBIDO ? '/' : '/movil');
    fetch('/api/movil/dispositivo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dispositivo: llave }) })
      .then(function (r) { return r.json(); }).then(function (r) { if (r.ok) arrancar(r.usuario); else location.replace('/movil'); })
      .catch(function () { location.replace('/movil'); });
  });
}
function arrancar(u) {
  USUARIO = u;
  if (!EMBEBIDO) {
    var b = document.getElementById('btn-volver');
    b.classList.remove('oculto');
    if (VOLVER && VOLVER.charAt(0) === '/') b.innerHTML = '&lsaquo; Volver';
    b.onclick = function () { location.href = VOLVER && VOLVER.charAt(0) === '/' ? VOLVER : '/movil'; };
  }
  getJson('/api/incidencias/opciones').then(function (d) {
    OPC = d;
    document.getElementById('btn-nueva').classList.remove('oculto');
    if (PARAMS.get('nueva') === '1') {
      desdeAcceso = true;
      abrirNueva({ proyecto: PARAMS.get('proyecto') || '', vehiculo_id: PARAMS.get('vehiculo') || '', tipo: PARAMS.get('tipo') || '', texto: PARAMS.get('texto') || '', origen: PARAMS.get('origen') || '' });
    } else if (parseInt(PARAMS.get('id'))) abrirFicha(parseInt(PARAMS.get('id')));
    else cargarLista();
  }).catch(function (e) {
    document.getElementById('cuerpo').innerHTML = '<div class="vacio">' + esc(e.message === 'No autorizado para este apartado' ? 'Tu usuario no tiene acceso a Incidencias.' : 'No se ha podido cargar: ' + e.message) + '</div>';
  });
}
document.getElementById('btn-nueva').onclick = function () { abrirNueva({ tipo: filtroTipo }); };

// ── Lista ──
function cargarLista() {
  pantalla = 'lista'; fichaId = null;
  document.getElementById('titulo').textContent = 'Incidencias';
  document.getElementById('btn-nueva').classList.remove('oculto');
  return getJson('/api/incidencias').then(function (d) { LISTA = d.incidencias; pintarLista(); })
    .catch(function (e) { document.getElementById('cuerpo').innerHTML = '<div class="vacio">No se ha podido cargar: ' + esc(e.message) + '</div>'; });
}
// Varios responsables (26 oct 2026): i.responsables es la lista de usuarios.
function esMia(i) { return (i.responsables || []).indexOf(OPC.yo) !== -1; }
function enVista(i) {
  if (vista === 'abiertas') return i.estado !== 'resuelta';
  if (vista === 'mias') return i.estado !== 'resuelta' && esMia(i);
  if (vista === 'resueltas') return i.estado === 'resuelta';
  return true;
}
function pintarTabs() {
  var abiertas = LISTA.filter(function (i) { return i.estado !== 'resuelta'; });
  var mias = abiertas.filter(esMia).length;
  var t = function (id, txt, n) { return '<button data-vista="' + id + '"' + (vista === id ? ' class="on"' : '') + '>' + txt + (n ? '<span class="badge">' + n + '</span>' : '') + '</button>'; };
  document.getElementById('tabs').innerHTML = t('abiertas', 'Abiertas', abiertas.length) + t('mias', 'Asignadas a mí', mias) + t('resueltas', 'Resueltas', 0);
}
document.getElementById('tabs').addEventListener('click', function (e) {
  var b = e.target.closest('[data-vista]'); if (!b) return;
  vista = b.getAttribute('data-vista');
  if (pantalla !== 'lista') cargarLista(); else pintarLista();
  window.scrollTo(0, 0);
});
function pintarLista() {
  pintarTabs();
  var tipos = '<option value="">Todos los tipos</option>' + Object.keys(OPC.tipos).map(function (k) { return '<option value="' + k + '"' + (filtroTipo === k ? ' selected' : '') + '>' + esc(OPC.tipos[k]) + '</option>'; }).join('');
  var h = '<div class="filtros"><input id="f-texto" type="search" placeholder="Buscar texto, proyecto o vehículo…" value="' + esc(filtroTexto) + '"><select id="f-tipo">' + tipos + '</select></div>';
  var f = filtroTexto.toLowerCase();
  var lista = LISTA.filter(enVista).filter(function (i) {
    if (filtroTipo && i.tipo !== filtroTipo) return false;
    if (!f) return true;
    return [i.texto, i.proyecto && i.proyecto.numero, i.proyecto && i.proyecto.cliente, i.vehiculo && i.vehiculo.nombre, i.responsable_nombre, i.creado_por_nombre].join(' ').toLowerCase().indexOf(f) !== -1;
  });
  // Urgentes primero entre las que siguen abiertas
  if (vista !== 'resueltas') lista.sort(function (a, b) { return (b.prioridad === 'urgente') - (a.prioridad === 'urgente') || new Date(b.creado_en) - new Date(a.creado_en); });
  if (!lista.length) h += '<div class="vacio">' + (vista === 'resueltas' ? 'Todavía no hay incidencias resueltas.' : vista === 'mias' ? 'No tienes incidencias asignadas pendientes.' : 'No hay incidencias abiertas.') + (OPC.ver_todas ? '' : '<br><br>Aquí salen las que creas tú y las que te asignan.') + '</div>';
  h += lista.map(function (i) {
    var sub = [];
    if (i.proyecto) sub.push('Proyecto ' + txtProyecto(i.proyecto));
    if (i.vehiculo) sub.push(esc(i.vehiculo.nombre));
    return '<div class="tarjeta click' + (i.prioridad === 'urgente' && i.estado !== 'resuelta' ? ' urg' : '') + '" data-id="' + i.id + '">' +
      '<div class="t-top"><div class="t-txt">' + esc(i.texto) + '</div>' + etqEstado(i.estado) + '</div>' +
      (sub.length ? '<div class="t-sub">' + sub.join(' · ') + '</div>' : '') +
      '<div class="t-sub">' + esc(i.creado_por_nombre || i.creado_por) + ' · ' + fecha(i.creado_en) + ' · ' + (i.responsable_nombre ? ((i.responsables || []).length > 1 ? 'Responsables' : 'Responsable') + ': <b>' + esc(i.responsable_nombre) + '</b>' : '<i>Sin responsable</i>') + '</div>' +
      '<div class="etqs"><span class="etq tipo">' + esc(OPC.tipos[i.tipo] || i.tipo) + '</span>' + (i.prioridad === 'urgente' ? '<span class="etq urgente">Urgente</span>' : '') + (i.fotos ? '<span class="etq tipo">📷 ' + i.fotos + '</span>' : '') + '</div></div>';
  }).join('');
  document.getElementById('cuerpo').innerHTML = h;
  var ft = document.getElementById('f-texto');
  ft.oninput = function () { filtroTexto = ft.value; var pos = ft.selectionStart; pintarLista(); var n = document.getElementById('f-texto'); n.focus(); n.setSelectionRange(pos, pos); };
  document.getElementById('f-tipo').onchange = function (e) { filtroTipo = e.target.value; pintarLista(); };
}
document.getElementById('cuerpo').addEventListener('click', function (e) {
  var t = e.target.closest('.tarjeta.click[data-id]');
  if (t && pantalla === 'lista') abrirFicha(Number(t.getAttribute('data-id')));
});

// ── Nueva incidencia ──
// Responsables: botones que se marcan y desmarcan (se pueden elegir varios).
function chipsResponsables(id, sel) {
  return '<div class="chips" id="' + id + '">' + OPC.usuarios.map(function (u) {
    return '<button type="button" aria-pressed="' + (sel.indexOf(u.usuario) !== -1) + '" data-resp="' + esc(u.usuario) + '"' + (sel.indexOf(u.usuario) !== -1 ? ' class="on"' : '') + '>' + esc(u.nombre) + (u.usuario === OPC.yo ? ' (yo)' : '') + '</button>';
  }).join('') + '</div>';
}
function activarChipsResponsables(id, alCambiar) {
  document.getElementById(id).onclick = function (e) {
    var b = e.target.closest('[data-resp]'); if (!b) return;
    var on = !b.classList.contains('on');
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
    if (alCambiar) alCambiar(leerResponsables(id));
  };
}
function leerResponsables(id) {
  return [].map.call(document.querySelectorAll('#' + id + ' [data-resp].on'), function (b) { return b.getAttribute('data-resp'); });
}
function abrirNueva(pre) {
  pantalla = 'nueva';
  nueva = { tipo: OPC.tipos[pre.tipo] ? pre.tipo : pre.vehiculo_id ? 'vehiculo' : '', prioridad: 'normal', origen: pre.origen || (EMBEBIDO ? 'panel' : 'app'), proyectoOk: null };
  fotosNueva = [];
  document.getElementById('titulo').textContent = 'Nueva incidencia';
  document.getElementById('btn-nueva').classList.add('oculto');
  document.getElementById('tabs').innerHTML = '';
  var vehs = '<option value="">Ninguno</option>' + OPC.vehiculos.map(function (v) { return '<option value="' + v.id + '"' + (String(v.id) === String(pre.vehiculo_id) ? ' selected' : '') + '>' + esc(v.nombre) + '</option>'; }).join('');
  var h = '<div class="campo"><label for="n-texto">¿Qué ha pasado?</label><textarea id="n-texto" placeholder="Describe la incidencia…" maxlength="2000">' + esc(pre.texto || '') + '</textarea></div>' +
    '<div class="campo"><label>Tipo</label><div class="chips" id="n-tipo">' + Object.keys(OPC.tipos).map(function (k) { return '<button type="button" data-tipo="' + k + '"' + (nueva.tipo === k ? ' class="on"' : '') + '>' + esc(OPC.tipos[k]) + '</button>'; }).join('') + '</div></div>' +
    '<div class="campo"><label>Prioridad</label><div class="chips" id="n-prio"><button type="button" data-prio="normal" class="on">Normal</button><button type="button" data-prio="urgente" class="urg">Urgente</button></div></div>' +
    '<div class="campo"><label for="n-proy">Proyecto (opcional)</label><input type="text" id="n-proy" inputmode="numeric" placeholder="Nº de proyecto, p. ej. 2456" value="' + esc(pre.proyecto || '') + '"><div class="ayuda" id="n-proy-ayuda"></div></div>' +
    '<div class="campo"><label for="n-veh">Vehículo (opcional)</label><select id="n-veh">' + vehs + '</select></div>' +
    '<div class="campo"><label>Responsables</label>' + chipsResponsables('n-resp', []) + '<div class="ayuda">Puedes elegir varios. Si no eliges ninguno, lo decide Dirección.</div></div>' +
    '<div class="campo"><label>Fotos (hasta ' + MAX_FOTOS + ')</label><div class="fotos" id="n-fotos"></div></div>' +
    '<div class="error" id="n-error"></div>' +
    '<button class="btn peli ancho" id="n-guardar">Registrar incidencia</button>' +
    '<div style="height:8px"></div><button class="btn sec ancho" id="n-cancelar">Cancelar</button>';
  document.getElementById('cuerpo').innerHTML = h;
  window.scrollTo(0, 0);
  pintarFotos('n-fotos', fotosNueva);
  document.getElementById('n-tipo').onclick = function (e) {
    var b = e.target.closest('[data-tipo]'); if (!b) return;
    nueva.tipo = b.getAttribute('data-tipo');
    [].forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
  };
  document.getElementById('n-prio').onclick = function (e) {
    var b = e.target.closest('[data-prio]'); if (!b) return;
    nueva.prioridad = b.getAttribute('data-prio');
    [].forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
  };
  activarChipsResponsables('n-resp');
  var proy = document.getElementById('n-proy');
  proy.onchange = comprobarProyecto;
  proy.onblur = comprobarProyecto;
  if (pre.proyecto) comprobarProyecto();
  document.getElementById('n-guardar').onclick = guardarNueva;
  document.getElementById('n-cancelar').onclick = cancelarNueva;
  if (!pre.texto) document.getElementById('n-texto').focus();
}
function cancelarNueva() {
  if (desdeAcceso && VOLVER && VOLVER.charAt(0) === '/' && !EMBEBIDO) { location.href = VOLVER; return; }
  desdeAcceso = false; cargarLista();
}
function comprobarProyecto() {
  var v = document.getElementById('n-proy').value.trim(), ay = document.getElementById('n-proy-ayuda');
  if (!v) { nueva.proyectoOk = null; ay.textContent = ''; ay.className = 'ayuda'; return Promise.resolve(); }
  if (nueva.proyectoOk && String(nueva.proyectoOk.numero) === v) return Promise.resolve();
  ay.textContent = 'Buscando…'; ay.className = 'ayuda';
  return getJson('/api/incidencias/proyecto/' + encodeURIComponent(v)).then(function (d) {
    nueva.proyectoOk = d.proyecto;
    ay.textContent = '✓ ' + (d.proyecto.cliente || '') + (d.proyecto.nombre ? ' · ' + d.proyecto.nombre : ''); ay.className = 'ayuda ok';
  }).catch(function (e) { nueva.proyectoOk = null; ay.textContent = e.message; ay.className = 'ayuda mal'; });
}
function guardarNueva() {
  var btn = document.getElementById('n-guardar'), err = document.getElementById('n-error');
  var texto = document.getElementById('n-texto').value.trim(), proy = document.getElementById('n-proy').value.trim();
  err.textContent = '';
  if (!texto) { err.textContent = 'Describe qué ha pasado'; return; }
  if (!nueva.tipo) { err.textContent = 'Elige el tipo'; return; }
  btn.disabled = true; btn.textContent = 'Guardando…';
  comprobarProyecto().then(function () {
    if (proy && !nueva.proyectoOk) throw new Error('Revisa el número de proyecto');
    var fd = new FormData();
    fd.append('texto', texto); fd.append('tipo', nueva.tipo); fd.append('prioridad', nueva.prioridad); fd.append('origen', nueva.origen);
    if (proy) fd.append('proyecto_numero', proy);
    fd.append('vehiculo_id', document.getElementById('n-veh').value);
    fd.append('responsables', JSON.stringify(leerResponsables('n-resp')));
    fotosNueva.forEach(function (f, n) { fd.append('fotos', f.blob, 'foto' + n + '.jpg'); });
    return postForm('/api/incidencias', fd);
  }).then(function (d) {
    toast('Incidencia registrada');
    if (desdeAcceso && VOLVER && VOLVER.charAt(0) === '/' && !EMBEBIDO) { setTimeout(function () { location.href = VOLVER; }, 900); return; }
    desdeAcceso = false; abrirFicha(d.incidencia.id);
  }).catch(function (e) { btn.disabled = false; btn.textContent = 'Registrar incidencia'; err.textContent = e.message; });
}

// ── Fotos (se reducen antes de subir, como en el chat) ──
function pintarFotos(idCont, lista) {
  var c = document.getElementById(idCont); if (!c) return;
  c.innerHTML = lista.map(function (f, n) { return '<div class="mini"><img src="' + f.url + '" data-ver="' + f.url + '" alt=""><button type="button" data-quitar="' + n + '" aria-label="Quitar foto">✕</button></div>'; }).join('') +
    (lista.length < MAX_FOTOS ? '<button type="button" class="anadir" data-anadir="1"><b>+</b>Foto</button>' : '');
  c.onclick = function (e) {
    var q = e.target.closest('[data-quitar]');
    if (q) { lista.splice(Number(q.getAttribute('data-quitar')), 1); pintarFotos(idCont, lista); return; }
    if (e.target.closest('[data-anadir]')) { destinoFotos = { id: idCont, lista: lista }; document.getElementById('sel-fotos').click(); return; }
    var v = e.target.closest('[data-ver]'); if (v) verFoto(v.getAttribute('data-ver'));
  };
}
document.getElementById('sel-fotos').onchange = function () {
  var files = [].slice.call(this.files || []), d = destinoFotos; this.value = '';
  if (!d) return;
  var hueco = MAX_FOTOS - d.lista.length;
  if (files.length > hueco) toast('Como mucho ' + MAX_FOTOS + ' fotos');
  Promise.all(files.slice(0, hueco).map(function (f) { return reducirFoto(f).catch(function () { return null; }); })).then(function (blobs) {
    blobs.forEach(function (b) { if (b) d.lista.push({ blob: b, url: URL.createObjectURL(b) }); });
    pintarFotos(d.id, d.lista);
  });
};
// Lado largo 1600 px en JPEG: las fotos del móvil pesan mucho y no hace falta tanto
function reducirFoto(file) {
  return new Promise(function (ok, ko) { var i = new Image(); i.onload = function () { ok(i); }; i.onerror = ko; i.src = URL.createObjectURL(file); }).then(function (img) {
    var e = Math.min(1, 1600 / Math.max(img.width, img.height));
    var c = document.createElement('canvas'); c.width = Math.round(img.width * e); c.height = Math.round(img.height * e);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return new Promise(function (ok) { c.toBlob(ok, 'image/jpeg', 0.85); });
  });
}
function verFoto(url) { var v = document.getElementById('visor'); v.querySelector('img').src = url; v.classList.remove('oculto'); }
document.getElementById('visor').onclick = function () { this.classList.add('oculto'); };

// ── Ficha y seguimiento ──
function abrirFicha(id) {
  pantalla = 'ficha'; fichaId = id; fotosComentario = [];
  document.getElementById('titulo').textContent = 'Incidencia #' + id;
  document.getElementById('btn-nueva').classList.add('oculto');
  document.getElementById('tabs').innerHTML = '<button class="on" data-vista="' + vista + '">&lsaquo; Todas las incidencias</button>';
  document.getElementById('cuerpo').innerHTML = '<div class="cargando">Cargando…</div>';
  window.scrollTo(0, 0);
  return getJson('/api/incidencias/' + id).then(pintarFicha)
    .catch(function (e) { document.getElementById('cuerpo').innerHTML = '<div class="vacio">' + esc(e.message) + '</div>'; });
}
function fotosHtml(fotos) {
  if (!fotos.length) return '';
  return '<div class="fotos">' + fotos.map(function (f) { var u = '/api/incidencias/foto/' + f.id; return '<div class="mini"><img src="' + u + '" data-ver="' + u + '" alt="" loading="lazy"></div>'; }).join('') + '</div>';
}
function pintarFicha(d) {
  var i = d.incidencia, p = i.permisos;
  var fotosDe = function (segId) { return d.fotos.filter(function (f) { return (f.seguimiento_id || null) === segId; }); };
  var h = '<div class="tarjeta' + (i.prioridad === 'urgente' && i.estado !== 'resuelta' ? ' urg' : '') + '">' +
    '<div class="etqs" style="margin:0 0 10px;">' + etqEstado(i.estado) + '<span class="etq tipo">' + esc(OPC.tipos[i.tipo] || i.tipo) + '</span>' + (i.prioridad === 'urgente' ? '<span class="etq urgente">Urgente</span>' : '') + '</div>' +
    '<div class="ficha-txt">' + esc(i.texto) + '</div>' +
    (fotosDe(null).length ? '<div style="margin-top:10px;">' + fotosHtml(fotosDe(null)) + '</div>' : '') +
    '<dl class="datos">' +
    '<dt>Creada</dt><dd>' + esc(i.creado_por_nombre || i.creado_por) + ' · ' + fecha(i.creado_en) + '</dd>' +
    (i.proyecto ? '<dt>Proyecto</dt><dd>' + txtProyecto(i.proyecto) + '</dd>' : '') +
    (i.vehiculo ? '<dt>Vehículo</dt><dd>' + esc(i.vehiculo.nombre) + '</dd>' : '') +
    '<dt>Responsables</dt><dd>' + (p.responsable ? chipsResponsables('f-resp', i.responsables || []) + '<button class="btn pri oculto" id="f-resp-ok" style="margin-top:8px;">Guardar responsables</button>' : esc(i.responsable_nombre || 'Sin asignar')) + '</dd>' +
    '</dl>' +
    (i.estado === 'resuelta' ? '<div class="solucion"><b>Resuelta</b> por ' + esc(i.resuelta_por_nombre || '') + ' · ' + fecha(i.resuelta_en) + '<br>' + esc(i.solucion || '') + '</div>' : '');
  if (p.estado) {
    h += '<div class="acciones">';
    if (i.estado === 'abierta') h += '<button class="btn sec" data-estado="en_curso">Empezar · En curso</button>';
    if (i.estado !== 'resuelta') h += '<button class="btn pri" data-estado="resuelta">Marcar resuelta</button>';
    else h += '<button class="btn sec" data-estado="abierta">Reabrir</button>';
    h += '</div><div id="caja-solucion" class="oculto" style="margin-top:10px;"><textarea id="f-solucion" placeholder="¿Cómo se ha resuelto?" style="width:100%;min-height:70px;padding:10px 12px;font-size:16px;border:0.5px solid #d8d4c8;border-radius:10px;"></textarea><div class="acciones" style="margin-top:8px;"><button class="btn sec" id="f-sol-cancelar">Cancelar</button><button class="btn pri" id="f-sol-ok">Cerrar incidencia</button></div></div>';
  } else if (i.estado !== 'resuelta') {
    h += '<div class="t-sub" style="margin-top:10px;">El estado lo cambian los responsables o Dirección.</div>';
  }
  h += '</div>';
  h += '<div class="sec-tit">Seguimiento</div><div class="hist">' + d.seguimiento.map(function (s) {
    var txt = s.tipo === 'creada' ? 'Ha registrado la incidencia' : s.texto || '';
    return '<div class="h-item ' + s.tipo + '"><div class="h-cab"><b>' + esc(s.nombre || s.usuario) + '</b> · ' + fecha(s.creado_en) + '</div>' + (txt ? '<div class="h-txt">' + esc(txt) + '</div>' : '') + fotosHtml(fotosDe(s.id)) + '</div>';
  }).join('') + '</div>';
  if (p.comentar) {
    h += '<div class="comentar"><textarea id="c-texto" placeholder="Añadir un comentario…" maxlength="2000"></textarea>' +
      '<div class="fila"><div class="fotos" id="c-fotos"></div><button class="btn pri" id="c-enviar">Comentar</button></div><div class="error" id="c-error"></div></div>';
  }
  document.getElementById('cuerpo').innerHTML = h;
  if (p.comentar) { pintarFotos('c-fotos', fotosComentario); document.getElementById('c-enviar').onclick = comentar; }
  var okResp = document.getElementById('f-resp-ok');
  if (okResp) {
    var antes = (i.responsables || []).slice().sort().join('|');
    activarChipsResponsables('f-resp', function (lista) { okResp.classList.toggle('oculto', lista.slice().sort().join('|') === antes); });
    okResp.onclick = function () {
      okResp.disabled = true;
      postJson('/api/incidencias/' + i.id + '/responsable', { responsables: leerResponsables('f-resp') }).then(function () { toast('Responsables guardados'); abrirFicha(i.id); })
        .catch(function (e) { okResp.disabled = false; toast(e.message); });
    };
  }
  [].forEach.call(document.querySelectorAll('[data-estado]'), function (b) {
    if (b.closest('#tabs')) return;
    b.onclick = function () {
      var e = b.getAttribute('data-estado');
      if (e === 'resuelta') { document.getElementById('caja-solucion').classList.remove('oculto'); document.getElementById('f-solucion').focus(); return; }
      if (e === 'abierta' && !confirm('¿Reabrir la incidencia?')) return;
      cambiarEstado(i.id, e, '', b);
    };
  });
  var cs = document.getElementById('f-sol-cancelar');
  if (cs) {
    cs.onclick = function () { document.getElementById('caja-solucion').classList.add('oculto'); };
    document.getElementById('f-sol-ok').onclick = function () {
      var s = document.getElementById('f-solucion').value.trim();
      if (!s) { toast('Escribe cómo se ha resuelto'); return; }
      cambiarEstado(i.id, 'resuelta', s, this);
    };
  }
  document.querySelectorAll('.cuerpo .fotos').forEach(function (c) {
    if (c.id) return;
    c.onclick = function (e) { var v = e.target.closest('[data-ver]'); if (v) verFoto(v.getAttribute('data-ver')); };
  });
}
function cambiarEstado(id, estado, solucion, btn) {
  btn.disabled = true;
  postJson('/api/incidencias/' + id + '/estado', { estado: estado, solucion: solucion }).then(function () {
    toast(estado === 'resuelta' ? 'Incidencia cerrada' : estado === 'en_curso' ? 'En curso' : 'Reabierta');
    abrirFicha(id);
  }).catch(function (e) { btn.disabled = false; toast(e.message); });
}
function comentar() {
  var btn = document.getElementById('c-enviar'), err = document.getElementById('c-error');
  var texto = document.getElementById('c-texto').value.trim();
  err.textContent = '';
  if (!texto && !fotosComentario.length) { err.textContent = 'Escribe algo o adjunta una foto'; return; }
  var fd = new FormData();
  fd.append('texto', texto);
  fotosComentario.forEach(function (f, n) { fd.append('fotos', f.blob, 'foto' + n + '.jpg'); });
  btn.disabled = true;
  postForm('/api/incidencias/' + fichaId + '/comentario', fd).then(function () { toast('Comentario añadido'); abrirFicha(fichaId); })
    .catch(function (e) { btn.disabled = false; err.textContent = e.message; });
}

// La lista se refresca sola cada 2 minutos si está a la vista y no se está escribiendo
setInterval(function () { if (OPC && pantalla === 'lista' && !document.hidden && !(document.activeElement && document.activeElement.matches('input, select, textarea'))) cargarLista(); }, 120000);
entrar();
</script>
