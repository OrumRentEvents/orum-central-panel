<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ORUM Ayuda</title>
<link rel="manifest" href="/movil.webmanifest?v=2">
<meta name="theme-color" content="#1a1a18">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-orum.png?v=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f7f6f2; color: #1a1a18; min-height: 100vh; }
button, input, textarea { font-family: inherit; }
.oculto { display: none !important; }
.cab { background: #1a1a18; color: #fff; padding: calc(12px + env(safe-area-inset-top)) 16px 10px; position: sticky; top: 0; z-index: 10; }
.cab-top { display: flex; align-items: center; gap: 10px; }
.cab h1 { font-size: 16px; font-weight: 600; flex: 1; }
.cab button { background: transparent; border: 0.5px solid rgba(255,255,255,.3); color: rgba(255,255,255,.85); font-size: 12.5px; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-top: 8px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: none; background: transparent; color: rgba(255,255,255,.65); font-size: 13.5px; padding: 7px 12px; border-radius: 6px; white-space: nowrap; flex-shrink: 0; cursor: pointer; }
.tabs button.on { background: rgba(255,255,255,.15); color: #fff; font-weight: 600; }
.cuerpo { max-width: 860px; margin: 0 auto; padding: 14px 16px 40px; }
.cargando, .vacio { text-align: center; padding: 3rem 1rem; color: #9a988f; font-size: 14px; }

/* Chat */
.chat { background: #fff; border: 0.5px solid #e0cba6; border-radius: 14px; padding: 14px; margin-bottom: 16px; }
.chat h2 { font-size: 15px; margin-bottom: 4px; }
.chat .sub { font-size: 12.5px; color: #6b6a64; margin-bottom: 10px; }
.chat-msgs { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; max-height: 50vh; overflow-y: auto; }
.chat-msgs:empty { display: none; }
.msg { max-width: 92%; padding: 9px 12px; border-radius: 12px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.yo { align-self: flex-end; background: #DCF3E8; border-radius: 12px 12px 4px 12px; }
.msg.orum { align-self: flex-start; background: #f7f6f2; border: 0.5px solid #e2e2de; border-radius: 12px 12px 12px 4px; }
.msg.orum.no { border-color: #e7c9a0; background: #fdf8ef; }
.msg .val { display: flex; gap: 6px; margin-top: 6px; }
.msg .val button { border: 0.5px solid #e2e2de; background: #fff; border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 13px; }
.msg .val button.on { background: #1a1a18; color: #fff; border-color: #1a1a18; }
.chat-form { display: flex; gap: 8px; }
.chat-form textarea { flex: 1; resize: none; min-height: 42px; max-height: 120px; padding: 10px 12px; font-size: 14px; border: 0.5px solid #d8d4c8; border-radius: 10px; background: #fff; }
.chat-form textarea:focus { outline: none; border-color: #1a1a18; }
.chat-form button { background: #1a1a18; color: #fff; border: none; border-radius: 10px; padding: 0 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
.chat-form button:disabled { opacity: .5; }

/* Manual */
.buscar { width: 100%; padding: 10px 12px; font-size: 14px; border: 0.5px solid #e2e2de; border-radius: 10px; background: #fff; margin-bottom: 12px; }
.buscar:focus { outline: none; border-color: #1a1a18; }
.indice { background: #fff; border: 0.5px solid #e2e2de; border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; font-size: 13.5px; }
.indice b { display: block; font-size: 12px; color: #9a988f; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
.indice a { display: inline-block; color: #8a6d1e; text-decoration: none; margin: 2px 12px 2px 0; }
.manual { background: #fff; border: 0.5px solid #e2e2de; border-radius: 12px; padding: 18px 20px; font-size: 14.5px; line-height: 1.55; }
.manual h1 { font-size: 20px; margin-bottom: 10px; }
.manual h2 { font-size: 17px; margin: 26px 0 8px; padding-top: 14px; border-top: 0.5px solid #efeee9; scroll-margin-top: 110px; }
.manual h3 { font-size: 15px; margin: 18px 0 6px; scroll-margin-top: 110px; }
.manual p { margin: 8px 0; }
.manual ul, .manual ol { margin: 8px 0 8px 22px; }
.manual li { margin: 4px 0; }
.manual li.tarea { list-style: none; margin-left: -20px; }
.manual table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13.5px; display: block; overflow-x: auto; }
.manual th { text-align: left; background: #f7f7f5; padding: 7px 8px; border: 0.5px solid #e2e2de; white-space: nowrap; }
.manual td { padding: 7px 8px; border: 0.5px solid #e2e2de; vertical-align: top; }
.manual code { background: #f3f2ee; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
.manual a { color: #8a6d1e; }
mark { background: #fbe7a1; padding: 0 1px; }
.resultado { background: #fff; border: 0.5px solid #e2e2de; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; font-size: 13.5px; }
.resultado b { display: block; margin-bottom: 2px; }
.resultado span { color: #6b6a64; }

/* Preguntas (Sergio) */
.filtros { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.filtros button { border: 0.5px solid #e2e2de; background: #fff; border-radius: 16px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.filtros button.on { background: #1a1a18; color: #fff; border-color: #1a1a18; }
.pregunta { background: #fff; border: 0.5px solid #e2e2de; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 13.5px; }
.pregunta .meta { color: #9a988f; font-size: 12px; margin-bottom: 4px; }
.pregunta .p { font-weight: 600; margin-bottom: 4px; }
.pregunta .r { color: #3d3c38; white-space: pre-wrap; }
.etq { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; margin-left: 6px; }
.etq.no { background: #FCEBEB; color: #A32D2D; }
.etq.mal { background: #fff1e6; color: #b45309; }
.etq.bien { background: #EAF3DE; color: #3B6D11; }
</style>
</head>
<body>
<div class="cab">
  <div class="cab-top">
    <button id="btn-volver" class="oculto">&lsaquo; Inicio</button>
    <h1>Ayuda</h1>
  </div>
  <div class="tabs" id="tabs"></div>
</div>
<div class="cuerpo">
  <div class="chat" id="chat">
    <h2>Pregúntale a ORUM</h2>
    <div class="sub">Escribe tu duda sobre cómo se hace algo en ORUM Central y te contesto con lo que dicen los manuales.</div>
    <div class="chat-msgs" id="chat-msgs"></div>
    <form class="chat-form" id="chat-form">
      <textarea id="chat-txt" rows="1" placeholder="Por ejemplo: ¿cómo pido la devolución de una fianza?" maxlength="1000"></textarea>
      <button type="submit" id="chat-btn">Preguntar</button>
    </form>
  </div>
  <div id="contenido"><div class="cargando">Cargando…</div></div>
</div>

<script>
// Ayuda (lib/ayuda.js): manual de cada puesto (carpeta ayuda/) y chat que
// contesta con esos manuales. Misma pantalla en la app (/ayuda), en el panel
// (?embebido=1) y desde las tablets (?volver=…). ?pantalla= dice desde dónde se abrió.
var PARAMS = new URLSearchParams(location.search);
var EMBEBIDO = PARAMS.get('embebido') === '1';
var VOLVER = PARAMS.get('volver');
var PANTALLA = PARAMS.get('pantalla') || '';
var MANUALES = [], activo = null, puedeVerPreguntas = false, historial = [], filtroPreguntas = '';

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function slug(s) { return 'sec-' + String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

// ── Markdown sencillo: títulos, párrafos, listas (con sub-listas de 4 espacios), tareas, tablas, negrita, código y enlaces ──
function enLinea(t) {
  return esc(t)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function markdown(md) {
  var lineas = md.replace(/\r/g, '').split('\n'), h = '', i = 0;
  while (i < lineas.length) {
    var l = lineas[i];
    if (!l.trim()) { i++; continue; }
    var m = l.match(/^(#{1,3})\s+(.*)$/);
    if (m) { var n = m[1].length; h += '<h' + n + (n > 1 ? ' id="' + slug(m[2]) + '"' : '') + '>' + enLinea(m[2]) + '</h' + n + '>'; i++; continue; }
    if (/^\|/.test(l)) {
      var filas = [];
      while (i < lineas.length && /^\|/.test(lineas[i])) { filas.push(lineas[i]); i++; }
      var celdas = function (f) { return f.replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); }); };
      h += '<table><thead><tr>' + celdas(filas[0]).map(function (c) { return '<th>' + enLinea(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        filas.slice(2).map(function (f) { return '<tr>' + celdas(f).map(function (c) { return '<td>' + enLinea(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>';
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      var bloque = [];
      while (i < lineas.length && (/^\s*([-*]|\d+\.)\s+/.test(lineas[i]) || (/^\s{2,}\S/.test(lineas[i]) && bloque.length))) { bloque.push(lineas[i]); i++; }
      h += lista(bloque, 0);
      continue;
    }
    var parrafo = [];
    while (i < lineas.length && lineas[i].trim() && !/^(#{1,3}\s|\||\s*([-*]|\d+\.)\s)/.test(lineas[i])) { parrafo.push(lineas[i]); i++; }
    h += '<p>' + enLinea(parrafo.join(' ')) + '</p>';
  }
  return h;
}
function lista(bloque, nivel) {
  var sangria = function (l) { return l.match(/^\s*/)[0].length; };
  var base = sangria(bloque[0]), ordenada = /^\s*\d+\./.test(bloque[0]), h = '', i = 0;
  while (i < bloque.length) {
    var texto = bloque[i].trim().replace(/^([-*]|\d+\.)\s+/, ''), hijos = [];
    i++;
    while (i < bloque.length && sangria(bloque[i]) > base) { hijos.push(bloque[i]); i++; }
    var tarea = texto.match(/^\[( |x)\]\s+(.*)$/);
    h += tarea ? '<li class="tarea">' + (tarea[1] === 'x' ? '☑' : '☐') + ' ' + enLinea(tarea[2]) : '<li>' + enLinea(texto);
    if (hijos.length) h += lista(hijos, nivel + 1);
    h += '</li>';
  }
  return ordenada ? '<ol>' + h + '</ol>' : '<ul>' + h + '</ul>';
}

// ── Entrada ──
function entrar() {
  fetch('/api/sesion').then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }).then(function (d) {
    if (d && d.usuario) return arrancar();
    var llave = ''; try { llave = localStorage.getItem('orum_movil_dispositivo') || ''; } catch (e) {}
    if (!llave) return location.replace(EMBEBIDO ? '/' : '/movil');
    fetch('/api/movil/dispositivo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dispositivo: llave }) })
      .then(function (r) { return r.json(); }).then(function (r) { if (r.ok) arrancar(); else location.replace('/movil'); })
      .catch(function () { location.replace('/movil'); });
  });
}
function arrancar() {
  if (!EMBEBIDO) {
    var b = document.getElementById('btn-volver');
    b.classList.remove('oculto');
    if (VOLVER && VOLVER.charAt(0) === '/') b.innerHTML = '&lsaquo; Volver';
    b.onclick = function () { location.href = VOLVER && VOLVER.charAt(0) === '/' ? VOLVER : '/movil'; };
  }
  fetch('/api/ayuda').then(function (r) { return r.json(); }).then(function (d) {
    if (!d.ok) { document.getElementById('contenido').innerHTML = '<div class="vacio">' + esc(d.error || 'Error') + '</div>'; return; }
    MANUALES = d.manuales; puedeVerPreguntas = d.puede_ver_preguntas;
    pintarTabs();
    ver(PARAMS.get('manual') || (MANUALES[0] && MANUALES[0].id));
  }).catch(function () { document.getElementById('contenido').innerHTML = '<div class="vacio">Error de conexión</div>'; });
}
function pintarTabs() {
  var t = MANUALES.map(function (m) { return '<button data-m="' + m.id + '"' + (m.id === activo ? ' class="on"' : '') + '>' + esc(m.titulo) + '</button>'; }).join('');
  if (puedeVerPreguntas) t += '<button data-m="_preguntas"' + (activo === '_preguntas' ? ' class="on"' : '') + '>Preguntas</button>';
  document.getElementById('tabs').innerHTML = t;
}
document.getElementById('tabs').onclick = function (e) { var b = e.target.closest('[data-m]'); if (b) ver(b.getAttribute('data-m')); };

// ── Manual con índice y buscador ──
function ver(id) {
  activo = id;
  pintarTabs();
  document.getElementById('chat').classList.toggle('oculto', id === '_preguntas');
  if (id === '_preguntas') return verPreguntas();
  var m = MANUALES.filter(function (x) { return x.id === id; })[0] || MANUALES[0];
  if (!m) { document.getElementById('contenido').innerHTML = '<div class="vacio">No hay manuales para tu usuario.</div>'; return; }
  activo = m.id;
  var secciones = m.contenido.split('\n').filter(function (l) { return /^##\s/.test(l); }).map(function (l) { return l.replace(/^##\s+/, ''); });
  document.getElementById('contenido').innerHTML =
    '<input class="buscar" id="buscar" placeholder="Buscar en todos tus manuales (por ejemplo: fianza, PIN, rutas)…">' +
    '<div id="resultados"></div>' +
    '<div id="manual-vista"><div class="indice"><b>En este manual</b>' + secciones.map(function (s) { return '<a href="#' + slug(s) + '">' + esc(s) + '</a>'; }).join('') + '</div>' +
    '<div class="manual">' + markdown(m.contenido) + '</div></div>';
  document.getElementById('buscar').oninput = function () { buscar(this.value); };
  window.scrollTo(0, 0);
}
// Busca en todos los manuales que ve la persona y lista las secciones que coinciden
function buscar(texto) {
  var q = texto.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  var res = document.getElementById('resultados'), vista = document.getElementById('manual-vista');
  if (q.length < 3) { res.innerHTML = ''; vista.classList.remove('oculto'); return; }
  var hallados = [];
  MANUALES.forEach(function (m) {
    var titulo = m.titulo, actual = null;
    m.contenido.split('\n').forEach(function (l) {
      if (/^##\s/.test(l)) actual = { manual: m.id, titulo: titulo, seccion: l.replace(/^##\s+/, ''), texto: '' };
      else if (actual) actual.texto += ' ' + l;
      if (actual && actual.texto.length && hallados.indexOf(actual) === -1) {
        var plano = (actual.seccion + ' ' + actual.texto).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
        if (plano.indexOf(q) !== -1) hallados.push(actual);
      }
    });
  });
  vista.classList.add('oculto');
  res.innerHTML = hallados.length ? hallados.slice(0, 30).map(function (h, i) {
    var limpio = h.texto.replace(/[#*|`]/g, ' ').replace(/\s+/g, ' ');
    var plano = limpio.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    var p = Math.max(0, plano.indexOf(q) - 60);
    return '<div class="resultado" data-ir="' + i + '"><b>' + esc(h.titulo) + ' → ' + esc(h.seccion) + '</b><span>…' + esc(limpio.slice(p, p + 180)) + '…</span></div>';
  }).join('') : '<div class="vacio">No sale en los manuales. Prueba a preguntarlo arriba.</div>';
  res.onclick = function (e) {
    var r = e.target.closest('[data-ir]');
    if (!r) return;
    var h = hallados[+r.getAttribute('data-ir')];
    ver(h.manual);
    var el = document.getElementById(slug(h.seccion));
    if (el) el.scrollIntoView();
  };
}

// ── Chat ──
var txt = document.getElementById('chat-txt');
txt.addEventListener('input', function () { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 120) + 'px'; });
txt.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('chat-form').requestSubmit(); } });
document.getElementById('chat-form').onsubmit = function (e) {
  e.preventDefault();
  var pregunta = txt.value.trim();
  if (!pregunta) return;
  var msgs = document.getElementById('chat-msgs'), btn = document.getElementById('chat-btn');
  msgs.insertAdjacentHTML('beforeend', '<div class="msg yo">' + esc(pregunta) + '</div><div class="msg orum" id="pensando">Buscando en los manuales…</div>');
  msgs.scrollTop = msgs.scrollHeight;
  txt.value = ''; txt.style.height = 'auto'; btn.disabled = true;
  fetch('/api/ayuda/preguntar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pregunta: pregunta, pantalla: PANTALLA, historial: historial }) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var p = document.getElementById('pensando');
      if (!d.ok) { p.textContent = d.error || 'No he podido contestar. Inténtalo de nuevo.'; p.removeAttribute('id'); return; }
      historial.push({ pregunta: pregunta, respuesta: d.respuesta });
      p.outerHTML = '<div class="msg orum' + (d.encontrada ? '' : ' no') + '">' + esc(d.respuesta) +
        '<div class="val" data-id="' + d.id + '"><button data-v="1" title="Me ha servido">👍</button><button data-v="-1" title="No me ha servido">👎</button></div></div>';
      msgs.scrollTop = msgs.scrollHeight;
    })
    .catch(function () { var p = document.getElementById('pensando'); if (p) { p.textContent = 'Error de conexión'; p.removeAttribute('id'); } })
    .then(function () { btn.disabled = false; txt.focus(); });
};
document.getElementById('chat-msgs').onclick = function (e) {
  var b = e.target.closest('[data-v]');
  if (!b) return;
  var cont = b.parentNode;
  [].forEach.call(cont.children, function (x) { x.classList.toggle('on', x === b); });
  fetch('/api/ayuda/preguntas/' + cont.getAttribute('data-id') + '/valorar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ valor: +b.getAttribute('data-v') }) }).catch(function () {});
};

// ── Preguntas que hace la gente (solo Sergio) ──
function verPreguntas() {
  var c = document.getElementById('contenido');
  c.innerHTML = '<div class="cargando">Cargando…</div>';
  fetch('/api/ayuda/preguntas' + (filtroPreguntas ? '?filtro=' + filtroPreguntas : '')).then(function (r) { return r.json(); }).then(function (d) {
    if (!d.ok) { c.innerHTML = '<div class="vacio">' + esc(d.error || 'Error') + '</div>'; return; }
    c.innerHTML = '<div class="filtros">' + [['', 'Todas'], ['sin_respuesta', 'Sin respuesta en el manual'], ['negativas', 'Con 👎']].map(function (f) {
      return '<button data-f="' + f[0] + '"' + (f[0] === filtroPreguntas ? ' class="on"' : '') + '>' + f[1] + '</button>';
    }).join('') + '</div>' + (d.preguntas.length ? d.preguntas.map(function (p) {
      return '<div class="pregunta"><div class="meta">' + new Date(p.creado_en).toLocaleString('es-ES', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + ' · ' + esc(p.nombre || p.usuario) + ' (' + esc(p.rol || '') + ')' + (p.pantalla ? ' · ' + esc(p.pantalla) : '') +
        (p.encontrada === false ? '<span class="etq no">Sin respuesta</span>' : '') + (p.valoracion === -1 ? '<span class="etq mal">👎</span>' : p.valoracion === 1 ? '<span class="etq bien">👍</span>' : '') + '</div>' +
        '<div class="p">' + esc(p.pregunta) + '</div><div class="r">' + esc(p.respuesta || '') + '</div></div>';
    }).join('') : '<div class="vacio">Todavía no hay preguntas.</div>');
    c.querySelector('.filtros').onclick = function (e) { var b = e.target.closest('[data-f]'); if (b) { filtroPreguntas = b.getAttribute('data-f'); verPreguntas(); } };
  }).catch(function () { c.innerHTML = '<div class="vacio">Error de conexión</div>'; });
}

entrar();
</script>
<script src="/actividad-registro.js" data-pantalla="Ayuda"></script>
</body>
</html>
