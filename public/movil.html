<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>ORUM Central</title>
<link rel="manifest" href="/movil.webmanifest?v=2">
<meta name="theme-color" content="#1a1a18">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/orum-192.png?v=1">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-orum.png?v=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ORUM Central">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f7f6f2; color: #1a1a18; min-height: 100vh; }
button { font-family: inherit; }
.oculto { display: none !important; }
.cargando { text-align: center; padding: 4rem 1rem; color: #6b6a64; font-size: 14px; }

/* PIN (igual que Rutas y Preparación) */
#pin-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
.pin-box { background: #fff; border: 0.5px solid #e2e2de; border-radius: 16px; padding: 2rem 1.5rem; width: 100%; max-width: 320px; text-align: center; }
.pin-logo { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 6px; }
.pin-logo img { width: 40px; height: auto; }
.pin-logo span { font-size: 13px; font-weight: 600; letter-spacing: 2px; }
.pin-sub { font-size: 12px; color: #9a988f; margin-bottom: 1.5rem; }
.pin-dots { display: flex; justify-content: center; gap: 12px; margin-bottom: 1.5rem; }
.pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #ccc; background: #fff; transition: all .1s; }
.pin-dot.filled { background: #1a1a18; border-color: #1a1a18; }
.pin-dot.error { background: #A32D2D; border-color: #A32D2D; }
.pin-err { font-size: 12px; color: #A32D2D; min-height: 16px; margin-bottom: 1rem; }
.pin-kp { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pin-k { background: #f7f6f2; border: 0.5px solid #e2e2de; border-radius: 10px; padding: 16px 8px; font-size: 20px; color: #1a1a18; cursor: pointer; user-select: none; }
.pin-k:active { background: #e2e2de; }
.pin-k.borrar { font-size: 16px; color: #6b6a64; }
.pin-k.vacia { background: transparent; border-color: transparent; cursor: default; }
.pin-recordar { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 1.25rem; font-size: 13px; color: #6b6a64; }
.pin-recordar input { width: 18px; height: 18px; accent-color: #1a1a18; }
.btn-bio { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: #1a1a18; color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 1.25rem; }
.btn-bio svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.bio-o { font-size: 11px; color: #9a988f; margin: -0.5rem 0 1rem; }
.aviso-bio { background: #fff; border: 0.5px solid #e0cba6; border-radius: 14px; padding: 14px; margin-bottom: 14px; display: flex; gap: 12px; align-items: center; }
.aviso-bio svg { width: 30px; height: 30px; stroke: #8a6d1e; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.aviso-bio .txt { flex: 1; font-size: 13px; line-height: 1.35; }
.aviso-bio .txt b { display: block; font-size: 14px; margin-bottom: 2px; }
.aviso-bio .acc { display: flex; flex-direction: column; gap: 6px; }
.aviso-bio .acc button { border-radius: 8px; padding: 7px 10px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.aviso-bio .si { background: #1a1a18; color: #fff; border: none; }
.aviso-bio .no { background: none; border: none; color: #9a988f; font-weight: 400 !important; }
.estado-bio { text-align: center; margin-top: 18px; font-size: 12px; color: #9a988f; }
.estado-bio button { background: none; border: none; color: #8a6d1e; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0 2px; }
.pin-pie { margin-top: 1rem; font-size: 12px; color: #9a988f; }
.pin-pie a { color: #6b6a64; }

/* Cabecera */
.cab { background: #1a1a18; color: #fff; padding: calc(14px + env(safe-area-inset-top)) 16px 14px; position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; }
.cab h1 { font-size: 16px; font-weight: 500; flex: 1; }
.cab .quien { font-size: 12px; color: rgba(255,255,255,.6); }
.cab button { background: transparent; border: 0.5px solid rgba(255,255,255,.3); color: rgba(255,255,255,.85); font-size: 13px; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.cuerpo { padding: 16px; max-width: 680px; margin: 0 auto; }

/* Inicio */
.saludo { font-size: 13px; color: #6b6a64; margin: 4px 0 14px; }
.botones { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.boton { background: #fff; border: 0.5px solid #e2e2de; border-radius: 14px; padding: 20px 14px; text-align: left; cursor: pointer; text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 10px; min-height: 120px; }
.boton:active { background: #f0efe9; }
.boton .ico { width: 40px; height: 40px; border-radius: 10px; background: #f3ead9; display: flex; align-items: center; justify-content: center; }
.boton .ico svg { width: 22px; height: 22px; stroke: #8a6d1e; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.boton .tit { font-size: 15px; font-weight: 600; }
.boton .sub { font-size: 12px; color: #6b6a64; line-height: 1.35; }
.saludo-fila { display: flex; align-items: center; justify-content: space-between; }
.btn-editar { background: none; border: none; color: #8a6d1e; font-size: 13px; font-weight: 500; padding: 6px 2px; cursor: pointer; }
.edit-lista { display: flex; flex-direction: column; gap: 8px; }
.edit-fila { background: #fff; border: 0.5px solid #e2e2de; border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 12px; }
.edit-fila.fuera { opacity: .55; }
.edit-fila .ico { width: 34px; height: 34px; border-radius: 9px; background: #f3ead9; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.edit-fila .ico svg { width: 19px; height: 19px; stroke: #8a6d1e; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.edit-fila .tit { flex: 1; font-size: 15px; font-weight: 500; }
.edit-fila .mover { display: flex; flex-direction: column; gap: 2px; }
.edit-fila .mover button { width: 34px; height: 26px; border: 0.5px solid #e2e2de; background: #f7f6f2; border-radius: 6px; font-size: 13px; color: #6b6a64; cursor: pointer; }
.edit-fila .mover button:disabled { opacity: .3; }
.interruptor { position: relative; width: 46px; height: 28px; flex-shrink: 0; }
.interruptor input { opacity: 0; width: 0; height: 0; }
.interruptor span { position: absolute; inset: 0; background: #d8d4c8; border-radius: 14px; transition: background .15s; cursor: pointer; }
.interruptor span::after { content: ''; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; background: #fff; border-radius: 50%; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.interruptor input:checked + span { background: #1D9E75; }
.interruptor input:checked + span::after { transform: translateX(18px); }
.edit-acciones { display: flex; gap: 10px; margin-top: 16px; }
.edit-acciones button { flex: 1; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
.edit-acciones .sec { background: #fff; border: 0.5px solid #e2e2de; color: #1a1a18; }
.edit-acciones .pri { background: #1a1a18; border: none; color: #fff; }
/* Formularios (Extras, Servicios Isabella) */
.form { background: #fff; border: 0.5px solid #e2e2de; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.form .campo select, .form .campo textarea { width: 100%; padding: 11px 12px; font-size: 16px; border: 0.5px solid #d8d4c8; border-radius: 10px; background: #fff; color: #1a1a18; font-family: inherit; }
.form .campo textarea { min-height: 60px; resize: vertical; }
.fila2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.segmentos { display: flex; gap: 6px; flex-wrap: wrap; }
.segmentos button { flex: 1 1 auto; padding: 10px 8px; border-radius: 10px; border: 0.5px solid #d8d4c8; background: #fff; font-size: 13px; cursor: pointer; }
.segmentos button.on { background: #1a1a18; color: #fff; border-color: #1a1a18; }
.trab-cab { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600; }
.trab-cab span { font-weight: 400; color: #6b6a64; }
.trab-lista { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.trab { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 0.5px solid #e2e2de; font-size: 14px; cursor: pointer; }
.trab.on { border-color: #1D9E75; background: #f4fcf9; }
.trab input { width: 20px; height: 20px; accent-color: #1D9E75; }
.trab small { display: block; font-size: 11px; color: #9a988f; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips span { font-size: 12px; background: #FAEEDA; color: #854F0B; padding: 4px 10px; border-radius: 12px; }
.chips b { cursor: pointer; margin-left: 4px; }
.fila-add { display: flex; gap: 8px; }
.fila-add input { flex: 1; min-width: 0; }
.fila-add button { border: 0.5px solid #d8d4c8; background: #f7f6f2; border-radius: 10px; padding: 0 14px; font-size: 14px; cursor: pointer; }
.resumen-form { font-size: 14px; text-align: center; color: #1a1a18; }
.resumen-form.aviso { color: #9a988f; }
.estado-form { font-size: 13px; text-align: center; min-height: 18px; }
.estado-form.ok { color: #0F6E56; } .estado-form.mal { color: #A32D2D; }
.seccion-tit { font-size: 12px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; color: #6b6a64; margin: 22px 0 8px; }
.reg { background: #fff; border: 0.5px solid #e2e2de; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
.reg-top { display: flex; justify-content: space-between; gap: 8px; }
.reg-top b { font-size: 14px; }
.reg-sub { font-size: 12px; color: #6b6a64; margin-top: 3px; }
.reg-pie { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
.est { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #f0efe9; color: #6b6a64; }
.est.pendiente { background: #FAEEDA; color: #854F0B; } .est.aprobado { background: #E6F1FB; color: #185FA5; } .est.pagado { background: #E1F5EE; color: #0F6E56; } .est.rechazado { background: #FCEBEB; color: #A32D2D; }
.reg-pie button { background: none; border: none; color: #8a6d1e; font-size: 13px; cursor: pointer; padding: 4px; }
.boton.pronto { opacity: .6; }
.boton .pronto-et { font-size: 10px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: #8a6d1e; background: #f3ead9; border-radius: 8px; padding: 2px 7px; align-self: flex-start; }
.enlace-panel { display: block; text-align: center; margin-top: 22px; font-size: 13px; color: #6b6a64; }

/* Subir factura */
.acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.accion { background: #1a1a18; color: #fff; border: none; border-radius: 12px; padding: 18px 10px; font-size: 15px; font-weight: 500; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.accion.sec { background: #fff; color: #1a1a18; border: 0.5px solid #e2e2de; }
.accion svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.accion:active { opacity: .8; }
.campo label { display: block; font-size: 12px; color: #6b6a64; margin-bottom: 4px; }
.campo input { width: 100%; padding: 11px 12px; font-size: 16px; border: 0.5px solid #d8d4c8; border-radius: 10px; background: #fff; color: #1a1a18; }
.campo input:focus { outline: none; border-color: #1a1a18; }
.nota { font-size: 12px; color: #9a988f; margin-top: 6px; line-height: 1.4; }
.lista { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.item { background: #fff; border: 0.5px solid #e2e2de; border-radius: 12px; padding: 12px; display: flex; gap: 12px; align-items: flex-start; }
.item img, .item .pdf { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: #f0efe9; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #8a6d1e; }
.item .txt { flex: 1; min-width: 0; font-size: 13px; }
.item .nom { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .est { font-size: 12px; color: #6b6a64; margin-top: 3px; line-height: 1.4; }
.item.ok { border-color: #9FE1CB; background: #f4fcf9; }
.item.error .est { color: #A32D2D; }
.item.duplicada { border-color: #f0d9a8; background: #fdf8ee; }
.item .quitar { background: none; border: none; color: #9a988f; font-size: 18px; padding: 0 4px; cursor: pointer; }
.enviar { width: 100%; margin-top: 14px; padding: 15px; border: none; border-radius: 12px; background: #8a6d1e; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
.enviar:disabled { opacity: .5; }
</style>
</head>
<body>

<div id="arranque" class="cargando">Cargando…</div>

<div id="pin-screen" class="oculto">
  <div class="pin-box">
    <div class="pin-logo"><img src="/icons/orum-o.png?v=1" alt=""><span>ORUM CENTRAL</span></div>
    <div class="pin-sub">Introduce tu PIN</div>
    <div class="pin-dots"><div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div><div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div></div>
    <button class="btn-bio oculto" id="btn-bio" onclick="entrarConBio()"></button>
    <div class="bio-o oculto" id="bio-o">o teclea tu PIN</div>
    <div class="pin-err" id="pin-err"></div>
    <div class="pin-kp" id="pin-kp"></div>
    <label class="pin-recordar"><input type="checkbox" id="pin-recordar" checked> Recordar en este dispositivo</label>
    <div class="pin-pie"><a href="/">Entrar con contraseña</a></div>
  </div>
</div>

<div id="app" class="oculto">
  <div class="cab">
    <button id="btn-volver" class="oculto" onclick="irInicio()" aria-label="Volver">‹ Inicio</button>
    <h1 id="cab-titulo">ORUM</h1>
    <button id="btn-salir" onclick="salir()">Salir</button>
  </div>
  <div class="cuerpo" id="cuerpo"></div>
</div>

<script src="/recorte-documento.js"></script>
<input type="file" id="in-camara" accept="image/*" capture="environment" class="oculto">
<input type="file" id="in-archivo" accept="application/pdf,image/jpeg,image/png,image/webp" multiple class="oculto">

<script>
// App móvil de ORUM Central (oct 2026). Se entra con el PIN de 4 cifras de
// Sistema → Usuarios; "Recordar" guarda en el dispositivo una llave para
// volver a entrar solo (las sesiones del servidor se pierden en cada
// despliegue). Cada rol ve sus botones; las tablets de Lavandería y Office
// van directas a su zona de Preparación.
var CLAVE_DISPOSITIVO = 'orum_movil_dispositivo';
var USUARIO = null;
var ROLES_TABLET = ['Lavanderia', 'Office', 'Mantenimiento'];
// Estos roles solo tienen una pantalla: van directos a ella
var PANTALLA_ROL = { Lavanderia: '/preparacion', Office: '/preparacion', Mantenimiento: '/mantenimiento' };

function leerLlave() { try { return localStorage.getItem(CLAVE_DISPOSITIVO) || ''; } catch (e) { return ''; } }
function guardarLlave(v) { try { if (v) localStorage.setItem(CLAVE_DISPOSITIVO, v); else localStorage.removeItem(CLAVE_DISPOSITIVO); } catch (e) {} }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function postJson(url, body) {
  return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { d._status = r.status; return d; }); });
}
function mostrar(id) { ['arranque', 'pin-screen', 'app'].forEach(function (x) { document.getElementById(x).classList.toggle('oculto', x !== id); }); }

// ── Arranque: sesión abierta → dispositivo recordado → PIN ──
function arrancar() {
  if (leerBio() && !desbloqueada()) return pedirPin(true);
  fetch('/api/sesion').then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }).then(function (d) {
    if (d && d.usuario) return entrar(d.usuario);
    var llave = leerLlave();
    if (!llave) return pedirPin();
    postJson('/api/movil/dispositivo', { dispositivo: llave }).then(function (r) {
      if (r.ok) return entrar(r.usuario);
      if (r._status === 401) guardarLlave('');
      pedirPin();
    }).catch(pedirPin);
  });
}

// ── PIN ──
var pin = '';
function pedirPin(probarBio) {
  pin = ''; puntos(false); mostrar('pin-screen');
  var bio = !!leerBio() && hayBio;
  document.getElementById('btn-bio').classList.toggle('oculto', !bio);
  document.getElementById('bio-o').classList.toggle('oculto', !bio);
  document.getElementById('btn-bio').innerHTML = ICONO_BIO + 'Entrar con ' + nombreBio();
  if (bio && probarBio) entrarConBio(true);
}
(function teclado() {
  var kp = document.getElementById('pin-kp');
  ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'].forEach(function (k) {
    var b = document.createElement('button');
    if (k === '') b.className = 'pin-k vacia';
    else if (k === 'del') { b.className = 'pin-k borrar'; b.textContent = '⌫'; b.setAttribute('aria-label', 'Borrar'); b.onclick = function () { pin = pin.slice(0, -1); document.getElementById('pin-err').textContent = ''; puntos(false); }; }
    else { b.className = 'pin-k'; b.textContent = k; b.onclick = function () { tecla(k); }; }
    kp.appendChild(b);
  });
  document.addEventListener('keydown', function (e) {
    if (document.getElementById('pin-screen').classList.contains('oculto')) return;
    if (/^\d$/.test(e.key)) tecla(e.key);
    else if (e.key === 'Backspace') { pin = pin.slice(0, -1); puntos(false); }
  });
})();
function tecla(n) { if (pin.length >= 4) return; pin += n; puntos(false); if (pin.length === 4) comprobarPin(); }
function puntos(err) { for (var i = 0; i < 4; i++) { var d = document.getElementById('d' + i); d.className = 'pin-dot' + (err ? ' error' : (i < pin.length ? ' filled' : '')); } }
function comprobarPin() {
  var recordar = document.getElementById('pin-recordar').checked;
  postJson('/api/login-pin', { pin: pin, recordar: recordar }).then(function (r) {
    if (!r.ok) {
      document.getElementById('pin-err').textContent = r.error || 'PIN incorrecto';
      puntos(true);
      setTimeout(function () { pin = ''; puntos(false); }, 900);
      return;
    }
    guardarLlave(leerBio() ? '' : (r.dispositivo || ''));
    marcarDesbloqueada();
    entrar(r.usuario);
  }).catch(function () { document.getElementById('pin-err').textContent = 'Sin conexión'; pin = ''; puntos(true); });
}

function salir() {
  if (!confirm(leerBio() ? '¿Salir? Para volver a entrar usarás ' + nombreBio() + ' o tu PIN.' : '¿Salir? Tendrás que volver a teclear tu PIN en este dispositivo.')) return;
  postJson('/api/movil/salir', { dispositivo: leerLlave() }).catch(function () {}).then(function () {
    guardarLlave(''); USUARIO = null;
    try { sessionStorage.removeItem(CLAVE_DESBLOQUEO); } catch (e) {}
    pedirPin();
  });
}

// ── Face ID / huella (WebAuthn) ──
// El móvil guarda una llave que solo se usa tras reconocer la cara o la
// huella; el servidor guarda la parte pública (sql/movil_biometria.sql).
// Activado: se pide cada vez que se abre la app, en vez de entrar solo.
var CLAVE_BIO = 'orum_bio_id', CLAVE_BIO_NO = 'orum_bio_no', CLAVE_DESBLOQUEO = 'orum_desbloqueada';
var ICONO_BIO = '<svg viewBox="0 0 24 24"><path d="M7 3H5a2 2 0 0 0-2 2v2M17 3h2a2 2 0 0 1 2 2v2M7 21H5a2 2 0 0 1-2-2v-2M17 21h2a2 2 0 0 0 2-2v-2"/><path d="M9 9v1.5M15 9v1.5M12 9v4.5h-1M9.5 16.5a3.5 3.5 0 0 0 5 0"/></svg>';
var hayBio = false;
function leerBio() { try { return localStorage.getItem(CLAVE_BIO) || ''; } catch (e) { return ''; } }
function desbloqueada() { try { return sessionStorage.getItem(CLAVE_DESBLOQUEO) === '1'; } catch (e) { return false; } }
function marcarDesbloqueada() { try { sessionStorage.setItem(CLAVE_DESBLOQUEO, '1'); } catch (e) {} }
function nombreBio() { return /iPhone|iPad|Macintosh/.test(navigator.userAgent) ? 'Face ID' : 'huella'; }
function aB64u(buf) { var b = new Uint8Array(buf), t = ''; for (var i = 0; i < b.length; i++) t += String.fromCharCode(b[i]); return btoa(t).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function deB64u(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var t = atob(s), b = new Uint8Array(t.length); for (var i = 0; i < t.length; i++) b[i] = t.charCodeAt(i); return b; }
function errorBio(e) { return e && e.name === 'NotAllowedError' ? 'Cancelado' : (e && e.message) || 'No se ha podido'; }
async function activarBio() {
  try {
    var o = await postJson('/api/biometria/registro/opciones');
    if (!o.ok) throw new Error(o.error);
    var cred = await navigator.credentials.create({ publicKey: {
      challenge: deB64u(o.reto), rp: { name: 'ORUM Central', id: o.rpId },
      user: { id: deB64u(o.usuarioId), name: o.usuario, displayName: o.nombre },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
      attestation: 'none', timeout: 60000
    } });
    var r = cred.response;
    if (!r.getPublicKey) throw new Error('Este móvil es demasiado antiguo para ' + nombreBio());
    var g = await postJson('/api/biometria/registro', {
      id: cred.id, clientDataJSON: aB64u(r.clientDataJSON), authenticatorData: aB64u(r.getAuthenticatorData()),
      publicKey: aB64u(r.getPublicKey()), alg: r.getPublicKeyAlgorithm()
    });
    if (!g.ok) throw new Error(g.error);
    try { localStorage.setItem(CLAVE_BIO, cred.id); } catch (e) {}
    // Con Face ID / huella ya no se entra solo con la llave del dispositivo
    var llave = leerLlave();
    if (llave) { postJson('/api/movil/olvidar-dispositivo', { dispositivo: llave }).catch(function () {}); guardarLlave(''); }
    marcarDesbloqueada();
    alert(nombreBio() + ' activado. Desde ahora te lo pedirá al abrir la app.');
  } catch (e) { alert('No se ha activado ' + nombreBio() + ': ' + errorBio(e)); }
  irInicio();
}
async function entrarConBio(automatico) {
  var err = document.getElementById('pin-err');
  try {
    var o = await postJson('/api/biometria/entrar/opciones');
    var a = await navigator.credentials.get({ publicKey: {
      challenge: deB64u(o.reto), rpId: o.rpId, userVerification: 'required', timeout: 60000,
      allowCredentials: [{ type: 'public-key', id: deB64u(leerBio()) }]
    } });
    var r = await postJson('/api/biometria/entrar', {
      id: a.id, clientDataJSON: aB64u(a.response.clientDataJSON), authenticatorData: aB64u(a.response.authenticatorData), signature: aB64u(a.response.signature)
    });
    if (!r.ok) {
      if (r._status === 401 && /no activado/.test(r.error || '')) { try { localStorage.removeItem(CLAVE_BIO); } catch (e) {} pedirPin(); }
      err.textContent = r.error || 'No se ha podido entrar';
      return;
    }

}

// Las fotos pasan antes por el recorte (public/recorte-documento.js): se
// queda solo la hoja de la factura. De una en una si se eligen varias.
async function anadirArchivos(files) {
  for (var file of [].slice.call(files || [])) {
    var valido = /^(application\/pdf|image\/)/.test(file.type) || /\.pdf$/i.test(file.name);
    if (valido && /^image\//.test(file.type)) file = await recortarDocumento(file);
    subidas.push({ file: file, estado: valido ? 'pendiente' : 'error', mensaje: valido ? 'Lista para subir' : 'Formato no admitido (solo PDF o foto)', vista: /^image\//.test(file.type) ? URL.createObjectURL(file) : null });
    pintarSubidas();
  }
}
document.getElementById('in-camara').onchange = function () { anadirArchivos(this.files); this.value = ''; };
document.getElementById('in-archivo').onchange = function () { anadirArchivos(this.files); this.value = ''; };
function pintarSubidas() {
  var cont = document.getElementById('f-lista');
  if (!cont) return;
  cont.innerHTML = subidas.map(function (x, i) {
    var mini = x.vista ? '<img src="' + x.vista + '" alt="">' : '<div class="pdf">PDF</div>';
    var quitar = (x.estado === 'pendiente' || x.estado === 'error') && !subiendo ? '<button class="quitar" onclick="subidas.splice(' + i + ',1); pintarSubidas();" aria-label="Quitar">×</button>' : '';
    return '<div class="item ' + x.estado + '">' + mini + '<div class="txt"><div class="nom">' + esc(x.file.name) + '</div><div class="est">' + x.mensaje + '</div></div>' + quitar + '</div>';
  }).join('');
  var hay = subidas.some(function (x) { return x.estado === 'pendiente'; });
  var btn = document.getElementById('f-enviar');
  btn.classList.toggle('oculto', !hay && !subiendo);
  btn.disabled = subiendo;
  btn.textContent = subiendo ? 'Subiendo…' : 'Subir y leer (' + subidas.filter(function (x) { return x.estado === 'pendiente'; }).length + ')';
}
function prepararArchivo(file) {
  if (!/^image\//.test(file.type)) return Promise.resolve(file);
  return new Promise(function (ok, ko) { var i = new Image(); i.onload = function () { ok(i); }; i.onerror = function () { ko(new Error('No se puede abrir la foto')); }; i.src = URL.createObjectURL(file); })
    .then(function (img) {
      var escala = Math.min(1, 2400 / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * escala); c.height = Math.round(img.height * escala);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return new Promise(function (ok) { c.toBlob(ok, 'image/jpeg', 0.85); });
    })
    .then(function (blob) { return new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }); });
}
function euros(n) { return n == null || n === '' ? '' : Number(n).toLocaleString('es-ES', { style: 'currency', currency: 'EUR' }); }
async function enviarFacturas() {
  if (subiendo) return;
  subiendo = true;
  var proveedor = document.getElementById('f-proveedor').value.trim();
  for (var x of subidas.filter(function (y) { return y.estado === 'pendiente'; })) {
    x.estado = 'subiendo'; x.mensaje = 'Subiendo y leyendo con la IA…'; pintarSubidas();
    try {
      var fd = new FormData();
      fd.append('archivo', await prepararArchivo(x.file));
      fd.append('proveedor', proveedor);
      var r = await fetch('/api/facturas-proveedores/subir', { method: 'POST', body: fd });
      var d = await r.json().catch(function () { return { error: 'El servidor respondió ' + r.status }; });
      if (r.status === 401) { x.estado = 'pendiente'; x.mensaje = 'La sesión ha caducado: vuelve a entrar y pulsa Subir otra vez'; subiendo = false; pintarSubidas(); return arrancar(); }
      if (d.duplicada) { x.estado = 'duplicada'; x.mensaje = 'Ya estaba subida (' + esc(d.proveedor) + ' nº ' + esc(d.numero || '') + '): no se ha guardado otra vez'; }
      else if (!r.ok || d.error) { x.estado = 'error'; x.mensaje = esc(d.error || 'Error'); }
      else if (d.adjuntado) { x.estado = 'ok'; x.mensaje = 'Ya estaba cargada sin archivo: se le ha adjuntado esta (' + esc(d.proveedor) + ')'; }
      else {
        var l = d.lectura || {};
        x.estado = 'ok';
        x.mensaje = '<b>' + esc(d.proveedor) + '</b>' + (d.proveedor_nuevo ? ' (nuevo)' : '') + ' · nº ' + esc(l.numero || '—') + ' · ' + esc(l.fecha || '') + ' · ' + euros(l.total) + (l.confianza === 'baja' ? '<br>⚠ Lectura dudosa: la revisarán en el panel' : '');
      }
    } catch (e) { x.estado = 'error'; x.mensaje = 'Sin conexión: ' + esc(e.message); }
    pintarSubidas();
  }
  subiendo = false;
  pintarSubidas();
}

if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('/movil-sw.js', { scope: '/movil' }).catch(function () {}); });
arrancar();
